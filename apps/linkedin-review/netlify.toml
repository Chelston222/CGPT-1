[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' https: data:; connect-src 'self' https://api.github.com; script-src 'self'; style-src 'self'; base-uri 'self'; form-action https://github.com; frame-ancestors 'none'"

[[headers]]
  for = "/queue.json"
  [headers.values]
    Cache-Control = "no-store"
