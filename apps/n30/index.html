<!doctype html><html lang="en-GB"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102a43"><meta name="description" content="N30 adaptive GCSE learning platform"><title>N30 · Learning OS</title><style>html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f3ed;color:#102a43}#boot{min-height:100vh;display:grid;place-items:center;padding:24px}.card{max-width:560px;background:#fffdfa;border:1px solid #dde4e8;border-radius:24px;padding:28px;box-shadow:0 18px 48px rgba(16,42,67,.08)}.mark{width:48px;height:48px;border-radius:15px;background:#0d2b45;color:#fff;display:grid;place-items:center;font-weight:900;margin-bottom:18px}h1{margin:0 0 8px;font-size:28px}p{color:#66788a;line-height:1.55}.bar{height:8px;background:#e8efff;border-radius:99px;overflow:hidden;margin-top:20px}.bar:before{content:"";display:block;width:45%;height:100%;background:#1f5eff;border-radius:99px;animation:l 1s ease-in-out infinite alternate}@keyframes l{to{transform:translateX(120%)}}</style></head><body><div id="boot"><div class="card"><div class="mark">N30</div><h1>Loading your learning space…</h1><p>N30 is preparing your curriculum, progress and next best lesson.</p><div class="bar"></div></div></div><script>(async()=>{try{if(!('DecompressionStream'in window))throw new Error('This browser needs an update before N30 can start.');const files=['payload-0.txt','payload-1.txt','payload-2.txt','payload-3.txt','payload-4.txt'];const responses=await Promise.all(files.map(f=>fetch(f,{cache:'no-store'})));if(responses.some(r=>!r.ok))throw new Error('One of N30’s application files could not be loaded.');const b64=(await Promise.all(responses.map(r=>r.text()))).join('');const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(err){document.getElementById('boot').innerHTML='<div class="card"><div class="mark">N30</div><h1>N30 could not start</h1><p>'+String(err.message||err)+'</p><p>Please refresh once. If this remains, open N30 in an up-to-date Safari, Chrome or Edge browser.</p></div>';console.error(err)}})();</script></body></html>
