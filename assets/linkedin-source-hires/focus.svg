<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#050505"/>
  <g fill="#f7f7f7" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-weight="800">
    <text x="540" y="230" font-size="72">Don’t let a good day</text>
    <text x="540" y="315" font-size="72">make you lazy</text>
    <text x="540" y="400" font-size="72">or a bad day</text>
    <text x="540" y="485" font-size="72">make you quit.</text>

    <text x="540" y="650" font-size="78">Wins teach.</text>
    <text x="540" y="742" font-size="78">Losses teach.</text>
    <text x="540" y="834" font-size="78">The mission stays</text>
    <text x="540" y="926" font-size="78">the mission.</text>

    <text x="540" y="1095" font-size="76">Stick to the plan.</text>
    <text x="510" y="1185" font-size="76">Stay focused</text>
  </g>
  <text x="806" y="1185" fill="#ff3333" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="900">!!</text>
  <text x="540" y="1292" fill="#f7f7f7" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="26" font-weight="700" letter-spacing="2">222Emails</text>
</svg>
