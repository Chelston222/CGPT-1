name: LinkedIn PDF Red Team Diagnostics

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix apps/linkedin-review --ignore-scripts --no-audit --no-fund
      - name: Capture authoritative suite output
        shell: bash
        run: |
          set +e
          node --test tests/linkedin-*.test.cjs tests/rr14-content-pool.test.cjs > /tmp/linkedin-tests.log 2>&1
          status=$?
          cat /tmp/linkedin-tests.log
          echo "$status" > /tmp/test-exit-code.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: linkedin-red-team-test-log
          path: |
            /tmp/linkedin-tests.log
            /tmp/test-exit-code.txt
          retention-days: 1
