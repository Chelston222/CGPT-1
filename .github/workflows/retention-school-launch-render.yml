name: Render Retention School 4K launch visual

on:
  push:
    paths:
      - 'apps/linkedin-review/media/retention-school-launch.svg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Render 4K PNG
        run: |
          rsvg-convert -w 3840 -h 3840 apps/linkedin-review/media/retention-school-launch.svg > apps/linkedin-review/media/retention-school-launch-4k.png
      - name: Commit rendered media
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/linkedin-review/media/retention-school-launch-4k.png
          git diff --cached --quiet || git commit -m 'Render Retention School 4K launch media'
          git push
