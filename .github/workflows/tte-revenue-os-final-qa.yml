name: TTE Revenue OS Final QA

on:
  pull_request:
    paths:
      - 'apps/tte-klaviyo/master-library/**'
      - '.github/workflows/tte-revenue-os-final-qa.yml'
      - '.github/workflows/tte-client-draft-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'apps/tte-klaviyo/master-library/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run complete regression and negative-path gate
        working-directory: apps/tte-klaviyo/master-library
        run: python run_final_qa.py
