name: TTE Klaviyo Create APEX V2 Pre-Live Flow

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tte-klaviyo-create-flow-draft.yml'

permissions:
  contents: read

jobs:
  create-draft-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run source APEX QA
        run: python apps/tte-klaviyo/source_audit.py

      - name: Create APEX V2 pre-live five-email flow in draft only
        env:
          KLAVIYO_PRIVATE_API_KEY: ${{ secrets.KLAVIYO_PRIVATE_API_KEY }}
          TTE_FLOW_NAME: TTE Flagship Welcome Series | APEX V2 | PRE-LIVE
        run: python apps/tte-klaviyo/create_welcome_flow.py
