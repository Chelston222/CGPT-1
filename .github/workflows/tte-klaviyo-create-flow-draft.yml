name: TTE Klaviyo Create Pre-Live Draft Flow

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-draft-flow:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Run source QA
        run: |
          python apps/tte-klaviyo/source_audit.py
          python apps/tte-klaviyo/integration_source_audit.py
      - name: Create pre-live five-email flow in Draft only
        env:
          KLAVIYO_PRIVATE_API_KEY: ${{ secrets.KLAVIYO_PRIVATE_API_KEY }}
          TTE_FLOW_NAME: TTE Flagship Welcome Series | APEX V2 | PRE-LIVE
        run: python apps/tte-klaviyo/create_welcome_flow.py
