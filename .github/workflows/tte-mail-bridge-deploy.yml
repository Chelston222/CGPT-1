name: TTE Mail Bridge Apex Deploy

on:
  # Production deployment is deliberately explicit. Code changes are verified
  # before release and do not consume a Netlify production deploy automatically.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tte-mail-bridge-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: e531326d-60b8-4def-85b9-727a7f708547
      TTE_BRIDGE_TOKEN: ${{ secrets.TTE_BRIDGE_TOKEN }}
      TTE_TOKEN_ENCRYPTION_KEY: ${{ secrets.TTE_TOKEN_ENCRYPTION_KEY }}
      TTE_TOKEN_ENCRYPTION_KEY_PREVIOUS: ${{ secrets.TTE_TOKEN_ENCRYPTION_KEY_PREVIOUS }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      TTE_SMTP_USER: ${{ secrets.TTE_SMTP_USER }}
      TTE_SMTP_PASS: ${{ secrets.TTE_SMTP_PASS }}
      TTE_SMTP_HOST: ${{ secrets.TTE_SMTP_HOST }}
      TTE_SMTP_PORT: ${{ secrets.TTE_SMTP_PORT }}
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
    defaults:
      run:
        working-directory: apps/tte-mail-bridge
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify deployment authority
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NETLIFY_AUTH_TOKEN:-}" || { echo 'NETLIFY_AUTH_TOKEN is missing'; exit 2; }
          if [ -n "${TTE_BRIDGE_TOKEN:-}" ]; then test ${#TTE_BRIDGE_TOKEN} -ge 24 || { echo 'TTE_BRIDGE_TOKEN must be at least 24 characters'; exit 2; }; fi
          if [ -n "${TTE_TOKEN_ENCRYPTION_KEY:-}" ]; then test ${#TTE_TOKEN_ENCRYPTION_KEY} -ge 24 || { echo 'TTE_TOKEN_ENCRYPTION_KEY must be at least 24 characters'; exit 2; }; fi
          if [ -n "${TTE_BRIDGE_TOKEN:-}" ] && [ -n "${TTE_TOKEN_ENCRYPTION_KEY:-}" ]; then [ "$TTE_BRIDGE_TOKEN" != "$TTE_TOKEN_ENCRYPTION_KEY" ] || { echo 'Bridge token and encryption key must be different'; exit 2; }; fi
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Re-run APEX verification before deployment
        run: npm run verify
      - name: Reconcile production runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          ENV_JSON=$(npx netlify env:list --context production --json --site "$NETLIFY_SITE_ID")

          has_key() {
            printf '%s' "$ENV_JSON" | grep -Fq "\"$1\""
          }

          # Never overwrite durable runtime secrets with empty Actions values.
          if [ -n "${TTE_BRIDGE_TOKEN:-}" ]; then
            npx netlify env:set TTE_BRIDGE_TOKEN "$TTE_BRIDGE_TOKEN" --secret --context production --site "$NETLIFY_SITE_ID"
          elif ! has_key TTE_BRIDGE_TOKEN; then
            GENERATED_BRIDGE=$(node -e "process.stdout.write(require('node:crypto').randomBytes(48).toString('base64url'))")
            npx netlify env:set TTE_BRIDGE_TOKEN "$GENERATED_BRIDGE" --secret --context production --site "$NETLIFY_SITE_ID"
          fi

          if [ -n "${TTE_TOKEN_ENCRYPTION_KEY:-}" ]; then
            npx netlify env:set TTE_TOKEN_ENCRYPTION_KEY "$TTE_TOKEN_ENCRYPTION_KEY" --secret --context production --site "$NETLIFY_SITE_ID"
          elif ! has_key TTE_TOKEN_ENCRYPTION_KEY; then
            GENERATED_ENCRYPTION=$(node -e "process.stdout.write(require('node:crypto').randomBytes(48).toString('base64url'))")
            npx netlify env:set TTE_TOKEN_ENCRYPTION_KEY "$GENERATED_ENCRYPTION" --secret --context production --site "$NETLIFY_SITE_ID"
          fi

          if [ -n "${TTE_TOKEN_ENCRYPTION_KEY_PREVIOUS:-}" ]; then npx netlify env:set TTE_TOKEN_ENCRYPTION_KEY_PREVIOUS "$TTE_TOKEN_ENCRYPTION_KEY_PREVIOUS" --secret --context production --site "$NETLIFY_SITE_ID"; fi
          if [ -n "${GOOGLE_OAUTH_CLIENT_ID:-}" ]; then npx netlify env:set GOOGLE_OAUTH_CLIENT_ID "$GOOGLE_OAUTH_CLIENT_ID" --secret --context production --site "$NETLIFY_SITE_ID"; fi
          if [ -n "${GOOGLE_OAUTH_CLIENT_SECRET:-}" ]; then npx netlify env:set GOOGLE_OAUTH_CLIENT_SECRET "$GOOGLE_OAUTH_CLIENT_SECRET" --secret --context production --site "$NETLIFY_SITE_ID"; fi

          npx netlify env:set AWS_LAMBDA_JS_RUNTIME "nodejs24.x" --context production --site "$NETLIFY_SITE_ID"
          npx netlify env:set TTE_GLOBAL_DAILY_CAP "100" --context production --site "$NETLIFY_SITE_ID"
          npx netlify env:set TTE_DOMAIN_DAILY_CAP "4" --context production --site "$NETLIFY_SITE_ID"
          npx netlify env:set TTE_DISPATCH_BATCH_SIZE "1" --context production --site "$NETLIFY_SITE_ID"
          npx netlify env:set TTE_SCHEDULED_DISPATCH "true" --context production --site "$NETLIFY_SITE_ID"
          npx netlify env:set TTE_ALLOW_MANUAL_DISPATCH "false" --context production --site "$NETLIFY_SITE_ID"
          npx netlify env:set TTE_QUEUE_MAX_SIZE "500" --context production --site "$NETLIFY_SITE_ID"
          npx netlify env:set TTE_QUEUE_TERMINAL_RETENTION_DAYS "90" --context production --site "$NETLIFY_SITE_ID"
          npx netlify env:set TTE_SENT_COUNTER_RETENTION_DAYS "35" --context production --site "$NETLIFY_SITE_ID"
          npx netlify env:set TTE_AUDIT_RETENTION_DAYS "90" --context production --site "$NETLIFY_SITE_ID"
          npx netlify env:set TTE_STALE_IN_FLIGHT_MINUTES "20" --context production --site "$NETLIFY_SITE_ID"
          npx netlify env:set TTE_SEND_WINDOW_ENABLED "true" --context production --site "$NETLIFY_SITE_ID"
          npx netlify env:set TTE_SEND_START_HOUR "8" --context production --site "$NETLIFY_SITE_ID"
          npx netlify env:set TTE_SEND_END_HOUR "18" --context production --site "$NETLIFY_SITE_ID"
          npx netlify env:set TTE_DIRECT_DAILY_CAP "20" --context production --site "$NETLIFY_SITE_ID"
          npx netlify env:set TTE_SMTP_ROLLING_24H_CAP "20" --context production --site "$NETLIFY_SITE_ID"
          npx netlify env:set TTE_SMTP_MIN_INTERVAL_MINUTES "4" --context production --site "$NETLIFY_SITE_ID"

          if [ -n "${TTE_SMTP_PASS:-}" ]; then
            npx netlify env:set TTE_SMTP_PASS "$TTE_SMTP_PASS" --secret --context production --site "$NETLIFY_SITE_ID"
            npx netlify env:set TTE_SMTP_USER "${TTE_SMTP_USER:-hello@222emails.com}" --context production --site "$NETLIFY_SITE_ID"
            npx netlify env:set TTE_SMTP_HOST "${TTE_SMTP_HOST:-mail.privateemail.com}" --context production --site "$NETLIFY_SITE_ID"
            npx netlify env:set TTE_SMTP_PORT "${TTE_SMTP_PORT:-465}" --context production --site "$NETLIFY_SITE_ID"
          fi
      - name: Deploy current mail bridge snapshot
        shell: bash
        run: |
          set -euo pipefail
          if npx netlify deploy --prod --dir=public --functions=netlify/functions --site "$NETLIFY_SITE_ID"; then
            echo 'Standard production deployment succeeded.'
            exit 0
          fi

          echo 'Standard deployment denied. Using the one-time owner-authorised recovery path.'
          RECOVERY_PAGE_ID='3d4e72eb858781dfab22f923748c4018'
          PROXY_PATH="$(npx netlify env:get TTE_DEPLOY_PROXY_ONCE --context dev --site "$NETLIFY_SITE_ID" 2>/dev/null || true)"

          valid_proxy() {
            [ -n "$1" ] && printf '%s' "$1" | grep -Eq '^https://netlify-mcp\.netlify\.app/proxy/'
          }

          if ! valid_proxy "$PROXY_PATH" && [ -n "${NOTION_API_KEY:-}" ]; then
            PAGE_JSON="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $NOTION_API_KEY" \
              -H 'Notion-Version: 2022-06-28' \
              -H 'Accept: application/json' \
              "https://api.notion.com/v1/pages/$RECOVERY_PAGE_ID" || true)"
            PROXY_PATH="$(printf '%s' "$PAGE_JSON" | jq -r '.properties["Sync Error"].rich_text // [] | map(.plain_text // "") | join("")' 2>/dev/null || true)"
          fi

          if ! valid_proxy "$PROXY_PATH"; then
            echo 'One-time recovery path is unavailable or invalid.'
            exit 3
          fi
          echo "::add-mask::$PROXY_PATH"

          cleanup_recovery() {
            npx netlify env:unset TTE_DEPLOY_PROXY_ONCE --context dev --site "$NETLIFY_SITE_ID" --force >/dev/null 2>&1 || true
            if [ -n "${NOTION_API_KEY:-}" ]; then
              curl --silent --show-error --request PATCH \
                -H "Authorization: Bearer $NOTION_API_KEY" \
                -H 'Notion-Version: 2022-06-28' \
                -H 'Content-Type: application/json' \
                --data '{"properties":{"Sync Error":{"rich_text":[]}}}' \
                "https://api.notion.com/v1/pages/$RECOVERY_PAGE_ID" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_recovery EXIT

          SNAPSHOT=$(mktemp -d)
          cp -a . "$SNAPSHOT/app"
          cd "$SNAPSHOT/app"
          git init -q
          git config user.name 'TTE Release Recovery'
          git config user.email 'release-recovery@222emails.invalid'
          git add -A
          git commit -qm 'TTE mail bridge production snapshot'
          npx -y @netlify/mcp@latest --site-id "$NETLIFY_SITE_ID" --proxy-path "$PROXY_PATH"

          cd - >/dev/null
      - name: Verify LinkedIn private media bridge
        shell: bash
        run: |
          set -euo pipefail
          BRIDGE_TOKEN="$(npx netlify env:get TTE_BRIDGE_TOKEN --context production --site "$NETLIFY_SITE_ID")"
          test ${#BRIDGE_TOKEN} -ge 24 || { echo 'Production bridge token is unavailable'; exit 2; }
          echo "::add-mask::$BRIDGE_TOKEN"
          export BRIDGE_TOKEN

          printf '%%PDF-1.4\n%% 222Emails LinkedIn media bridge canary\n' > /tmp/linkedin-media-canary.pdf
          SHA="$(sha256sum /tmp/linkedin-media-canary.pdf | awk '{print $1}')"
          BYTES="$(stat -c%s /tmp/linkedin-media-canary.pdf)"
          ID="li-smoke-${GITHUB_RUN_ID}"
          CAP="$(SHA_VALUE="$SHA" node -e "const c=require('node:crypto');process.stdout.write(c.createHmac('sha256',process.env.BRIDGE_TOKEN).update('linkedin-media:'+process.env.SHA_VALUE).digest('base64url'))")"
          BASE='https://222emails-mail-bridge.netlify.app/api/tte/linkedin-media-bridge'

          curl --fail --silent --show-error --request PUT \
            -H "Authorization: Bearer $BRIDGE_TOKEN" \
            --data-binary @/tmp/linkedin-media-canary.pdf \
            "$BASE?id=$ID&part=1" >/tmp/media-put.json

          jq -n \
            --argjson bytes "$BYTES" \
            --arg sha "$SHA" \
            --arg cap "$CAP" \
            '{parts:1,expectedBytes:$bytes,expectedSha256:$sha,capability:$cap,contentType:"application/pdf",filename:"linkedin-media-canary.pdf"}' >/tmp/media-finalise.json

          curl --fail --silent --show-error --request POST \
            -H "Authorization: Bearer $BRIDGE_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/media-finalise.json \
            "$BASE?id=$ID" >/tmp/media-post.json

          curl --fail --silent --show-error --location \
            "$BASE?id=$ID&cap=$CAP" -o /tmp/linkedin-media-canary-returned.pdf

          test "$(sha256sum /tmp/linkedin-media-canary-returned.pdf | awk '{print $1}')" = "$SHA"
          test "$(stat -c%s /tmp/linkedin-media-canary-returned.pdf)" = "$BYTES"

          curl --fail --silent --show-error --request DELETE \
            -H "Authorization: Bearer $BRIDGE_TOKEN" \
            "$BASE?id=$ID" >/tmp/media-delete.json

          echo 'LinkedIn private media bridge canary PASS'

      - name: Verify production health surface
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-delay 3 https://222emails-mail-bridge.netlify.app/api/tte/health | tee /tmp/tte-health.json
          node -e "const h=require('/tmp/tte-health.json'); if(h.service!=='tte-mail-bridge')process.exit(1); if(h.status!=='READY')process.exit(2); if(!h.transportConfigured)process.exit(3); console.log('READY',h.version,'mode='+h.mode)"
