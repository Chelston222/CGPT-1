name: TTE Mail Bridge Apex Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/tte-mail-bridge/**'
      - '.github/workflows/tte-mail-bridge-deploy.yml'

permissions:
  contents: read

concurrency:
  group: tte-mail-bridge-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: e531326d-60b8-4def-85b9-727a7f708547
      TTE_BRIDGE_TOKEN: ${{ secrets.TTE_BRIDGE_TOKEN }}
      TTE_TOKEN_ENCRYPTION_KEY: ${{ secrets.TTE_TOKEN_ENCRYPTION_KEY }}
      TTE_TOKEN_ENCRYPTION_KEY_PREVIOUS: ${{ secrets.TTE_TOKEN_ENCRYPTION_KEY_PREVIOUS }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      TTE_SMTP_USER: ${{ secrets.TTE_SMTP_USER }}
      TTE_SMTP_PASS: ${{ secrets.TTE_SMTP_PASS }}
      TTE_SMTP_HOST: ${{ secrets.TTE_SMTP_HOST }}
      TTE_SMTP_PORT: ${{ secrets.TTE_SMTP_PORT }}
    defaults:
      run:
        working-directory: apps/tte-mail-bridge
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify deployment authority
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NETLIFY_AUTH_TOKEN:-}" || { echo 'NETLIFY_AUTH_TOKEN is missing'; exit 2; }
          if [ -n "${TTE_BRIDGE_TOKEN:-}" ]; then test ${#TTE_BRIDGE_TOKEN} -ge 24 || { echo 'TTE_BRIDGE_TOKEN must be at least 24 characters'; exit 2; }; fi
          if [ -n "${TTE_TOKEN_ENCRYPTION_KEY:-}" ]; then test ${#TTE_TOKEN_ENCRYPTION_KEY} -ge 24 || { echo 'TTE_TOKEN_ENCRYPTION_KEY must be at least 24 characters'; exit 2; }; fi
          if [ -n "${TTE_BRIDGE_TOKEN:-}" ] && [ -n "${TTE_TOKEN_ENCRYPTION_KEY:-}" ]; then [ "$TTE_BRIDGE_TOKEN" != "$TTE_TOKEN_ENCRYPTION_KEY" ] || { echo 'Bridge token and encryption key must be different'; exit 2; }; fi
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Re-run APEX verification before deployment
        run: npm run verify
      - name: Sync non-destructive runtime configuration to Netlify
        shell: bash
        run: |
          set -euo pipefail
          # Runtime secrets are allowed to live in Netlify even when the matching
          # GitHub secret is absent. Never overwrite an existing Netlify secret
          # with an empty Actions value.
          if [ -n "${TTE_BRIDGE_TOKEN:-}" ]; then npx netlify env:set TTE_BRIDGE_TOKEN "$TTE_BRIDGE_TOKEN" --secret --context production; fi
          if [ -n "${TTE_TOKEN_ENCRYPTION_KEY:-}" ]; then npx netlify env:set TTE_TOKEN_ENCRYPTION_KEY "$TTE_TOKEN_ENCRYPTION_KEY" --secret --context production; fi
          if [ -n "${TTE_TOKEN_ENCRYPTION_KEY_PREVIOUS:-}" ]; then npx netlify env:set TTE_TOKEN_ENCRYPTION_KEY_PREVIOUS "$TTE_TOKEN_ENCRYPTION_KEY_PREVIOUS" --secret --context production; fi
          if [ -n "${GOOGLE_OAUTH_CLIENT_ID:-}" ]; then npx netlify env:set GOOGLE_OAUTH_CLIENT_ID "$GOOGLE_OAUTH_CLIENT_ID" --secret --context production; fi
          if [ -n "${GOOGLE_OAUTH_CLIENT_SECRET:-}" ]; then npx netlify env:set GOOGLE_OAUTH_CLIENT_SECRET "$GOOGLE_OAUTH_CLIENT_SECRET" --secret --context production; fi
          npx netlify env:set AWS_LAMBDA_JS_RUNTIME "nodejs24.x" --context production
          npx netlify env:set TTE_GLOBAL_DAILY_CAP "100" --context production
          npx netlify env:set TTE_DOMAIN_DAILY_CAP "4" --context production
          npx netlify env:set TTE_DISPATCH_BATCH_SIZE "1" --context production
          npx netlify env:set TTE_SCHEDULED_DISPATCH "true" --context production
          npx netlify env:set TTE_ALLOW_MANUAL_DISPATCH "false" --context production
          npx netlify env:set TTE_QUEUE_MAX_SIZE "500" --context production
          npx netlify env:set TTE_QUEUE_TERMINAL_RETENTION_DAYS "90" --context production
          npx netlify env:set TTE_SENT_COUNTER_RETENTION_DAYS "35" --context production
          npx netlify env:set TTE_AUDIT_RETENTION_DAYS "90" --context production
          npx netlify env:set TTE_STALE_IN_FLIGHT_MINUTES "20" --context production
          npx netlify env:set TTE_SEND_WINDOW_ENABLED "true" --context production
          npx netlify env:set TTE_SEND_START_HOUR "8" --context production
          npx netlify env:set TTE_SEND_END_HOUR "18" --context production
          if [ -n "${TTE_SMTP_PASS:-}" ]; then
            npx netlify env:set TTE_SMTP_PASS "$TTE_SMTP_PASS" --secret --context production
            npx netlify env:set TTE_SMTP_USER "${TTE_SMTP_USER:-hello@222emails.com}" --context production
            npx netlify env:set TTE_SMTP_HOST "${TTE_SMTP_HOST:-mail.privateemail.com}" --context production
            npx netlify env:set TTE_SMTP_PORT "${TTE_SMTP_PORT:-465}" --context production
          fi
      - name: Deploy existing mail bridge project
        run: npx netlify deploy --prod --dir=public --functions=netlify/functions --site "$NETLIFY_SITE_ID"
      - name: Verify production health surface
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 3 https://222emails-mail-bridge.netlify.app/api/tte/health | tee /tmp/tte-health.json
          node -e "const h=require('/tmp/tte-health.json'); if(!h.service || h.service!=='tte-mail-bridge') process.exit(1); if(!['READY','CONFIG_REQUIRED'].includes(h.status)) process.exit(2); console.log('health:',h.status,'version:',h.version)"
