name: TTE Klaviyo Smoke Test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tte-klaviyo-smoke-test.yml'
      - 'apps/tte-klaviyo/klaviyo_smoke_test.py'
      - 'apps/tte-klaviyo/fetch_flow_blueprint.py'

permissions:
  contents: read

jobs:
  klaviyo-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run safe Klaviyo API test
        env:
          KLAVIYO_PRIVATE_API_KEY: ${{ secrets.KLAVIYO_PRIVATE_API_KEY }}
        run: python apps/tte-klaviyo/klaviyo_smoke_test.py

      - name: Fetch existing welcome flow blueprint
        env:
          KLAVIYO_PRIVATE_API_KEY: ${{ secrets.KLAVIYO_PRIVATE_API_KEY }}
          KLAVIYO_SOURCE_FLOW_ID: XDpEah
        run: python apps/tte-klaviyo/fetch_flow_blueprint.py
