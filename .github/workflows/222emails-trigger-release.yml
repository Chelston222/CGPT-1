name: Trigger 222Emails Omega Max release

on:
  push:
    paths:
      - '.github/workflows/222emails-trigger-release.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch production release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/222emails-production-deploy.yml/dispatches \
            -d '{"ref":"main"}'
          echo 'Production release workflow dispatched.'
