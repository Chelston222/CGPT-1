name: Diagnose Omega Max exact source

on:
  push:
    paths:
      - '.github/workflows/222emails-source-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fingerprint approved anchors in current segment
        working-directory: apps/222emails-omega-max
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          data=Path('release-parts/brand.01.part').read_bytes()
          anchors={
          0:b"export const MONOGRAM = 'data:image/webp;base64,",
          1000:b'JcEL4SU2moCYxC4wFx1gCYxC4wFx1gCYxC4wFx1gCYxCnDM4',
          2000:b'AGwXuQRzUZ5OCogc7tuf7A/MrzD914fhvAExiFxgLjrfftSR',
          3000:b'/6sBY5rXAZ/k2OS0uEGiypjpiadtCKyLyP++M4CXhItikKaQ',
          4000:b'AuSx6TIXGAuOsATGIXGAuOsAThELQhT4CvFUANmiaVpUPGcS',
          5000:b'codCGROQVh4ItuB+r7qagJjELjAYefHpPpC4wFx1gCYxC4wF',
          6000:b'k9Vl6IWiqy9ELRVZeiFoqsvRC0VWXohaKrL0QCK6gJjELjAX',
          7000:b'oY0vYzxyjAAAAAA4KRZFKuQ7wb3qakUfJ0aKrXLI+r7NC/SD',
          8000:b'ThOnaJ5WGj8mkvnBhbayIgTqGtoEzCDuYlO6XdXN0hd/KdIG',
          9000:b'HH29VFQxH7qRl5mS/yl3fJpDuX7n3kL18qShZo3L4J7eXkt0',
          10000:b'8/hg6mpvPPkAmkQQ1p1r0JgY+VekeMyGNPkKjrP0PhlW7WIZ',
          11000:b'wutIeCBsXnaUff6uNMibjm3/Cz6DkgmOcV2tqF+gw/89vVag',
          }
          print('bytes',len(data))
          for expected,a in anchors.items():
              pos=data.find(a)
              print(f'anchor expected={expected} found={pos} delta={pos-expected if pos>=0 else "NA"}')
          PY
