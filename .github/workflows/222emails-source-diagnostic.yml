name: Diagnose Omega Max exact source

on:
  push:
    paths:
      - '.github/workflows/222emails-source-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate raw brand reconstruction
        working-directory: apps/222emails-omega-max
        shell: bash
        run: |
          set -euo pipefail
          echo "brand01=$(git hash-object release-parts/brand.01.part) bytes=$(wc -c < release-parts/brand.01.part)"
          for i in 02 03 04 05 06 07; do
            echo "brand${i}=$(git hash-object release-parts/brand.${i}.part) bytes=$(wc -c < release-parts/brand.${i}.part)"
          done
          cat release-parts/brand.01.part release-parts/brand.02.part release-parts/brand.03.part release-parts/brand.04.part release-parts/brand.05.part release-parts/brand.06.part release-parts/brand.07.part > /tmp/brand.ts
          printf '\n' >> /tmp/brand.ts
          echo "brand=$(git hash-object /tmp/brand.ts) bytes=$(wc -c < /tmp/brand.ts)"
          test "$(git hash-object /tmp/brand.ts)" = "2c4492916260be22ebf248f49f7a080cdd4303b6"
