name: Diagnose Omega Max exact source

on:
  push:
    paths:
      - '.github/workflows/222emails-source-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Print corrupted windows only
        working-directory: apps/222emails-omega-max
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          d=Path('release-parts/brand.01.part').read_bytes()
          print('WINDOW_A',repr(d[4970:5140]))
          print('WINDOW_B',repr(d[11840:]))
          PY
