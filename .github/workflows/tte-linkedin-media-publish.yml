name: Retired standalone LinkedIn media deploy

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  retired:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && startsWith(github.event.issue.title, '[DEPLOY LINKEDIN MEDIA]') && github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    steps:
      - name: Stop duplicate public-media deploy route
        uses: actions/github-script@v7
        with:
          script: |
            const message = [
              '⛔ The standalone public LinkedIn media deploy route is retired.',
              '',
              'Canonical media transport is now:',
              'private CGPT-1 source bytes → exact SHA/byte preflight → capability-gated 222Emails Netlify media bridge → Buffer.',
              '',
              'Use the normal governed LinkedIn approval path. Do not recreate a separate public-media deployment lane.'
            ].join('\n');
            if (context.eventName === 'issues') {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: message });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed', state_reason: 'not_planned' });
            } else {
              core.notice(message);
            }
