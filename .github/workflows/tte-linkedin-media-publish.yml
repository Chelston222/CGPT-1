name: TTE LinkedIn Media Publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/tte-mail-bridge/public/linkedin-media/**'
      - '.github/workflows/tte-linkedin-media-publish.yml'
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: tte-linkedin-media-publish
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'issues' || (startsWith(github.event.issue.title, '[DEPLOY LINKEDIN MEDIA]') && github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: e531326d-60b8-4def-85b9-727a7f708547
    defaults:
      run:
        working-directory: apps/tte-mail-bridge
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify Netlify auth is available
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NETLIFY_AUTH_TOKEN:-}" || { echo 'NETLIFY_AUTH_TOKEN is not configured'; exit 2; }

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Publish current mail bridge plus LinkedIn media
        run: npx netlify deploy --prod --dir=public --functions=netlify/functions --site "$NETLIFY_SITE_ID"

      - name: Verify LinkedIn media is public
        shell: bash
        run: |
          set -euo pipefail
          for file in 2026-08-20-calling.jpg 2026-08-20-stay-focused.jpg 2026-08-20-ego-bottleneck.jpg; do
            url="https://222emails-mail-bridge.netlify.app/linkedin-media/$file"
            curl --fail --silent --show-error --location --retry 5 --retry-delay 2 --output "/tmp/$file" "$url"
            test -s "/tmp/$file"
            file --brief --mime-type "/tmp/$file" | grep -Eq '^image/(jpeg|png)$'
          done

      - name: Report issue-triggered deploy
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const ok = process.env.JOB_STATUS === 'success';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: ok
                ? '✅ LinkedIn media is publicly deployed and image-read verification passed for all three files.'
                : `❌ LinkedIn media deploy failed. Job status: **${process.env.JOB_STATUS}**. Check the workflow run before resubmitting Buffer posts.`
            });
            if (ok) await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed' });
