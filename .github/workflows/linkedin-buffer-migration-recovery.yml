name: LinkedIn Buffer Migration Recovery

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: linkedin-buffer-migration-recovery
  cancel-in-progress: true

jobs:
  recover:
    if: startsWith(github.event.issue.title, '[APPROVED BUFFER MIGRATION RECOVERY]') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record recovery start
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `▶️ Buffer migration recovery started. No Buffer mutation has occurred in this recovery run yet.\n<!-- BUFFER_MIGRATION_RECOVERY_STARTED issue=${context.issue.number} -->`,
            });

      - name: Stop any hung original migration executor
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            try {
              const workflowId = 'linkedin-buffer-migration-apply.yml';
              const activeStates = new Set(['queued', 'in_progress', 'waiting', 'requested', 'pending']);
              const sourceIssue = await github.rest.issues.get({ owner, repo, issue_number: 386 });
              const sourceCreatedAt = Date.parse(sourceIssue.data.created_at || '');

              async function activeRuns() {
                const runs = await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: workflowId, event: 'issues', per_page: 20 });
                return (runs.data.workflow_runs || []).filter((run) => {
                  const createdAt = Date.parse(run.created_at || '');
                  return activeStates.has(run.status) && Number.isFinite(createdAt) && createdAt >= sourceCreatedAt;
                });
              }

              let active = await activeRuns();
              const initial = active.map((run) => `${run.id}:${run.status}`);
              for (const run of active) {
                try {
                  await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
                } catch (error) {
                  if (error.status !== 409) throw error;
                }
              }

              for (let attempt = 0; attempt < 30; attempt += 1) {
                active = await activeRuns();
                if (!active.length) break;
                await new Promise((resolve) => setTimeout(resolve, 2000));
              }
              active = await activeRuns();
              if (active.length) throw new Error(`Original migration executor is still active after cancellation: ${active.map((run) => `${run.id}:${run.status}`).join(', ')}`);

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: context.issue.number,
                body: `✅ Original migration executor stop-check passed. Active originals found initially: **${initial.length}**${initial.length ? ` (${initial.join(', ')})` : ''}. Active originals remaining: **0**.\n<!-- BUFFER_MIGRATION_ORIGINAL_STOPPED -->`,
              });
            } catch (error) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: context.issue.number,
                body: `❌ Recovery failed closed before Buffer mutation while checking/cancelling the original executor.\n\n- Error: ${error.message}\n<!-- BUFFER_MIGRATION_RECOVERY_FAILED stage=cancel-original -->`,
              });
              throw error;
            }

      - name: Recover exact owner-approved migration remainder
        uses: actions/github-script@v7
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_LINKEDIN_PERSONAL_CHANNEL_ID: ${{ secrets.BUFFER_LINKEDIN_PERSONAL_CHANNEL_ID }}
          BUFFER_LINKEDIN_BUSINESS_CHANNEL_ID: ${{ secrets.BUFFER_LINKEDIN_BUSINESS_CHANNEL_ID }}
          BUFFER_LINKEDIN_SECONDARY_CHANNEL_ID: ${{ secrets.BUFFER_LINKEDIN_SECONDARY_CHANNEL_ID }}
        with:
          script: |
            try {
              const { run } = require('./scripts/linkedin-buffer-migration-recovery.cjs');
              await run({ github, context, core, env: process.env, workspace: process.env.GITHUB_WORKSPACE, now: Date.now() });
            } catch (error) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `❌ Buffer migration recovery failed closed.\n\n- Error: ${error.message}\n- No state beyond independently evidenced comments/snapshots should be assumed.\n<!-- BUFFER_MIGRATION_RECOVERY_FAILED stage=apply -->`,
              });
              throw error;
            }
