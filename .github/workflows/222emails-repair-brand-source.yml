name: Repair Omega Max brand source

on:
  push:
    paths:
      - '.github/workflows/222emails-repair-brand-source.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair known monogram corruption and validate decoded brand
        working-directory: apps/222emails-omega-max
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('release-parts/brand.01.part')
          d=p.read_bytes()
          assert len(d)==12013, len(d)
          assert d[5076:5086] == b'wFx1gCYxC4', d[5076:5086]
          assert d[-3:] == b'Q==', d[-3:]
          d=d[:5076]+d[5086:]
          d=d[:-3]
          assert len(d)==12000
          p.write_bytes(d)
          print('Removed the 13 known corrupt Base64 characters from brand.01.part')
          PY

          cat release-parts/brand.01.part \
              release-parts/brand.02.part \
              release-parts/brand.03.part \
              release-parts/brand.04.part \
              release-parts/brand.05.part \
              release-parts/brand.06.part \
              release-parts/brand.07.part > /tmp/brand.ts
          printf '\n' >> /tmp/brand.ts

          python - <<'PY'
          from pathlib import Path
          import base64, re
          src=Path('/tmp/brand.ts').read_text()
          exports={name:data for name,data in re.findall(r"export const (MONOGRAM|LOGO_DARK) = 'data:image/webp;base64,([^']+)'", src)}
          if set(exports) != {'MONOGRAM','LOGO_DARK'}:
              raise SystemExit(f'Expected MONOGRAM and LOGO_DARK, found {sorted(exports)}')
          for name,b64 in exports.items():
              raw=base64.b64decode(b64, validate=True)
              if len(raw) < 1000 or raw[:4] != b'RIFF' or raw[8:12] != b'WEBP':
                  raise SystemExit(f'{name} is not a valid WebP payload')
              Path(f'/tmp/{name.lower()}.webp').write_bytes(raw)
              print(f'{name}: strict Base64 and WebP header passed, {len(raw)} bytes')
          PY
          file /tmp/monogram.webp | grep -qi 'Web/P'
          file /tmp/logo_dark.webp | grep -qi 'Web/P'
          echo 'Decoded brand validation passed.'

      - name: Commit validated brand source repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name '222Emails Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/222emails-omega-max/release-parts/brand.01.part
          git diff --cached --quiet && exit 0
          git commit -m 'Repair malformed Omega Max monogram source'
          git push origin HEAD:main
