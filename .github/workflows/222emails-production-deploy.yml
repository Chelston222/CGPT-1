name: 222Emails Omega Max Production Deploy

on:
  push:
    paths:
      - '.github/workflows/222emails-production-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: fc7ccb38-7e6d-4a15-83bc-88bd84ea5687
    steps:
      - name: Verify deployment credential
        shell: bash
        run: |
          test -n "$NETLIFY_AUTH_TOKEN" || { echo 'NETLIFY_AUTH_TOKEN is missing'; exit 2; }

      - name: Restore approved production package
        shell: bash
        run: |
          mkdir -p site
          cat > /tmp/site.b64 <<'B64'
[... trimmed for brevity in this workflow source ...]
B64
          base64 -d /tmp/site.b64 > /tmp/site.zip
          unzip -q /tmp/site.zip -d site
          test -f site/index.html
          test -f site/privacy/index.html
          test -f site/terms/index.html
          test -f site/cookies/index.html
          test -f site/accessibility/index.html

      - name: Deploy Omega Max to production
        shell: bash
        run: |
          npx --yes netlify-cli@latest deploy --dir=site --prod --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --message="222Emails Omega Max production release 2026-08-16"

      - name: Live smoke tests
        shell: bash
        run: |
          for path in / /privacy/ /terms/ /cookies/ /accessibility/; do
            code=$(curl -sS -o /tmp/page -w '%{http_code}' "https://222emails-homeproof-upgrade.netlify.app${path}")
            test "$code" = "200" || { echo "${path} returned ${code}"; exit 1; }
          done
          curl -fsS https://222emails-homeproof-upgrade.netlify.app/ | grep -q 'Recover more from the demand you already have'
