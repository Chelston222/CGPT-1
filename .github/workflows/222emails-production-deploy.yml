name: 222Emails Omega Max Production Release

on:
  push:
    paths:
      - '.github/workflows/222emails-production-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: fc7ccb38-7e6d-4a15-83bc-88bd84ea5687
      NETLIFY_PRIMARY_URL: https://222emails-homeproof-upgrade.netlify.app
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Verify deployment credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NETLIFY_AUTH_TOKEN" || { echo 'NETLIFY_AUTH_TOKEN is missing'; exit 2; }

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconstruct exact approved Omega Max source
        working-directory: apps/222emails-omega-max
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src /tmp/tte-release

          cat release-corrections/brand.01.b64.01 release-corrections/brand.01.b64.02 | base64 -d > /tmp/tte-release/brand.01.part
          cat release-corrections/main.02.b64.01 release-corrections/main.02.b64.02 release-corrections/main.02.b64.03 | base64 -d > /tmp/tte-release/main.02.part

          cat /tmp/tte-release/brand.01.part \
              release-parts/brand.02.part \
              release-parts/brand.03.part \
              release-parts/brand.04.part \
              release-parts/brand.05.part \
              release-parts/brand.06.part \
              release-parts/brand.07.part > src/brand.ts
          printf '\n' >> src/brand.ts

          cat release-parts/main.01.part \
              /tmp/tte-release/main.02.part \
              release-parts/main.03.part > src/main.tsx

          cat release-parts/styles.01.part \
              release-parts/styles.02.part \
              release-parts/styles.03.part > src/styles.css

          test "$(git hash-object src/brand.ts)" = "2c4492916260be22ebf248f49f7a080cdd4303b6"
          test "$(git hash-object src/main.tsx)" = "9c2859126e4020509e094dc285df81b3ba84da80"
          test "$(git hash-object src/styles.css)" = "f019d7e3cca91df14f8a1ce417bedf889f1c2bb0"
          test "$(git hash-object index.html)" = "3ebec502aa578d91d8e4d0ee2aa3f513023e3421"
          test "$(git hash-object public/privacy/index.html)" = "0b7ffe9a6c857766abb1db8fa5917f0737c444a8"
          test "$(git hash-object public/terms/index.html)" = "6ccc9b64e51850bc16e6760c64788bf9277e6fb3"
          test "$(git hash-object public/cookies/index.html)" = "493de8ddae922f26fab6e0aac847ba6e81e2c6bc"
          test "$(git hash-object public/accessibility/index.html)" = "9b9f8109d52f6c7f5ed4e26a4d764d18abe8b7a5"
          test "$(git hash-object public/_headers)" = "cccfff03322484a0b9a8c546fa9710d0c8671635"
          test "$(git hash-object public/_redirects)" = "7797f7c6a7356b0d451d11a49925df854c22e978"

          grep -q 'name="client-return-fit-check"' index.html
          grep -q 'meta name="robots" content="index,follow"' index.html
          grep -q 'https://www.222emails.com/' index.html
          ! grep -q '222 Emails' src/main.tsx
          ! grep -q '—' src/main.tsx
          echo 'Exact-source gate passed.'

      - name: Install and build
        working-directory: apps/222emails-omega-max
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build
          test -f dist/index.html
          test -f dist/privacy/index.html
          test -f dist/terms/index.html
          test -f dist/cookies/index.html
          test -f dist/accessibility/index.html
          test -f dist/_headers
          test -f dist/_redirects
          grep -q 'name="client-return-fit-check"' dist/index.html
          grep -q 'content="index,follow"' dist/index.html

      - name: Deploy immutable preview
        working-directory: apps/222emails-omega-max
        shell: bash
        run: |
          set -euo pipefail
          npx --yes netlify-cli@latest deploy \
            --dir=dist \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --message="222Emails Omega Max release candidate 2026-08-16" \
            --json > /tmp/netlify-preview.json
          cat /tmp/netlify-preview.json
          PREVIEW_URL=$(node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/netlify-preview.json','utf8'));
          const u=j.deploy_ssl_url || j.deploy_url || j.deployUrl || j.url;
          if(!u) process.exit(2);
          process.stdout.write(u.replace(/\/$/,''));
          NODE
          )
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"

      - name: Preview route and rendered-app QA
        shell: bash
        run: |
          set -euo pipefail
          for path in / /how-it-works /services /proof /about /resources /fit-check /privacy/ /terms/ /cookies/ /accessibility/; do
            code=$(curl -L -sS -o /tmp/route.html -w '%{http_code}' "$PREVIEW_URL$path")
            test "$code" = "200" || { echo "$path returned $code"; exit 1; }
          done
          curl -LfsS "$PREVIEW_URL/privacy/" | grep -qi 'privacy'
          curl -LfsS "$PREVIEW_URL/terms/" | grep -qi 'terms'
          curl -LfsS "$PREVIEW_URL/cookies/" | grep -qi 'cookie'
          curl -LfsS "$PREVIEW_URL/accessibility/" | grep -qi 'accessibility'

          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          test -n "$CHROME" || { echo 'No Chrome-compatible browser on runner'; exit 1; }
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=5000 --dump-dom "$PREVIEW_URL/" > /tmp/rendered-home.html
          grep -q 'Recover more from the demand you already have' /tmp/rendered-home.html
          grep -q 'Start your free Fit Check' /tmp/rendered-home.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=5000 --dump-dom "$PREVIEW_URL/fit-check" > /tmp/rendered-fit.html
          grep -q 'Tell us where follow-up is leaking' /tmp/rendered-fit.html
          echo 'Preview QA passed.'

      - name: Promote exact build to production
        working-directory: apps/222emails-omega-max
        shell: bash
        run: |
          set -euo pipefail
          npx --yes netlify-cli@latest deploy \
            --dir=dist \
            --prod \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --message="222Emails Omega Max production release 2026-08-16" \
            --json > /tmp/netlify-production.json
          cat /tmp/netlify-production.json
          PROD_DEPLOY_URL=$(node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/netlify-production.json','utf8'));
          const u=j.deploy_ssl_url || j.deploy_url || j.deployUrl || j.url;
          if(!u) process.exit(2);
          process.stdout.write(u.replace(/\/$/,''));
          NODE
          )
          echo "PROD_DEPLOY_URL=$PROD_DEPLOY_URL" >> "$GITHUB_ENV"

      - name: Production smoke and real form POST
        shell: bash
        run: |
          set -euo pipefail
          for path in / /how-it-works /services /proof /about /resources /fit-check /privacy/ /terms/ /cookies/ /accessibility/; do
            code=$(curl -L -sS -o /tmp/live-route.html -w '%{http_code}' "$NETLIFY_PRIMARY_URL$path")
            test "$code" = "200" || { echo "production $path returned $code"; exit 1; }
          done
          curl -LfsS "$NETLIFY_PRIMARY_URL/" | grep -q '222Emails | Revenue Recovery Systems'

          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=5000 --dump-dom "$NETLIFY_PRIMARY_URL/" > /tmp/live-rendered-home.html
          grep -q 'Recover more from the demand you already have' /tmp/live-rendered-home.html

          FORM_CODE=$(curl -sS -o /tmp/form-response -w '%{http_code}' \
            -X POST "$NETLIFY_PRIMARY_URL/" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'form-name=client-return-fit-check' \
            --data-urlencode 'leak=Past clients' \
            --data-urlencode 'name=Omega Release QA' \
            --data-urlencode 'business=222Emails Release QA' \
            --data-urlencode 'email=hello@222emails.com' \
            --data-urlencode 'website=https://www.222emails.com' \
            --data-urlencode 'context=Automated production release QA submission. Safe to delete.')
          case "$FORM_CODE" in 200|201|202|301|302|303) ;; *) echo "Form POST returned $FORM_CODE"; cat /tmp/form-response; exit 1;; esac
          echo 'Production smoke and form POST passed.'

      - name: Check custom domain if DNS is live
        shell: bash
        run: |
          set -euo pipefail
          if curl -L --connect-timeout 10 --max-time 20 -fsS https://www.222emails.com/ -o /tmp/custom-home; then
            grep -q '222Emails | Revenue Recovery Systems' /tmp/custom-home
            echo 'CUSTOM_DOMAIN_STATUS=live' >> "$GITHUB_ENV"
          else
            echo 'CUSTOM_DOMAIN_STATUS=not-reachable-from-runner' >> "$GITHUB_ENV"
          fi

      - name: Release summary
        shell: bash
        run: |
          echo "Preview: $PREVIEW_URL"
          echo "Production deploy: $PROD_DEPLOY_URL"
          echo "Primary Netlify URL: $NETLIFY_PRIMARY_URL"
          echo "Custom domain: ${CUSTOM_DOMAIN_STATUS:-unknown}"
