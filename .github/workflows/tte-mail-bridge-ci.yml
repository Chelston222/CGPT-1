name: TTE Mail Bridge Apex CI

on:
  pull_request:
    paths:
      - 'apps/tte-mail-bridge/**'
      - '.github/workflows/tte-mail-bridge-*.yml'
      - '.github/workflows/tte-direct-queue-runner.yml'
  push:
    paths:
      - 'apps/tte-mail-bridge/**'
      - '.github/workflows/tte-mail-bridge-*.yml'
      - '.github/workflows/tte-direct-queue-runner.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tte-mail-bridge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/tte-mail-bridge
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Core gauntlet
        run: npm run test
      - name: TypeScript gate
        run: npm run typecheck
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
