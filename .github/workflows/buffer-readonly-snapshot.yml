name: Buffer Read-only Snapshot

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  snapshot:
    if: startsWith(github.event.issue.title, '[BUFFER SNAPSHOT]') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Capture Buffer inventory and provider channel configuration without writes
        uses: actions/github-script@v7
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_LINKEDIN_PERSONAL_CHANNEL_ID: ${{ secrets.BUFFER_LINKEDIN_PERSONAL_CHANNEL_ID }}
          BUFFER_LINKEDIN_BUSINESS_CHANNEL_ID: ${{ secrets.BUFFER_LINKEDIN_BUSINESS_CHANNEL_ID }}
          BUFFER_LINKEDIN_SECONDARY_CHANNEL_ID: ${{ secrets.BUFFER_LINKEDIN_SECONDARY_CHANNEL_ID }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;
            const targets = {
              personal: process.env.BUFFER_LINKEDIN_PERSONAL_CHANNEL_ID,
              main: process.env.BUFFER_LINKEDIN_BUSINESS_CHANNEL_ID,
              secondary: process.env.BUFFER_LINKEDIN_SECONDARY_CHANNEL_ID,
            };
            const missing = Object.entries(targets).filter(([, id]) => !id).map(([name]) => name);
            if (!process.env.BUFFER_API_KEY || missing.length) {
              throw new Error(`Missing Buffer configuration: ${[!process.env.BUFFER_API_KEY ? 'api_key' : null, ...missing].filter(Boolean).join(', ')}`);
            }

            async function buffer(query) {
              const response = await fetch('https://api.buffer.com', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${process.env.BUFFER_API_KEY}`,
                },
                body: JSON.stringify({ query }),
              });
              let payload;
              try { payload = await response.json(); } catch { payload = {}; }
              const messages = (payload.errors || []).map((error) => error.message).filter(Boolean);
              if (!response.ok || messages.length) throw new Error(messages.join('; ') || `Buffer HTTP ${response.status}`);
              return payload.data;
            }

            const account = await buffer('query CapacityAccount { account { organizations { id } } }');
            const organizationId = account.account?.organizations?.[0]?.id;
            if (!organizationId) throw new Error('Buffer returned no organisation ID.');

            const providerChannels = [];
            for (const [target, id] of Object.entries(targets)) {
              const result = await buffer(`query ChannelAudit { channel(input: { id: ${JSON.stringify(id)} }) { id name displayName descriptor service type isDisconnected isLocked isQueuePaused timezone postingSchedule { day paused times } } }`);
              const channel = result.channel;
              if (!channel || channel.id !== id) throw new Error(`Buffer did not return configured ${target} channel.`);
              providerChannels.push({ target, ...channel });
            }

            const channelIds = Object.values(targets);
            const query = `query ScheduledCapacity { posts(first: 100, input: { organizationId: ${JSON.stringify(organizationId)}, filter: { status: [scheduled], channelIds: ${JSON.stringify(channelIds)} } }) { edges { node { id channelId dueAt status } } pageInfo { hasNextPage } } }`;
            const data = await buffer(query);
            if (data.posts?.pageInfo?.hasNextPage) throw new Error('More than 100 scheduled posts returned; refusing incomplete snapshot.');

            const targetById = Object.fromEntries(Object.entries(targets).map(([target, id]) => [id, target]));
            const rows = (data.posts?.edges || [])
              .map((edge) => ({
                target: targetById[edge.node.channelId] || 'unknown',
                postId: edge.node.id,
                dueAt: edge.node.dueAt,
                status: edge.node.status,
              }))
              .sort((a, b) => String(a.dueAt).localeCompare(String(b.dueAt)));
            const counts = { personal: 0, main: 0, secondary: 0, unknown: 0 };
            for (const row of rows) counts[row.target] = (counts[row.target] || 0) + 1;

            // Recurring schedule != total release safety ceiling. Personal may publish
            // an earned bonus post, but only one guaranteed recurring core slot/day is
            // allowed. Main and secondary should have no more than five recurring slots/week.
            const recurringPolicy = {
              personal: { maxWeek: 7, maxPerDay: 1, requireEveryDay: true },
              main: { maxWeek: 5, maxPerDay: 1, requireEveryDay: false },
              secondary: { maxWeek: 5, maxPerDay: 1, requireEveryDay: false },
            };

            function scheduleState(channel) {
              const activeDays = (channel.postingSchedule || []).filter((day) => !day.paused);
              const activeSlots = activeDays.flatMap((day) => (day.times || []).map((time) => `${day.day} ${time}`));
              const dailyCounts = Object.fromEntries(activeDays.map((day) => [day.day, (day.times || []).length]));
              const p = recurringPolicy[channel.target];
              const dailyPass = Object.values(dailyCounts).every((count) => count <= p.maxPerDay);
              const everyDayPass = !p.requireEveryDay || ['mon','tue','wed','thu','fri','sat','sun'].every((day) => dailyCounts[day] === 1);
              return {
                activeSlots,
                dailyCounts,
                weeklyPass: activeSlots.length <= p.maxWeek,
                dailyPass,
                everyDayPass,
                recurringPass: activeSlots.length <= p.maxWeek && dailyPass && everyDayPass,
              };
            }

            const configLines = providerChannels.flatMap((channel) => {
              const s = scheduleState(channel);
              const p = recurringPolicy[channel.target];
              return [
                `### ${channel.target}`,
                `- Provider name: **${channel.name || '(none)'}**`,
                `- Provider display name: **${channel.displayName || '(none)'}**`,
                `- Descriptor/type/service: **${channel.descriptor || '(none)'} / ${channel.type || '(none)'} / ${channel.service || '(none)'}**`,
                `- Connection state: disconnected **${channel.isDisconnected}**, locked **${channel.isLocked}**, queue paused **${channel.isQueuePaused}**`,
                `- Provider timezone: **${channel.timezone || '(none)'}**`,
                `- Active recurring slots (${s.activeSlots.length}): ${s.activeSlots.length ? s.activeSlots.map((slot) => `\`${slot}\``).join(', ') : 'none'}`,
                `- Recurring weekly target <= ${p.maxWeek}: **${s.weeklyPass ? 'PASS' : 'FAIL'}**`,
                `- Recurring max ${p.maxPerDay}/day: **${s.dailyPass ? 'PASS' : 'FAIL'}**`,
                ...(p.requireEveryDay ? [`- Exactly one guaranteed recurring core slot on every day: **${s.everyDayPass ? 'PASS' : 'FAIL'}**`] : []),
                '',
              ];
            });
            const providerConfigHealthy = providerChannels.every((channel) => {
              const s = scheduleState(channel);
              return channel.timezone === 'Europe/London' && !channel.isDisconnected && !channel.isLocked && !channel.isQueuePaused && s.recurringPass;
            });

            const lines = rows.map((row) => `- ${row.target}: \`${row.postId}\` · ${row.dueAt} · ${row.status}`);
            const body = [
              '## Read-only Buffer snapshot',
              '',
              '**Provider channel names, connection flags, timezone and posting schedules below are queried from Buffer, not hardcoded aliases.**',
              '',
              `Captured: **${new Date().toISOString()}**`,
              '',
              ...configLines,
              `- Provider configuration health under current recurring-cadence contract: **${providerConfigHealthy ? 'PASS' : 'FAIL'}**`,
              `- personal scheduled: **${counts.personal}**`,
              `- main scheduled: **${counts.main}**`,
              `- secondary scheduled: **${counts.secondary}**`,
              `- unknown-channel scheduled: **${counts.unknown}**`,
              `- total scheduled across configured channels: **${rows.length}**`,
              '- pagination complete: **YES**',
              '- Buffer mutation performed: **NO**',
              '',
              '### Scheduled inventory',
              ...(lines.length ? lines : ['- No scheduled posts returned for the configured channels.']),
              '',
              'This snapshot proves current provider channel configuration and scheduled inventory. It does not prove publication or native LinkedIn analytics by itself.',
            ].join('\n');
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
            await github.rest.issues.update({ owner, repo, issue_number, state: 'closed', state_reason: providerConfigHealthy ? 'completed' : 'not_planned' });
            if (!providerConfigHealthy) core.setFailed('Provider channel configuration is not fully aligned with the current recurring-cadence contract.');
