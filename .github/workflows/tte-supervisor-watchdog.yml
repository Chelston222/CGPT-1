name: TTE Supervisor Watchdog

on:
  push:
    branches: [main]
    paths:
      - 'apps/tte-supervisor/**'
      - 'apps/tte-mail-bridge/**'
      - '.github/workflows/tte-direct-queue-runner.yml'
      - '.github/workflows/tte-supervisor-watchdog.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write
  issues: write

concurrency:
  group: tte-supervisor-watchdog
  cancel-in-progress: false

jobs:
  supervise:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run deterministic supervisor contract
        working-directory: apps/tte-supervisor
        run: node check.mjs

      - name: Persist health snapshot
        if: always()
        shell: bash
        run: |
          git config user.name "TTE Supervisor Watchdog"
          git config user.email "actions@users.noreply.github.com"
          git add apps/tte-supervisor/state/health.json || true
          if ! git diff --cached --quiet; then
            git commit -m "TTE supervisor: refresh health snapshot"
            git push origin HEAD:main
          fi
