name: Private Buffer Credential Encrypt Temp

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  encrypt:
    if: github.event.issue.title == '[PUBLIC BUFFER CREDENTIAL ENCRYPT]' && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Encrypt existing provider credentials for private migration
        uses: actions/github-script@v7
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_LINKEDIN_PERSONAL_CHANNEL_ID: ${{ secrets.BUFFER_LINKEDIN_PERSONAL_CHANNEL_ID }}
          BUFFER_LINKEDIN_BUSINESS_CHANNEL_ID: ${{ secrets.BUFFER_LINKEDIN_BUSINESS_CHANNEL_ID }}
          BUFFER_LINKEDIN_SECONDARY_CHANNEL_ID: ${{ secrets.BUFFER_LINKEDIN_SECONDARY_CHANNEL_ID }}
        with:
          script: |
            const crypto = require('node:crypto');
            const required = {
              bufferApiKey: process.env.BUFFER_API_KEY || '',
              personal: process.env.BUFFER_LINKEDIN_PERSONAL_CHANNEL_ID || '',
              main: process.env.BUFFER_LINKEDIN_BUSINESS_CHANNEL_ID || '',
              secondary: process.env.BUFFER_LINKEDIN_SECONDARY_CHANNEL_ID || '',
            };
            if (Object.values(required).some((v) => !String(v).trim())) throw new Error('One or more Buffer provider credentials are missing.');
            Object.values(required).forEach((v) => core.setSecret(v));

            const publicKey = "-----BEGIN PUBLIC KEY-----\nMIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAydd4+pxSfBgIpvQh9J7u\nhYPWLjtk8yn1TZOB71DBWzTAHdEMfdvM1IBD7yd13ZeFG1blt6BEJl3w9YIt8yKa\nmGCvCHvrhcwBSIa9OWtXSGraz30CdmFr3Da5LTnpkspiqeZ9OyfvTPFCLHSg6gau\n1e5BbJOWGexrC11aAoIyVD6Zar829/FrubH3HCb/nhT/U3UK88EPkrD8SiBF8uEI\nGbAIArHiEZEbWZQiNOrJno8fqqPo2rV5GdHqadVeVNuxwcX5oyjHihb49SwRkQHc\nITqf0U3iQ0inKyxSrSTnzDvDuzsDfG3YSssPwlm0D/4WeYMXyp5JTzlN5X38dOML\nkbd7HkRhM6PvGmAOrtLneqMw9iiu0oaoUobqZs87AXl0hPEMZWu+coblwh+cADsn\nYT//2mMyHAVi4vH1M8QC2tIZYvYp9C220HAv02UdbtN+kENDkBKYnlAdUy4dz1pJ\njM95dJA2PJmnPhPtU6FzxLAkgB6tZ3i1zWSkQc1/a25uzyezytmq/vWvBU7iu09i\nq2VLk5kyIfZon5a55la5NuTcylhWDRmUJwydoENiLVfNkPVtNUySl3Zi4SPhbjm7\nZz7Y2r5j4pzk9toMds9N5mD9pYTeV/B7QI+0sImWykz9heMMXcchFzzOnzMXTh8A\nt0PWZEXI7yG5vFx45sTVqBMCAwEAAQ==\n-----END PUBLIC KEY-----";
            const plain = Buffer.from(JSON.stringify({
              bufferApiKey: required.bufferApiKey,
              channels: { personal: required.personal, main: required.main, secondary: required.secondary },
            }), 'utf8');
            const aesKey = crypto.randomBytes(32);
            const iv = crypto.randomBytes(12);
            const cipher = crypto.createCipheriv('aes-256-gcm', aesKey, iv);
            const encrypted = Buffer.concat([cipher.update(plain), cipher.final()]);
            const tag = cipher.getAuthTag();
            const wrappedKey = crypto.publicEncrypt(
              { key: publicKey, padding: crypto.constants.RSA_PKCS1_OAEP_PADDING, oaepHash: 'sha256' },
              aesKey,
            );
            const envelope = {
              key: wrappedKey.toString('base64url'),
              iv: iv.toString('base64url'),
              tag: tag.toString('base64url'),
              data: encrypted.toString('base64url'),
            };
            const encoded = Buffer.from(JSON.stringify(envelope), 'utf8').toString('base64url');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
              body: ['<!-- HANDSHAKE_CIPHERTEXT_START -->', encoded, '<!-- HANDSHAKE_CIPHERTEXT_END -->'].join('\n'),
            });
            await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,state:'closed',state_reason:'completed'});
