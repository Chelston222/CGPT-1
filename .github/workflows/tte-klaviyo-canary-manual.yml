name: TTE Klaviyo APEX V2 Canary Manual Mode

on:
  workflow_dispatch:
    inputs:
      visual_qa:
        description: 'Desktop + mobile visual QA complete'
        required: true
        type: choice
        options: [BLOCK, PASS]
        default: BLOCK
      domain_qa:
        description: 'Sending domain/authentication healthy in Klaviyo'
        required: true
        type: choice
        options: [BLOCK, PASS]
        default: BLOCK
      capture_qa:
        description: 'Public capture path into Email List SjerhA verified'
        required: true
        type: choice
        options: [BLOCK, PASS]
        default: BLOCK
      exit_qa:
        description: 'Fit Check/client exit logic verified'
        required: true
        type: choice
        options: [BLOCK, PASS]
        default: BLOCK
      confirmation:
        description: 'Type exactly SET-VbBAhU-MANUAL'
        required: true
        type: string

permissions:
  contents: read

jobs:
  canary-manual:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Full APEX V2 content verification before canary
        env:
          KLAVIYO_PRIVATE_API_KEY: ${{ secrets.KLAVIYO_PRIVATE_API_KEY }}
          TTE_APEX_V2_FLOW_ID: VbBAhU
        run: python apps/tte-klaviyo/verify_apex_v2_flow.py

      - name: Structural launch-readiness gate
        env:
          KLAVIYO_PRIVATE_API_KEY: ${{ secrets.KLAVIYO_PRIVATE_API_KEY }}
          TTE_FLAGSHIP_FLOW_ID: VbBAhU
        run: python apps/tte-klaviyo/launch_readiness.py

      - name: Require critical human/external QA before manual canary
        env:
          VISUAL_QA: ${{ inputs.visual_qa }}
          DOMAIN_QA: ${{ inputs.domain_qa }}
          CAPTURE_QA: ${{ inputs.capture_qa }}
          EXIT_QA: ${{ inputs.exit_qa }}
        run: |
          test "$VISUAL_QA" = "PASS" || (echo "BLOCKED: visual QA not passed" && exit 1)
          test "$DOMAIN_QA" = "PASS" || (echo "BLOCKED: domain QA not passed" && exit 1)
          test "$CAPTURE_QA" = "PASS" || (echo "BLOCKED: capture QA not passed" && exit 1)
          test "$EXIT_QA" = "PASS" || (echo "BLOCKED: exit QA not passed" && exit 1)

      - name: Set APEX V2 flow to manual review mode
        env:
          KLAVIYO_PRIVATE_API_KEY: ${{ secrets.KLAVIYO_PRIVATE_API_KEY }}
          TARGET_STATUS: manual
          STATUS_CONFIRMATION: ${{ inputs.confirmation }}
        run: python apps/tte-klaviyo/set_flagship_status.py
