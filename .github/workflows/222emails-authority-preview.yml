name: 222Emails Website Source Checks (CGPT Sites is publisher)

on:
  pull_request:
    paths:
      - 'apps/222emails-omega-max/**'
      - '.github/workflows/222emails-authority-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Build source without publishing
        working-directory: apps/222emails-omega-max
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -f dist/index.html
      - name: Clarify publishing authority
        run: echo 'Build-only verification. Publish and verify directly in CGPT Sites.'
