name: Agentic OS Green Gate

on:
  push:
    paths:
      - 'apps/agentic-os/**'
      - '.github/workflows/agentic-os-green-gate.yml'
  pull_request:
    paths:
      - 'apps/agentic-os/**'
      - '.github/workflows/agentic-os-green-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run autonomous relevance and anti-backlog acceptance suite
        run: node apps/agentic-os/tests.mjs
      - name: Generate deterministic execution plan and ICS
        run: node apps/agentic-os/run.mjs apps/agentic-os/fixtures/simulation.json
      - name: Assert generated state exists
        run: |
          test -s apps/agentic-os/state/latest.json
          test -s apps/agentic-os/state/execution.ics
      - name: Upload green-gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: agentic-os-green-gate
          path: |
            apps/agentic-os/state/latest.json
            apps/agentic-os/state/execution.ics
          retention-days: 14
