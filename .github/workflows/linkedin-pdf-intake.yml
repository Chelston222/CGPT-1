name: RETIRED - LinkedIn PDF Intake

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Stop retired parallel PDF intake route
        shell: bash
        run: |
          echo 'RETIRED: Repository-manifest PDF intake is no longer a production ingress lane.' >&2
          echo 'Use the canonical governed route: authorised Gmail -> PrivateEmail IMAP -> exact attachment verification -> governed GitHub queue.' >&2
          echo 'The canonical workflow is .github/workflows/linkedin-imap-pdf-intake.yml and it preserves exact sender, subject, filename, bytes, SHA-256, page count, revision, schedule and source controls.' >&2
          exit 1
