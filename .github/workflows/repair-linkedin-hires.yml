name: Retired LinkedIn hi-res media repair

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: retired-linkedin-buffer-hires-repair
  cancel-in-progress: false

jobs:
  retired:
    if: startsWith(github.event.issue.title, '[RUN BUFFER MEDIA REPAIR]') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Stop retired public-media repair route
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '⛔ This legacy hi-res Buffer repair route is retired.',
                '',
                'It previously depended on repository-public media URLs and historical August 2026 Buffer post IDs.',
                'Do not recreate that path.',
                '',
                'Use the current governed queue, private repository source media, capability-gated Netlify media transport, owner approval and the standard Buffer release/verifier path.'
              ].join('\n')
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'not_planned'
            });
