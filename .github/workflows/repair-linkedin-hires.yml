name: Repair LinkedIn Buffer media at full resolution

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: linkedin-buffer-hires-repair
  cancel-in-progress: false

jobs:
  repair:
    if: startsWith(github.event.issue.title, '[RUN BUFFER MEDIA REPAIR]') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Render native 1080x1350 PNG assets
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          mkdir -p assets/linkedin-generated-hires
          rsvg-convert -w 1080 -h 1350 assets/linkedin-source-hires/calling.svg -o assets/linkedin-generated-hires/calling-1080x1350.png
          rsvg-convert -w 1080 -h 1350 assets/linkedin-source-hires/focus.svg -o assets/linkedin-generated-hires/focus-1080x1350.png
          rsvg-convert -w 1080 -h 1350 assets/linkedin-source-hires/ego.svg -o assets/linkedin-generated-hires/ego-1080x1350.png

      - name: Verify PNG dimensions and integrity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, struct
          paths = [
              'assets/linkedin-generated-hires/calling-1080x1350.png',
              'assets/linkedin-generated-hires/focus-1080x1350.png',
              'assets/linkedin-generated-hires/ego-1080x1350.png',
          ]
          for path in paths:
              with open(path, 'rb') as f:
                  data = f.read(24)
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{path}: not a PNG')
              width, height = struct.unpack('>II', data[16:24])
              size = os.path.getsize(path)
              if (width, height) != (1080, 1350):
                  raise SystemExit(f'{path}: expected 1080x1350, got {width}x{height}')
              if size < 20000:
                  raise SystemExit(f'{path}: suspiciously small ({size} bytes)')
              print(f'QA PASS {path}: {width}x{height}, {size} bytes')
          PY

      - name: Commit stable public media
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/linkedin-generated-hires
          if git diff --cached --quiet; then
            echo 'Hi-res media already current.'
          else
            git commit -m 'Render 1080x1350 LinkedIn media for Buffer'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Replace Buffer media in place and update waiting approval
        uses: actions/github-script@v7
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const triggerIssue = context.issue.number;
            const rawBase = `https://raw.githubusercontent.com/${owner}/${repo}/main/assets/linkedin-generated-hires`;

            function pngDimensions(buffer) {
              const signature = buffer.subarray(0, 8).toString('hex');
              if (signature !== '89504e470d0a1a0a') throw new Error('Hosted asset is not PNG.');
              return { width: buffer.readUInt32BE(16), height: buffer.readUInt32BE(20) };
            }

            async function fetchAndVerify(url) {
              let lastError;
              for (let attempt = 1; attempt <= 10; attempt += 1) {
                try {
                  const response = await fetch(`${url}?qa=${Date.now()}`, { cache: 'no-store' });
                  if (!response.ok) throw new Error(`HTTP ${response.status}`);
                  const bytes = Buffer.from(await response.arrayBuffer());
                  const { width, height } = pngDimensions(bytes);
                  if (width !== 1080 || height !== 1350) throw new Error(`expected 1080x1350, got ${width}x${height}`);
                  if (bytes.length < 20000) throw new Error(`suspiciously small file (${bytes.length} bytes)`);
                  return { width, height, bytes: bytes.length };
                } catch (error) {
                  lastError = error;
                  await new Promise((resolve) => setTimeout(resolve, 3000));
                }
              }
              throw new Error(`Public media QA failed for ${url}: ${lastError?.message || 'unknown error'}`);
            }

            async function buffer(query) {
              const response = await fetch('https://api.buffer.com', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${process.env.BUFFER_API_KEY}`,
                },
                body: JSON.stringify({ query }),
              });
              const payload = await response.json().catch(() => ({}));
              const messages = [...(payload.errors || []).map((error) => error.message), payload.data?.editPost?.message].filter(Boolean);
              if (!response.ok || messages.length) throw new Error(messages.join('; ') || `Buffer HTTP ${response.status}`);
              return payload.data;
            }

            async function editMedia({ label, postId, filename, dueAt }) {
              const url = `${rawBase}/${filename}`;
              const qa = await fetchAndVerify(url);
              const query = `mutation RepairPostMedia {
                editPost(input: {
                  id: ${JSON.stringify(postId)}
                  assets: [{ image: { url: ${JSON.stringify(url)} } }]
                }) {
                  ... on PostActionSuccess {
                    post { id dueAt status assets { id mimeType } }
                  }
                  ... on MutationError { message }
                }
              }`;
              const data = await buffer(query);
              const post = data?.editPost?.post;
              if (!post?.id) throw new Error(`${label}: Buffer returned no edited post.`);
              if (post.id !== postId) throw new Error(`${label}: Buffer post ID changed unexpectedly.`);
              if (new Date(post.dueAt).getTime() !== new Date(dueAt).getTime()) {
                throw new Error(`${label}: dueAt changed unexpectedly from ${dueAt} to ${post.dueAt}.`);
              }
              if (!post.assets?.length || !String(post.assets[0].mimeType || '').startsWith('image/')) {
                throw new Error(`${label}: Buffer did not report an image asset after edit.`);
              }
              return { label, postId, dueAt: post.dueAt, status: post.status, url, qa, mimeType: post.assets[0].mimeType };
            }

            try {
              if (!process.env.BUFFER_API_KEY) throw new Error('Missing BUFFER_API_KEY repository secret.');

              const calling = await editMedia({
                label: 'Calling',
                postId: '6a87549d6fdda4cc4c3f9542',
                filename: 'calling-1080x1350.png',
                dueAt: '2026-08-24T16:15:00.000Z',
              });
              const focus = await editMedia({
                label: 'Stay Focused',
                postId: '6a8754c70fde1e61dd0b23b8',
                filename: 'focus-1080x1350.png',
                dueAt: '2026-08-26T16:15:00.000Z',
              });
              const egoUrl = `${rawBase}/ego-1080x1350.png`;
              const egoQa = await fetchAndVerify(egoUrl);

              const egoIssue = await github.rest.issues.get({ owner, repo, issue_number: 170 });
              let egoBody = String(egoIssue.data.body || '');
              egoBody = egoBody.replace(/^REVISION:\s*\d+\s*$/m, 'REVISION: 3');
              egoBody = egoBody.replace(/^MEDIA_URL:\s*.*$/m, `MEDIA_URL: ${egoUrl}`);
              const egoTitle = String(egoIssue.data.title || '').replace(/· r\d+\s*$/, '· r3');
              await github.rest.issues.update({ owner, repo, issue_number: 170, title: egoTitle, body: egoBody, state: 'open' });

              const audit = [calling, focus].map((item) =>
                `- ${item.label}: Buffer post \`${item.postId}\` preserved · ${item.qa.width}×${item.qa.height} · ${item.qa.bytes} bytes · ${item.mimeType} · due ${item.dueAt}`
              );
              await github.rest.issues.createComment({
                owner, repo, issue_number: 168,
                body: `✅ MEDIA REPAIR COMPLETE\n\nCalling media was replaced **in place** on Buffer post \`${calling.postId}\`.\n\n- Source: ${calling.url}\n- QA: **${calling.qa.width}×${calling.qa.height}** (${calling.qa.bytes} bytes)\n- Schedule preserved: **${calling.dueAt}**\n- Buffer status: **${calling.status}**`,
              });
              await github.rest.issues.createComment({
                owner, repo, issue_number: 169,
                body: `✅ MEDIA REPAIR COMPLETE\n\nStay Focused media was replaced **in place** on Buffer post \`${focus.postId}\`.\n\n- Source: ${focus.url}\n- QA: **${focus.qa.width}×${focus.qa.height}** (${focus.qa.bytes} bytes)\n- Schedule preserved: **${focus.dueAt}**\n- Buffer status: **${focus.status}**`,
              });
              await github.rest.issues.createComment({
                owner, repo, issue_number: 170,
                body: `✅ HI-RES MEDIA LOCKED FOR CAPACITY RELEASE\n\nEgo now points to the stable full-resolution source before Buffer placement.\n\n- Source: ${egoUrl}\n- QA: **${egoQa.width}×${egoQa.height}** (${egoQa.bytes} bytes)\n- Approval revision: **3**\n- Existing capacity-safe release logic remains active.`,
              });

              await github.rest.issues.createComment({
                owner, repo, issue_number: triggerIssue,
                body: ['✅ High-resolution Buffer repair completed.', '', ...audit, `- Ego waiting approval upgraded to 1080×1350 (${egoQa.bytes} bytes) without bypassing queue capacity.`].join('\n'),
              });
              await github.rest.issues.update({ owner, repo, issue_number: triggerIssue, state: 'closed' });
              await github.rest.issues.createComment({
                owner, repo, issue_number: 174,
                body: ['✅ Execution complete.', '', ...audit, `- Ego source QA: ${egoQa.width}×${egoQa.height}, ${egoQa.bytes} bytes.`, '- No captions or due times were changed.'].join('\n'),
              });
              await github.rest.issues.update({ owner, repo, issue_number: 174, state: 'closed' });
            } catch (error) {
              await github.rest.issues.createComment({ owner, repo, issue_number: triggerIssue, body: `❌ High-resolution media repair failed closed.\n\n${error.message}\n\nNo success should be assumed until this issue records a completed repair.` });
              core.setFailed(error.message);
            }
