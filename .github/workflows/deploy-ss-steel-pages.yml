name: Deploy S&S Steel V1 Preview

on:
  push:
    branches: [deploy-ss-steel-v1]
    paths:
      - 'deploy-assets/**'
      - '.github/workflows/deploy-ss-steel-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ss-steel-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated deployment branch
        uses: actions/checkout@v6

      - name: Reassemble and verify V3 package
        shell: bash
        run: |
          cat deploy-assets/ss-steel-v3.part*.b64 > ss-steel-v3.b64
          base64 --decode ss-steel-v3.b64 > ss-steel-v3.zip
          echo '9bfd311bf4f02f723ea9abccd68dad5f7bdeb70e416517285eefa03955513951  ss-steel-v3.zip' | sha256sum --check
          mkdir -p _site
          unzip -q ss-steel-v3.zip -d _site

      - name: Connect the live hosted enquiry form
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path('_site')
          page = root / 'index.html'
          html = page.read_text(encoding='utf-8')
          embed = '''<div class="hosted-enquiry" style="border:1px solid rgba(255,255,255,.14);border-radius:18px;overflow:hidden;background:#fff;min-height:1450px">
          <iframe id="JotFormIFrame-262102571238046" title="S&S Steel Shearing request a quote" allow="geolocation; microphone; camera; fullscreen; payment" src="https://form.jotform.com/262102571238046" frameborder="0" style="min-width:100%;max-width:100%;height:1450px;border:none;display:block" scrolling="yes"></iframe>
          </div>'''
          html, count = re.subn(r'<form name="steel-enquiry".*?</form>', embed, html, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not locate the enquiry form for replacement')
          html = html.replace('https://ss-steel-shearing-blackburn.netlify.app', 'https://chelston222.github.io/CGPT-1')
          page.write_text(html, encoding='utf-8')
          for name in ['privacy.html','terms.html','thanks.html','404.html','sitemap.xml']:
              p = root / name
              if p.exists():
                  p.write_text(p.read_text(encoding='utf-8').replace('https://ss-steel-shearing-blackburn.netlify.app', 'https://chelston222.github.io/CGPT-1'), encoding='utf-8')
          (root / '.nojekyll').write_text('', encoding='utf-8')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload checked site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
