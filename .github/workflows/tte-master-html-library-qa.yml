name: TTE Master HTML Library QA

on:
  pull_request:
    paths:
      - 'apps/tte-klaviyo/master-library/**'
  push:
    branches: [main]
    paths:
      - 'apps/tte-klaviyo/master-library/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate 30 master emails
        run: python apps/tte-klaviyo/master-library/validate_library.py
