name: Install LinkedIn safe-zone and content QA gate

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

jobs:
  install:
    if: startsWith(github.event.issue.title, '[RUN LINKEDIN SAFE-ZONE HARDENING]') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch approval validator
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/linkedin-review-core.cjs')
          text = path.read_text()

          anchor = "  if (!['image', 'document'].includes(mediaKind)) throw new Error('MEDIA_KIND must be image or document.');"
          insertion = """  if (!['image', 'document'].includes(mediaKind)) throw new Error('MEDIA_KIND must be image or document.');
  const contentQa = String(header.CONTENT_QA || '').trim().toLowerCase();
  const safeZoneQa = String(header.SAFE_ZONE_QA || '').trim().toLowerCase();
  if (contentQa !== 'pass') {
    throw new Error('CONTENT_QA: PASS is required before any LinkedIn post can reach Buffer.');
  }
  if (mediaUrl && mediaKind === 'image' && safeZoneQa !== 'pass') {
    throw new Error('SAFE_ZONE_QA: PASS is required for image posts after inspecting the native-resolution creative.');
  }"""
          if 'CONTENT_QA: PASS is required before any LinkedIn post can reach Buffer.' not in text:
              if anchor not in text:
                  raise SystemExit('Could not locate MEDIA_KIND validation anchor.')
              text = text.replace(anchor, insertion, 1)

          return_anchor = "    mediaKind,\n    documentTitle,"
          return_replacement = "    mediaKind,\n    contentQa,\n    safeZoneQa,\n    documentTitle,"
          if '    contentQa,\n    safeZoneQa,' not in text:
              if return_anchor not in text:
                  raise SystemExit('Could not locate validateRequest return anchor.')
              text = text.replace(return_anchor, return_replacement, 1)

          path.write_text(text)
          PY

      - name: Regression test approval gates
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const { validateRequest } = require('./scripts/linkedin-review-core.cjs');
          const env = { BUFFER_API_KEY: 'x', BUFFER_LINKEDIN_PERSONAL_CHANNEL_ID: 'personal' };
          const base = `POST_ID: test\nREVISION: 1\nTARGETS: personal\nMODE: queue\nMEDIA_URL: https://raw.githubusercontent.com/example/example/main/test.png\nMEDIA_KIND: image\n---\nTest post`;
          assert.throws(() => validateRequest(base, env, 0), /CONTENT_QA/);
          assert.throws(() => validateRequest(base.replace('---', 'CONTENT_QA: PASS\n---'), env, 0), /SAFE_ZONE_QA/);
          const approved = base.replace('---', 'CONTENT_QA: PASS\nSAFE_ZONE_QA: PASS\n---');
          const result = validateRequest(approved, env, 0);
          assert.equal(result.contentQa, 'pass');
          assert.equal(result.safeZoneQa, 'pass');
          console.log('LinkedIn content and safe-zone approval gates passed regression tests.');
          NODE

      - name: Commit hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/linkedin-review-core.cjs
          if git diff --cached --quiet; then
            echo 'Safe-zone approval gate already installed.'
          else
            git commit -m 'Require LinkedIn content and safe-zone QA before Buffer'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Record completion
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '✅ LinkedIn safe-zone/content gate installed.',
                '',
                '- Every future approved LinkedIn post must include `CONTENT_QA: PASS`.',
                '- Every future image post must also include `SAFE_ZONE_QA: PASS`.',
                '- Missing either required gate fails closed before Buffer dispatch.',
                '- The visual standard is documented in `docs/linkedin-visual-safe-zone-standard.md`.',
              ].join('\n'),
            });
            await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed', state_reason: 'completed' });
