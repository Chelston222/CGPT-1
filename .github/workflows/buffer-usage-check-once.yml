name: Buffer Usage Check Once

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  inspect:
    if: startsWith(github.event.issue.title, '[BUFFER USAGE CHECK]') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Buffer queue, publication evidence and channel health
        uses: actions/github-script@v7
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_LINKEDIN_PERSONAL_CHANNEL_ID: ${{ secrets.BUFFER_LINKEDIN_PERSONAL_CHANNEL_ID }}
          BUFFER_LINKEDIN_BUSINESS_CHANNEL_ID: ${{ secrets.BUFFER_LINKEDIN_BUSINESS_CHANNEL_ID }}
          BUFFER_LINKEDIN_SECONDARY_CHANNEL_ID: ${{ secrets.BUFFER_LINKEDIN_SECONDARY_CHANNEL_ID }}
        with:
          script: |
            try {
              async function buffer(query) {
                const response = await fetch('https://api.buffer.com', {
                  method: 'POST',
                  headers: {
                    'content-type': 'application/json',
                    authorization: `Bearer ${process.env.BUFFER_API_KEY}`,
                  },
                  body: JSON.stringify({ query }),
                });
                let payload;
                try {
                  payload = await response.json();
                } catch {
                  throw new Error(`Buffer returned non-JSON response (HTTP ${response.status})`);
                }
                const messages = (payload.errors || []).map((e) => e.message).filter(Boolean);
                if (!response.ok || messages.length) {
                  throw new Error(messages.join('; ') || `Buffer HTTP ${response.status}`);
                }
                return { data: payload.data, headers: response.headers };
              }

              function acceptedRows(comments) {
                const rows = [];
                for (const comment of comments) {
                  const body = String(comment.body || '');
                  const regex = /^-\s+([^\n:]+?):\s+Buffer post ID\s+`([^`]+)`(?:\s+—\s+([^\s\n]+))?/gm;
                  let match;
                  while ((match = regex.exec(body))) rows.push({ bufferId: match[2], dueAt: match[3] || null });
                }
                return rows;
              }

              function markedIds(comments, marker) {
                const ids = new Set();
                const regex = new RegExp(`<!-- ${marker} bufferId=([^\\s>]+)`, 'g');
                for (const comment of comments) {
                  let match;
                  while ((match = regex.exec(String(comment.body || '')))) ids.add(match[1]);
                }
                return ids;
              }

              if (!process.env.BUFFER_API_KEY) throw new Error('BUFFER_API_KEY is not configured');

              const accountResult = await buffer('query UsageCheck { account { organizations { id } } }');
              const organizationId = accountResult.data?.account?.organizations?.[0]?.id;
              if (!organizationId) throw new Error('Buffer returned no organisation ID');

              const ids = [
                process.env.BUFFER_LINKEDIN_PERSONAL_CHANNEL_ID,
                process.env.BUFFER_LINKEDIN_BUSINESS_CHANNEL_ID,
                process.env.BUFFER_LINKEDIN_SECONDARY_CHANNEL_ID,
              ].filter(Boolean);
              if (!ids.length) throw new Error('No Buffer LinkedIn channel IDs are configured');

              const query = `query ScheduledCapacity { posts(first: 100, input: { organizationId: ${JSON.stringify(organizationId)}, filter: { status: [scheduled], channelIds: ${JSON.stringify(ids)} } }) { edges { node { id channelId dueAt status } } pageInfo { hasNextPage } } }`;
              const scheduledResult = await buffer(query);
              const posts = (scheduledResult.data?.posts?.edges || []).map((e) => e.node);
              const now = Date.now();
              const names = {
                [process.env.BUFFER_LINKEDIN_PERSONAL_CHANNEL_ID]: 'Chelston personal',
                [process.env.BUFFER_LINKEDIN_BUSINESS_CHANNEL_ID]: 'Main 222Emails page',
                [process.env.BUFFER_LINKEDIN_SECONDARY_CHANNEL_ID]: '222Emails | Retention Lab',
              };
              const rows = ids.map((id) => {
                const channelPosts = posts.filter((p) => p.channelId === id);
                const pastDue = channelPosts.filter((p) => p.dueAt && new Date(p.dueAt).getTime() < now);
                const next = channelPosts.filter((p) => p.dueAt && new Date(p.dueAt).getTime() >= now).sort((a,b) => new Date(a.dueAt)-new Date(b.dueAt))[0];
                return {
                  id,
                  name: names[id] || id,
                  scheduled: channelPosts.length,
                  pastDue: pastDue.length,
                  nextDue: next?.dueAt || null,
                  oldestPastDue: pastDue.sort((a,b)=>new Date(a.dueAt)-new Date(b.dueAt))[0]?.dueAt || null,
                };
              });

              const since = new Date(now - 35 * 24 * 60 * 60 * 1000).toISOString();
              const repoIssues = await github.paginate(github.rest.issues.listForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'all',
                creator: context.repo.owner,
                since,
                per_page: 100,
              });
              const approvalIssues = repoIssues.filter((issue) => !issue.pull_request && /\[(?:APPROVED|FAILED) LINKEDIN(?: WEEK)?\]/.test(issue.title));
              let publicationBacklog = 0;
              let analyticsBacklog = 0;
              let explicitPublicationFailures = 0;

              for (const issue of approvalIssues) {
                const comments = await github.paginate(github.rest.issues.listComments, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  per_page: 100,
                });
                const accepted = acceptedRows(comments);
                const verified = markedIds(comments, 'LINKEDIN_PUBLICATION_VERIFIED');
                const failed = markedIds(comments, 'LINKEDIN_PUBLICATION_FAILED');
                const analytics = markedIds(comments, 'LINKEDIN_ANALYTICS_CAPTURED');
                const native = markedIds(comments, 'LINKEDIN_NATIVE_ANALYTICS_REQUIRED');
                explicitPublicationFailures += failed.size;

                for (const row of accepted) {
                  const due = Date.parse(row.dueAt || '');
                  if (Number.isFinite(due) && now - due >= 30 * 60 * 1000 && !verified.has(row.bufferId) && !failed.has(row.bufferId)) publicationBacklog += 1;
                  if (verified.has(row.bufferId) && !analytics.has(row.bufferId) && !native.has(row.bufferId)) analyticsBacklog += 1;
                }
              }

              const rateLimit = accountResult.headers.get('ratelimit') || '(not returned)';
              const policy = accountResult.headers.get('ratelimit-policy') || '(not returned)';
              const lines = rows.map((r) => `- **${r.name}**: scheduled **${r.scheduled}**, past-due **${r.pastDue}**, next due **${r.nextDue || 'none'}**${r.oldestPastDue ? `, oldest past-due **${r.oldestPastDue}**` : ''}`);
              const suspicious = rows.filter((r) => r.pastDue > 0);
              let diagnosis;
              if (suspicious.length || publicationBacklog > 0 || explicitPublicationFailures > 0) {
                diagnosis = `⚠️ Release health is not fully green. Past-due scheduled destinations: ${suspicious.length}; publication-verification backlog: ${publicationBacklog}; explicit publication failures: ${explicitPublicationFailures}.`;
              } else {
                diagnosis = '✅ No past-due scheduled posts or unresolved publication-verification backlog were found. Buffer queues are draining normally at this instant.';
              }

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: [
                  '## Buffer + LinkedIn release diagnostic',
                  '',
                  diagnosis,
                  '',
                  ...lines,
                  '',
                  `- Total scheduled across configured LinkedIn channels: **${posts.length}**`,
                  `- Buffer result pagination incomplete: **${scheduledResult.data?.posts?.pageInfo?.hasNextPage ? 'YES' : 'NO'}**`,
                  `- Publication-verification backlog (>30 min past due): **${publicationBacklog}**`,
                  `- Explicit publication failures recorded: **${explicitPublicationFailures}**`,
                  `- Analytics/native-capture backlog: **${analyticsBacklog}**`,
                  `- API rate-limit header: \`${rateLimit}\``,
                  `- API rate-limit policy: \`${policy}\``,
                  '',
                  'This diagnostic is strictly read-only towards Buffer and LinkedIn. It cannot publish, edit, delete or reschedule a Buffer post.'
                ].join('\n')
              });
            } catch (error) {
              const safeMessage = String(error?.message || error).replace(/Bearer\s+\S+/gi, 'Bearer [REDACTED]').slice(0, 1000);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: [
                  '## Buffer + LinkedIn release diagnostic failed closed',
                  '',
                  `- Error: \`${safeMessage}\``,
                  '- No Buffer publish, edit, delete, reschedule or creation action was attempted.',
                  '- Treat current release state as unverified until this diagnostic passes.'
                ].join('\n')
              });
              core.setFailed(safeMessage);
            }
