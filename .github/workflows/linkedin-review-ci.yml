name: LinkedIn Review CI

on:
  pull_request:
    paths:
      - 'apps/linkedin-review/**'
      - 'scripts/linkedin-review-core.cjs'
      - 'scripts/build-linkedin-master-ledger.mjs'
      - 'tests/linkedin-*.test.cjs'
      - '.github/workflows/linkedin-buffer-autopost.yml'
      - '.github/workflows/linkedin-review-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/linkedin-review/**'
      - 'scripts/linkedin-review-core.cjs'
      - 'scripts/build-linkedin-master-ledger.mjs'
      - 'tests/linkedin-*.test.cjs'
      - '.github/workflows/linkedin-buffer-autopost.yml'
      - '.github/workflows/linkedin-review-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate queue, approval and cross-device sync logic
        run: |
          node --test tests/linkedin-*.test.cjs
          node --check apps/linkedin-review/app.js
          node --check apps/linkedin-review/sync.js
          node --check apps/linkedin-review/netlify/functions/review-decisions.mjs
          node --check scripts/build-linkedin-master-ledger.mjs
          node -e "const q=require('./apps/linkedin-review/queue.json'); if(q.posts.length < 18) process.exit(1); for(const p of q.posts){if(!p.id||!p.copy||!p.targets?.length||!p.scheduledAt) process.exit(1)}"
