name: LinkedIn Review CI

on:
  pull_request:
    paths:
      - 'apps/linkedin-review/**'
      - 'scripts/linkedin-*.cjs'
      - 'scripts/build-linkedin-master-ledger.mjs'
      - 'tests/linkedin-*.test.cjs'
      - 'tests/rr14-content-pool.test.cjs'
      - 'docs/LINKEDIN_*.md'
      - '.github/workflows/linkedin-*.yml'
      - '.github/workflows/buffer-usage-check-once.yml'
  push:
    branches: [main]
    paths:
      - 'apps/linkedin-review/**'
      - 'scripts/linkedin-*.cjs'
      - 'scripts/build-linkedin-master-ledger.mjs'
      - 'tests/linkedin-*.test.cjs'
      - 'tests/rr14-content-pool.test.cjs'
      - 'docs/LINKEDIN_*.md'
      - '.github/workflows/linkedin-*.yml'
      - '.github/workflows/buffer-usage-check-once.yml'

permissions:
  contents: read

concurrency:
  group: linkedin-review-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install review-service dependency
        run: npm install --prefix apps/linkedin-review --ignore-scripts --no-audit --no-fund
      - name: Run authoritative LinkedIn reliability suite
        run: node --test tests/linkedin-*.test.cjs tests/rr14-content-pool.test.cjs
      - name: Validate executable LinkedIn surfaces
        run: |
          node --check apps/linkedin-review/app.js
          node --check apps/linkedin-review/sync.js
          node --check apps/linkedin-review/netlify/functions/review-decisions.mjs
          node --check scripts/build-linkedin-master-ledger.mjs
          for script in scripts/linkedin-*.cjs; do node --check "$script"; done
          node scripts/linkedin-qa-bank-audit.cjs
          node -e "import('./apps/linkedin-review/netlify/functions/review-decisions.mjs').then(() => console.log('decision sync function imports'))"
      - name: Regression-test a real ready carousel through the private-source or provider-media gate
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const path = require('node:path');
          const queue = require('./apps/linkedin-review/queue.json');
          const { isPrivateOpsMediaUrl, preflightMedia, repoRelativePathFromMediaUrl } = require('./scripts/linkedin-media-preflight.cjs');
          const post = queue.posts.find((item) => item.mode === 'schedule' && item.format === 'carousel' && item.carousel?.readiness === 'ready');
          if (!post) throw new Error('No ready carousel is available for integrity regression testing.');

          async function run() {
            if (isPrivateOpsMediaUrl(post.mediaUrl)) {
              const relative = repoRelativePathFromMediaUrl(post.mediaUrl);
              if (!relative) throw new Error('Private-source carousel URL could not be mapped to a repository file.');
              const absolute = path.resolve(relative);
              if (!fs.existsSync(absolute)) throw new Error(`Private-source carousel file is missing: ${relative}`);
              const bytes = fs.readFileSync(absolute);
              const sha256 = crypto.createHash('sha256').update(bytes).digest('hex');
              if (bytes.length !== post.carousel.pdfBytes) throw new Error('Private-source carousel byte count did not match queue metadata.');
              if (sha256 !== post.carousel.pdfSha256) throw new Error('Private-source carousel SHA-256 did not match queue metadata.');
              console.log(`verified private source ${post.id}: ${bytes.length} bytes / ${sha256}`);
              return;
            }

            const proof = await preflightMedia({
              mediaUrl: post.mediaUrl,
              mediaKind: 'document',
              documentThumbnailUrl: post.documentThumbnailUrl,
              documentPageCount: post.carousel.slideCount,
              mediaBytes: post.carousel.pdfBytes,
              mediaSha256: post.carousel.pdfSha256,
            }, fetch, { forbidPrivateOpsMedia: true });
            if (!proof?.media?.sha256 || proof.media.sha256 !== post.carousel.pdfSha256) {
              throw new Error('Provider-safe carousel integrity proof did not match queue metadata.');
            }
            console.log(`verified provider media ${post.id}: ${proof.media.bytes} bytes / ${proof.media.sha256}`);
          }

          run().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
