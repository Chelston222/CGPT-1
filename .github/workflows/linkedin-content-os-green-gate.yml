name: LinkedIn Content OS Green Gate

on:
  issues:
    types: [opened]
  workflow_dispatch:
  schedule:
    - cron: '12 6,18 * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: linkedin-content-os-green-gate
  cancel-in-progress: false

jobs:
  audit:
    if: github.event_name != 'issues' || (startsWith(github.event.issue.title, '[CONTENT OS CHECK]') && github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit closed-loop LinkedIn release and recurring configuration health
        uses: actions/github-script@v7
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_LINKEDIN_PERSONAL_CHANNEL_ID: ${{ secrets.BUFFER_LINKEDIN_PERSONAL_CHANNEL_ID }}
          BUFFER_LINKEDIN_BUSINESS_CHANNEL_ID: ${{ secrets.BUFFER_LINKEDIN_BUSINESS_CHANNEL_ID }}
          BUFFER_LINKEDIN_SECONDARY_CHANNEL_ID: ${{ secrets.BUFFER_LINKEDIN_SECONDARY_CHANNEL_ID }}
        with:
          script: |
            const path = require('node:path');
            const { parseAcceptanceEntries, parseAcceptanceRows, parseIntentKeys, selectTrustedLedgerIssue, unresolvedIntentKeys, validAnalyticsCaptureIds } = require(path.join(process.env.GITHUB_WORKSPACE, 'scripts/linkedin-buffer-acceptance-ledger.cjs'));
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const HARDENING_CUTOFF = Date.parse('2026-08-22T23:25:00Z');
            const HEALTH_TITLE = '[CONTENT OS HEALTH] LinkedIn release gate';

            async function buffer(query) {
              const response = await fetch('https://api.buffer.com', {
                method: 'POST',
                headers: { 'content-type': 'application/json', authorization: `Bearer ${process.env.BUFFER_API_KEY}` },
                body: JSON.stringify({ query }),
              });
              const payload = await response.json().catch(() => ({}));
              const messages = (payload.errors || []).map((error) => error.message).filter(Boolean);
              if (!response.ok || messages.length) throw new Error(messages.join('; ') || `Buffer HTTP ${response.status}`);
              return { data: payload.data, headers: response.headers };
            }

            function markers(comments, kind) {
              const out = new Set();
              const regex = new RegExp(`<!-- ${kind} bufferId=([^\\s>]+)`, 'g');
              for (const comment of comments) {
                if (comment.user?.login !== 'github-actions[bot]') continue;
                let match;
                while ((match = regex.exec(String(comment.body || '')))) out.add(match[1]);
              }
              return out;
            }

            function recurringState(target, channel) {
              const policy = {
                personal: { maxWeek: 7, maxPerDay: 1, requireEveryDay: true },
                main: { maxWeek: 5, maxPerDay: 1, requireEveryDay: false },
                secondary: { maxWeek: 5, maxPerDay: 1, requireEveryDay: false },
              }[target];
              const active = (channel.postingSchedule || []).filter((day) => !day.paused);
              const daily = Object.fromEntries(active.map((day) => [day.day, (day.times || []).length]));
              const weekly = active.reduce((n, day) => n + (day.times || []).length, 0);
              const dailyPass = Object.values(daily).every((n) => n <= policy.maxPerDay);
              const everyDayPass = !policy.requireEveryDay || ['mon','tue','wed','thu','fri','sat','sun'].every((day) => daily[day] === 1);
              return {
                weekly, daily, weeklyPass: weekly <= policy.maxWeek, dailyPass, everyDayPass,
                pass: weekly <= policy.maxWeek && dailyPass && everyDayPass,
              };
            }

            if (!process.env.BUFFER_API_KEY) throw new Error('BUFFER_API_KEY is not configured.');
            const channelIds = {
              personal: process.env.BUFFER_LINKEDIN_PERSONAL_CHANNEL_ID,
              main: process.env.BUFFER_LINKEDIN_BUSINESS_CHANNEL_ID,
              secondary: process.env.BUFFER_LINKEDIN_SECONDARY_CHANNEL_ID,
            };
            if (Object.values(channelIds).some((id) => !id)) throw new Error('One or more LinkedIn Buffer channel IDs are missing.');

            const providerChannels = {};
            for (const [target, id] of Object.entries(channelIds)) {
              const result = await buffer(`query GreenGateChannel { channel(input: { id: ${JSON.stringify(id)} }) { id name displayName isDisconnected isLocked isQueuePaused timezone postingSchedule { day paused times } } }`);
              const channel = result.data?.channel;
              if (!channel || channel.id !== id) throw new Error(`Buffer returned no configured ${target} channel.`);
              providerChannels[target] = channel;
            }

            const providerStates = Object.fromEntries(Object.entries(providerChannels).map(([target, channel]) => [target, {
              recurring: recurringState(target, channel),
              connected: !channel.isDisconnected && !channel.isLocked && !channel.isQueuePaused,
              timezonePass: channel.timezone === 'Europe/London',
              identityPass: target !== 'secondary' || /retention school/i.test(String(channel.displayName || channel.name || '')),
            }]));
            const providerConfigHealthy = Object.values(providerStates).every((state) => state.recurring.pass && state.connected && state.timezonePass && state.identityPass);

            const account = await buffer('query ContentOsAccount { account { organizations { id } } }');
            const organizationId = account.data?.account?.organizations?.[0]?.id;
            if (!organizationId) throw new Error('Buffer returned no organisation ID.');
            const scheduled = await buffer(`query ContentOsScheduled { posts(first: 100, input: { organizationId: ${JSON.stringify(organizationId)}, filter: { status: [scheduled], channelIds: ${JSON.stringify(Object.values(channelIds))} } }) { edges { node { id channelId dueAt status isCustomScheduled shareMode } } pageInfo { hasNextPage } } }`);
            const posts = (scheduled.data?.posts?.edges || []).map((edge) => edge.node);
            const slotDrivenPosts = posts.filter((post) => !post.isCustomScheduled || post.shareMode !== 'customScheduled');
            const queueFingerprint = require('node:crypto').createHash('sha256')
              .update([...posts].sort((a, b) => String(a.id).localeCompare(String(b.id))).map((post) => [post.id, post.channelId, post.dueAt, post.status, post.isCustomScheduled, post.shareMode].join('|')).join('\n'))
              .digest('hex');
            const now = Date.now();
            const queue = Object.fromEntries(Object.entries(channelIds).map(([target, id]) => {
              const rows = posts.filter((post) => post.channelId === id);
              return [target, {
                scheduled: rows.length,
                pastDue: rows.filter((post) => post.dueAt && Date.parse(post.dueAt) < now).length,
                nextDue: rows.filter((post) => post.dueAt && Date.parse(post.dueAt) >= now).sort((a, b) => Date.parse(a.dueAt) - Date.parse(b.dueAt))[0]?.dueAt || null,
              }];
            }));

            let durableLedger = null;
            let ledgerError = null;
            let durableEntries = new Map();
            let durableRows = [];
            try {
              // Ledger discovery must include bot-created and closed history, without
              // the recency/creator filters used for the approval reporting window.
              const ledgerUniverse = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'all', per_page: 100 });
              durableLedger = selectTrustedLedgerIssue(ledgerUniverse, owner);
              if (!durableLedger) throw new Error('Trusted Buffer acceptance ledger does not exist.');
              const ledgerComments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: durableLedger.number, per_page: 100 });
              durableEntries = parseAcceptanceEntries(ledgerComments);
              durableRows = parseAcceptanceRows(ledgerComments);
              const unresolved = unresolvedIntentKeys(ledgerComments);
              if (unresolved.size) throw new Error(`${unresolved.size} durable Buffer dispatch intent(s) remain unresolved; reconcile provider evidence before publishing.`);
            } catch (error) {
              ledgerError = String(error.message || error);
            }
            let ledgerHealthy = ledgerError === null;

            // Old untouched approvals can still carry unresolved publication debt.
            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'all', creator: owner, per_page: 100 });
            const approvalIssues = issues.filter((issue) => !issue.pull_request
              && /\[(?:APPROVED|FAILED) LINKEDIN(?: WEEK)?\]/.test(issue.title)
              && !/^\[(?:APPROVED|FAILED) LINKEDIN\]\s+Buffer acceptance ledger$/i.test(issue.title));
            const openApprovals = approvalIssues.filter((issue) => issue.state === 'open' && issue.title.startsWith('[APPROVED LINKEDIN')).length;

            let publicationBacklog = 0;
            let publicationFailures = 0;
            let currentAnalyticsBacklog = 0;
            let currentNativeBacklog = 0;
            let legacyNativeDebt = 0;
            let legacyDispatchesAfterCutoff = 0;
            let superseded = 0;
            let retiredDrafts = 0;
            const mappedDurableBufferIds = new Set();

            for (const issue of approvalIssues) {
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: issue.number, per_page: 100 });
              const verified = markers(comments, 'LINKEDIN_PUBLICATION_VERIFIED');
              const failed = markers(comments, 'LINKEDIN_PUBLICATION_FAILED');
              const supersededIds = markers(comments, 'LINKEDIN_PUBLICATION_SUPERSEDED');
              const draftRetired = markers(comments, 'LINKEDIN_DRAFT_CANARY_RETIRED');
              const draftVerified = markers(comments, 'LINKEDIN_DRAFT_CANARY_VERIFIED');
              const ownerAbandoned = markers(comments, 'LINKEDIN_OWNER_ABANDONED_DRAFT');
              const analytics = validAnalyticsCaptureIds(comments);
              const nativeRequired = markers(comments, 'LINKEDIN_NATIVE_ANALYTICS_REQUIRED');
              const nativeCaptured = markers(comments, 'LINKEDIN_NATIVE_ANALYTICS_CAPTURED');
              publicationFailures += failed.size;
              superseded += supersededIds.size;
              retiredDrafts += draftRetired.size;

              for (const comment of comments) {
                const ts = Date.parse(comment.created_at || comment.updated_at || '');
                if (Number.isFinite(ts) && ts >= HARDENING_CUTOFF && String(comment.body || '').includes('repository-owner-approved-legacy')) legacyDispatchesAfterCutoff += 1;
              }

              const approvalRowsById = new Map(parseAcceptanceRows(comments).map((row) => [row.bufferId, { ...row }]));
              for (const [key, mirrored] of parseAcceptanceEntries(comments)) {
                const durable = durableEntries.get(key);
                if (durable && durable.bufferId !== mirrored.bufferId) {
                  ledgerHealthy = false;
                  ledgerError = `Acceptance ledger conflict for ${key}: approval #${issue.number} records a different Buffer ID.`;
                }
              }
              // An interrupted acceptance mirror can be recovered only when this
              // genuine owner approval has the exact trusted dispatch intent.
              const intendedBufferIds = new Set([...parseIntentKeys(comments)].map((key) => durableEntries.get(key)?.bufferId).filter(Boolean));
              for (const row of durableRows) {
                const mirrored = approvalRowsById.get(row.bufferId);
                if (!mirrored && !intendedBufferIds.has(row.bufferId)) continue;
                if (!mirrored) { approvalRowsById.set(row.bufferId, { ...row }); continue; }
                const dateConflict = mirrored.scheduleConflict || row.scheduleConflict
                  || (mirrored.dueAt && row.dueAt && Date.parse(mirrored.dueAt) !== Date.parse(row.dueAt));
                if (dateConflict) {
                  ledgerHealthy = false;
                  ledgerError = `Acceptance schedule conflict for ${row.bufferId} between durable history and approval #${issue.number}.`;
                }
                mirrored.dueAt = dateConflict ? null : mirrored.dueAt || row.dueAt;
                mirrored.scheduleConflict = Boolean(dateConflict);
                if (Number.isFinite(row.acceptedAt)) mirrored.acceptedAt = Number.isFinite(mirrored.acceptedAt) ? Math.min(mirrored.acceptedAt, row.acceptedAt) : row.acceptedAt;
              }
              for (const row of approvalRowsById.values()) {
                mappedDurableBufferIds.add(row.bufferId);
                const terminal = verified.has(row.bufferId) || failed.has(row.bufferId) || supersededIds.has(row.bufferId) || draftRetired.has(row.bufferId) || draftVerified.has(row.bufferId) || ownerAbandoned.has(row.bufferId);
                const due = Date.parse(row.dueAt || '');
                const isCurrent = Number.isFinite(row.acceptedAt) && row.acceptedAt >= HARDENING_CUTOFF;
                if (!terminal && (!Number.isFinite(row.acceptedAt) || !Number.isFinite(due) || (isCurrent && now - due >= 30 * 60 * 1000))) publicationBacklog += 1;
                if (!verified.has(row.bufferId)) continue;
                if (!analytics.has(row.bufferId) && !nativeRequired.has(row.bufferId) && !nativeCaptured.has(row.bufferId) && isCurrent) currentAnalyticsBacklog += 1;
                if (nativeRequired.has(row.bufferId) && !nativeCaptured.has(row.bufferId)) {
                  if (isCurrent) currentNativeBacklog += 1;
                  else legacyNativeDebt += 1;
                }
              }
            }

            // Ledger-only acceptance is not proof of an owner-approved release.
            // Missing provenance remains UNKNOWN even when its due time is future.
            const orphanedDurableRows = durableRows.filter((row) => !mappedDurableBufferIds.has(row.bufferId));
            publicationBacklog += orphanedDurableRows.length;

            const paginationIncomplete = scheduled.data?.posts?.pageInfo?.hasNextPage === true;
            const queueHealthy = Object.values(queue).every((row) => row.scheduled > 0 && row.scheduled <= 10);
            const noPastDue = Object.values(queue).every((row) => row.pastDue === 0);
            const fixedTimeQueue = slotDrivenPosts.length === 0;
            const green = ledgerHealthy && providerConfigHealthy && fixedTimeQueue && queueHealthy && noPastDue && !paginationIncomplete && publicationBacklog === 0 && publicationFailures === 0 && currentAnalyticsBacklog === 0 && currentNativeBacklog === 0 && legacyDispatchesAfterCutoff === 0 && openApprovals === 0;

            const checks = [
              ['Durable acceptance ledger unique, readable and reconciled', ledgerHealthy],
              ['Durable acceptances linked to owner approvals', orphanedDurableRows.length === 0],
              ['Provider recurring schedules, timezone, connection state and Retention School identity aligned', providerConfigHealthy],
              ['Scheduled queue fixed-time and immune to recurring-slot movement', fixedTimeQueue],
              ['Queue healthy and non-empty', queueHealthy],
              ['No past-due scheduled posts', noPastDue],
              ['Buffer pagination complete', !paginationIncomplete],
              ['Publication verification current', ledgerHealthy && publicationBacklog === 0],
              ['No explicit publication failures', publicationFailures === 0],
              ['Current Buffer analytics captured or correctly routed', currentAnalyticsBacklog === 0],
              ['Current native LinkedIn analytics capture current', currentNativeBacklog === 0],
              ['No legacy dispatch since hardening', legacyDispatchesAfterCutoff === 0],
              ['No approval left waiting between cycles', openApprovals === 0],
            ];

            const providerLines = Object.entries(providerChannels).flatMap(([target, channel]) => {
              const state = providerStates[target];
              return [
                `- ${target} provider: **${channel.displayName || channel.name || '(unnamed)'}**, timezone **${channel.timezone || '(none)'}**, recurring slots **${state.recurring.weekly}**, connected **${state.connected ? 'YES' : 'NO'}**`,
                `  - recurring contract: **${state.recurring.pass ? 'PASS' : 'FAIL'}**; timezone: **${state.timezonePass ? 'PASS' : 'FAIL'}**; identity: **${state.identityPass ? 'PASS' : 'FAIL'}**`,
              ];
            });

            const body = [
              '# LinkedIn Content OS health', '',
              green ? '🟢 **GREEN** — every current release and recurring-configuration invariant passes.' : '🟠 **NOT GREEN** — at least one release or recurring-configuration invariant still needs evidence or action.', '',
              ...checks.map(([label, pass]) => `- ${pass ? '✅' : '❌'} ${label}`), '',
              `- Durable acceptance ledger: **${durableLedger ? `#${durableLedger.number}` : 'unavailable'}**`,
              `- Durable acceptances without owner-approval provenance: **${orphanedDurableRows.length}**`,
              ...(ledgerError ? [`- Durable ledger validation failed: ${ledgerError}`, '- Publication receipt totals below are incomplete evidence while the durable ledger is unavailable or unreconciled.'] : []), '',
              '### Provider configuration', ...providerLines, '',
              `- Scheduled posts vulnerable to recurring-slot movement: **${slotDrivenPosts.length}**`,
              `- Immutable queue fingerprint: \`${queueFingerprint}\``,
              `- Chelston personal scheduled: **${queue.personal.scheduled}**, past-due **${queue.personal.pastDue}**, next **${queue.personal.nextDue || 'none'}**`,
              `- Main 222Emails scheduled: **${queue.main.scheduled}**, past-due **${queue.main.pastDue}**, next **${queue.main.nextDue || 'none'}**`,
              `- Secondary configured channel scheduled: **${queue.secondary.scheduled}**, past-due **${queue.secondary.pastDue}**, next **${queue.secondary.nextDue || 'none'}**`,
              `- Publication verification backlog: **${publicationBacklog}**`,
              `- Publication failures: **${publicationFailures}**`,
              `- Intentionally superseded/not-published historical placements: **${superseded}**`,
              `- Retired non-public draft canaries: **${retiredDrafts}**`,
              `- Current Buffer analytics backlog: **${currentAnalyticsBacklog}**`,
              `- Current native analytics backlog: **${currentNativeBacklog}**`,
              `- Preserved pre-hardening native analytics debt: **${legacyNativeDebt}**`,
              `- Legacy dispatches after hardening cutoff: **${legacyDispatchesAfterCutoff}**`,
              `- Open approval issues: **${openApprovals}**`,
              `- Buffer pagination incomplete: **${paginationIncomplete ? 'YES' : 'NO'}**`,
              `- Checked at: **${new Date(now).toISOString()}**`, '',
              `GREEN now covers both current closed-loop release health and the recurring Buffer configuration that can create future Next Available placements. Historical analytics debt stays visible and is never rewritten as captured.`,
            ].join('\n');

            const allOpen = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 });
            const existing = allOpen.find((issue) => !issue.pull_request && issue.title === HEALTH_TITLE);
            if (green) {
              if (existing) {
                await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed', state_reason: 'completed' });
              }
            } else if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title: HEALTH_TITLE, body });
            }

            if (context.eventName === 'issues') {
              await github.rest.issues.createComment({ owner, repo, issue_number: context.issue.number, body });
              await github.rest.issues.update({ owner, repo, issue_number: context.issue.number, state: 'closed', state_reason: 'completed' });
            }
            core.summary.addHeading('LinkedIn Content OS Green Gate').addRaw(body).write();
            if (!green) core.setFailed('LinkedIn Content OS is not GREEN. See the health issue for failed invariants.');
