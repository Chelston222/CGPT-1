name: LinkedIn Publication Backlog Detail

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: github.event_name != 'issues' || (startsWith(github.event.issue.title, '[LINKEDIN BACKLOG DETAIL]') && github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    steps:
      - name: Identify exact current publication-verification backlog
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const cutoff = Date.parse('2026-08-22T23:25:00Z');
            const now = Date.now();
            const rows = [];

            function acceptedRows(comments) {
              const out = [];
              for (const comment of comments) {
                const body = String(comment.body || '');
                const regex = /^-\s+([^\n:]+?):\s+Buffer post ID\s+`([^`]+)`(?:\s+—\s+([^\s\n]+))?/gm;
                let match;
                while ((match = regex.exec(body))) out.push({
                  label: match[1].trim(),
                  bufferId: match[2],
                  dueAt: match[3] || null,
                  acceptedAt: Date.parse(comment.created_at || comment.updated_at || ''),
                });
              }
              return out;
            }

            function markerSet(comments, marker) {
              const set = new Set();
              const regex = new RegExp(`<!-- ${marker} bufferId=([^\\s>]+)`, 'g');
              for (const comment of comments) {
                let match;
                while ((match = regex.exec(String(comment.body || '')))) set.add(match[1]);
              }
              return set;
            }

            // Match the production Content OS evidence window exactly.
            const since = new Date(now - 45 * 24 * 60 * 60 * 1000).toISOString();
            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'all', since, per_page: 100 });
            const approvals = issues.filter((issue) => !issue.pull_request && /\[(?:APPROVED|FAILED) LINKEDIN(?: WEEK)?\]/.test(issue.title));
            for (const issue of approvals) {
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: issue.number, per_page: 100 });
              const verified = markerSet(comments, 'LINKEDIN_PUBLICATION_VERIFIED');
              const failed = markerSet(comments, 'LINKEDIN_PUBLICATION_FAILED');
              const superseded = markerSet(comments, 'LINKEDIN_PUBLICATION_SUPERSEDED');
              const draftRetired = markerSet(comments, 'LINKEDIN_DRAFT_CANARY_RETIRED');
              const draftVerified = markerSet(comments, 'LINKEDIN_DRAFT_CANARY_VERIFIED');
              for (const row of acceptedRows(comments)) {
                if (!Number.isFinite(row.acceptedAt) || row.acceptedAt < cutoff) continue;
                const due = Date.parse(row.dueAt || '');
                if (!Number.isFinite(due) || now - due < 30 * 60 * 1000) continue;
                const terminal = verified.has(row.bufferId) || failed.has(row.bufferId) || superseded.has(row.bufferId) || draftRetired.has(row.bufferId) || draftVerified.has(row.bufferId);
                if (!terminal) rows.push({ ...row, issueNumber: issue.number, issueTitle: issue.title });
              }
            }

            const body = [
              '# Current LinkedIn publication backlog detail', '',
              `Checked: **${new Date(now).toISOString()}**`,
              `Hardening cutoff: **${new Date(cutoff).toISOString()}**`,
              `Evidence window: **45 days**`,
              `Current unresolved post-hardening placements beyond grace: **${rows.length}**`, '',
              ...(rows.length ? rows.map((row) => `- Issue #${row.issueNumber} · ${row.issueTitle}\n  - ${row.label}\n  - Buffer ID: \`${row.bufferId}\`\n  - Due: **${row.dueAt}**\n  - Accepted: **${new Date(row.acceptedAt).toISOString()}**`) : ['- ✅ None.']), '',
              'This diagnostic is GitHub-evidence-only and performs no Buffer mutation.',
            ].join('\n');
            await github.rest.issues.createComment({ owner, repo, issue_number: context.issue.number, body });
            await github.rest.issues.update({ owner, repo, issue_number: context.issue.number, state: 'closed', state_reason: 'completed' });
            core.summary.addHeading('LinkedIn Publication Backlog Detail').addRaw(body).write();
