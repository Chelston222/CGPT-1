name: LinkedIn IMAP PDF Intake

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: linkedin-imap-pdf-intake
  cancel-in-progress: false

jobs:
  chauffeur-intake:
    if: github.event.issue.user.login == github.repository_owner && github.event.issue.title == '[IMAP PDF INTAKE] rs-li-chauffeur-open-quote-recovery-001'
    runs-on: ubuntu-latest
    env:
      TTE_SMTP_PASS: ${{ secrets.TTE_SMTP_PASS }}
      TTE_SMTP_USER: hello@222emails.com
      TTE_IMAP_HOST: mail.privateemail.com
      TTE_IMAP_PORT: '993'
      TTE_LINKEDIN_INTAKE_ID: rs-li-chauffeur-open-quote-recovery-001
      TTE_LINKEDIN_INTAKE_SUBJECT: TTE LINKEDIN PDF INTAKE rs-li-chauffeur-open-quote-recovery-001
      TTE_LINKEDIN_INTAKE_SENDER: tripletwochelston@gmail.com
      TTE_LINKEDIN_INTAKE_FILENAME: Retention School - Chauffeur Open Quote Recovery - LinkedIn Carousel.pdf
      TTE_LINKEDIN_INTAKE_SHA256: 33e8e51221053334ff7c830dfe06421d4854026ee162da21898c9d2ef20a97a1
      TTE_LINKEDIN_INTAKE_BYTES: '20593546'
      TTE_LINKEDIN_MANIFEST_JSON: |
        {
          "schemaVersion": 1,
          "id": "rs-li-chauffeur-open-quote-recovery-001",
          "revision": 1,
          "title": "Stop losing bookings after the quote.",
          "documentTitle": "Chauffeur Open Quote Recovery System",
          "category": "buyer_diagnostics",
          "funnelStage": "mof",
          "targets": ["secondary"],
          "mode": "schedule",
          "scheduledAt": {"secondary": "2026-09-09T08:45:00+01:00"},
          "copy": {"default": "You sent the quote.\nThen... silence.\n\nThat is not always a no.\n\nFor chauffeur businesses, an open quote is often an operations problem before it is a lead problem.\n\nA simple recovery process:\n- track every open quote\n- review them daily\n- follow up with purpose\n- record what happened\n\nThe aim is not pressure. It is clarity, good timing and making the next step easy.\n\nThis carousel shows the system.\n\nRetention School is building practical Client Return Systems for appointment-led businesses.\n\nSave this and run the 10-minute review on your current quote list."},
          "mediaAlt": "Retention School carousel showing a chauffeur open quote recovery system for tracking, reviewing, following up and closing open quotes.",
          "expectedSha256": "33e8e51221053334ff7c830dfe06421d4854026ee162da21898c9d2ef20a97a1",
          "sourceUrl": "https://app.notion.com/p/3d1e72eb858781b18a19e6cb1c0b15aa"
        }

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify existing PrivateEmail credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TTE_SMTP_PASS" || { echo 'TTE_SMTP_PASS is missing'; exit 2; }

      - name: Install IMAP and PDF tooling
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --prefix apps/tte-mail-bridge
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Retrieve exact attachment and build locked manifest
        id: bridge
        shell: bash
        run: |
          set -euo pipefail
          node scripts/linkedin-imap-pdf-intake.mjs

      - name: Reconstruct, verify and queue PDF
        id: intake
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: main
        shell: bash
        run: |
          set -euo pipefail
          node scripts/linkedin-pdf-intake.cjs "${{ steps.bridge.outputs.manifest_path }}" > /tmp/pdf-intake-result.json
          cat /tmp/pdf-intake-result.json
          node -e "const r=require('/tmp/pdf-intake-result.json'); console.log('pdf_url='+r.urls.pdfUrl); console.log('thumbnail_url='+r.urls.thumbnailUrl); console.log('post_id='+r.post.id); console.log('revision='+r.post.revision); console.log('pages='+r.metadata.pageCount); console.log('bytes='+r.metadata.bytes); console.log('sha256='+r.metadata.sha256);" >> "$GITHUB_OUTPUT"

      - name: Enforce exact expected media proof
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.intake.outputs.post_id }}' = 'rs-li-chauffeur-open-quote-recovery-001'
          test '${{ steps.intake.outputs.revision }}' = '1'
          test '${{ steps.intake.outputs.pages }}' = '10'
          test '${{ steps.intake.outputs.bytes }}' = '20593546'
          test '${{ steps.intake.outputs.sha256 }}' = '33e8e51221053334ff7c830dfe06421d4854026ee162da21898c9d2ef20a97a1'

      - name: Run governed media regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/linkedin-pdf-intake.test.cjs
          node --test tests/linkedin-media-preflight.test.cjs

      - name: Commit governed media package and locked queue revision
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/linkedin-review/queue.json apps/linkedin-review/media/intake/rs-li-chauffeur-open-quote-recovery-001
          git diff --cached --quiet && { echo 'Expected governed media/queue changes are missing.' >&2; exit 1; }
          git commit -m 'Promote LinkedIn PDF rs-li-chauffeur-open-quote-recovery-001@1'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify public raw media reachability and digest
        shell: bash
        run: |
          set -euo pipefail
          sleep 4
          pdf='${{ steps.intake.outputs.pdf_url }}'
          thumb='${{ steps.intake.outputs.thumbnail_url }}'
          curl --fail --location --silent --show-error --retry 5 --retry-delay 2 "$pdf" -o /tmp/public.pdf
          curl --fail --location --silent --show-error --retry 5 --retry-delay 2 "$thumb" -o /tmp/public.jpg
          test "$(stat -c%s /tmp/public.pdf)" = '20593546'
          test "$(sha256sum /tmp/public.pdf | awk '{print $1}')" = '33e8e51221053334ff7c830dfe06421d4854026ee162da21898c9d2ef20a97a1'
          test "$(pdfinfo /tmp/public.pdf | awk '/^Pages:/ {print $2}')" = '10'
          file /tmp/public.jpg | grep -Eqi 'JPEG|image'

      - name: Record governed intake proof
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = '[PDF INTAKE READY] rs-li-chauffeur-open-quote-recovery-001@1';
            const body = [
              '✅ Governed LinkedIn PDF intake completed through the existing PrivateEmail IMAP credential.',
              '',
              '- Queue item: **rs-li-chauffeur-open-quote-recovery-001@1**',
              '- Pages: **10**',
              '- Bytes: **20,593,546**',
              '- SHA-256: `33e8e51221053334ff7c830dfe06421d4854026ee162da21898c9d2ef20a97a1`',
              `- PDF: ${{ steps.intake.outputs.pdf_url }}`,
              `- Thumbnail: ${{ steps.intake.outputs.thumbnail_url }}`,
              `- Source mailbox: ${{ steps.bridge.outputs.source_mailbox }}`,
              `- Source UID: ${{ steps.bridge.outputs.source_uid }}`,
              '',
              'This proves exact media and queue readiness only. Owner approval remains a separate gate.',
            ].join('\n');
            const existing = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 });
            const match = existing.find((issue) => issue.title === title);
            if (match) await github.rest.issues.update({ owner, repo, issue_number: match.number, body });
            else await github.rest.issues.create({ owner, repo, title, body });

      - name: Close transport trigger with proof
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ Exact chauffeur PDF retrieved from PrivateEmail, independently re-verified, promoted to governed GitHub media and locked into queue revision 1. See the `[PDF INTAKE READY]` issue for the media proof.'
            });
            await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed' });
