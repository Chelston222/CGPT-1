name: LinkedIn IMAP PDF Intake

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: linkedin-imap-pdf-intake
  cancel-in-progress: false

jobs:
  intake:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[IMAP PDF INTAKE] ')
    runs-on: ubuntu-latest
    env:
      TTE_SMTP_PASS: ${{ secrets.TTE_SMTP_PASS }}
      TTE_SMTP_USER: hello@222emails.com
      TTE_IMAP_HOST: mail.privateemail.com
      TTE_IMAP_PORT: '993'
      TTE_BRIDGE_TOKEN: ${{ secrets.TTE_BRIDGE_TOKEN }}

    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh to latest main after concurrency wait
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main

      - name: Verify private media-hosting contract
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TTE_BRIDGE_TOKEN:-}" || { echo 'TTE_BRIDGE_TOKEN is missing'; exit 2; }
          test ${#TTE_BRIDGE_TOKEN} -ge 24 || { echo 'TTE_BRIDGE_TOKEN must be at least 24 characters'; exit 2; }
          echo 'Private repository media transport is available through the Netlify capability bridge.'

      - name: Verify existing PrivateEmail credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TTE_SMTP_PASS" || { echo 'TTE_SMTP_PASS is missing'; exit 2; }

      - name: Install IMAP and PDF tooling
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --prefix apps/tte-mail-bridge
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Parse owner-locked intake and retrieve exact attachment
        id: bridge
        shell: bash
        run: |
          set -euo pipefail
          node scripts/linkedin-imap-intake-from-issue.mjs

      - name: Reconstruct, verify and queue PDF
        id: intake
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: main
        shell: bash
        run: |
          set -euo pipefail
          node scripts/linkedin-pdf-intake.cjs "${{ steps.bridge.outputs.manifest_path }}" > /tmp/pdf-intake-result.json
          cat /tmp/pdf-intake-result.json
          node -e "const r=require('/tmp/pdf-intake-result.json'); console.log('post_id='+r.post.id); console.log('revision='+r.post.revision); console.log('pages='+r.metadata.pageCount); console.log('bytes='+r.metadata.bytes); console.log('sha256='+r.metadata.sha256); console.log('replay='+(r.queueResult?.replay===true?'true':'false'));" >> "$GITHUB_OUTPUT"

      - name: Enforce exact media proof
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.intake.outputs.revision }}' = '${{ steps.bridge.outputs.revision }}'
          test '${{ steps.intake.outputs.pages }}' = '${{ steps.bridge.outputs.expected_pages }}'
          test '${{ steps.intake.outputs.bytes }}' = '${{ steps.bridge.outputs.bytes }}'
          test '${{ steps.intake.outputs.sha256 }}' = '${{ steps.bridge.outputs.sha256 }}'

      - name: Run governed media regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/linkedin-imap-intake-config.test.cjs
          node --test tests/linkedin-pdf-intake.test.cjs
          node --test tests/linkedin-media-preflight.test.cjs
          node --test tests/linkedin-notion-quality-gate.test.cjs

      - name: Commit governed media package and locked queue revision
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: main
          EXPECTED_PAGES: ${{ steps.intake.outputs.pages }}
          EXPECTED_BYTES: ${{ steps.intake.outputs.bytes }}
          EXPECTED_SHA: ${{ steps.intake.outputs.sha256 }}
          POST_ID: ${{ steps.intake.outputs.post_id }}
          REVISION: ${{ steps.intake.outputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          post_id="$POST_ID"
          revision="$REVISION"
          manifest='${{ steps.bridge.outputs.manifest_path }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            echo "Queue commit attempt ${attempt}/3"
            git fetch origin main
            git reset --hard origin/main

            node scripts/linkedin-pdf-intake.cjs "$manifest" > /tmp/pdf-intake-retry.json
            node -e "const r=require('/tmp/pdf-intake-retry.json'); if(String(r.metadata.pageCount)!==process.env.EXPECTED_PAGES) throw new Error('Retry page-count drift'); if(String(r.metadata.bytes)!==process.env.EXPECTED_BYTES) throw new Error('Retry byte-count drift'); if(String(r.metadata.sha256)!==process.env.EXPECTED_SHA) throw new Error('Retry SHA drift'); if(String(r.post.id)!==process.env.POST_ID) throw new Error('Retry post ID drift'); if(String(r.post.revision)!==process.env.REVISION) throw new Error('Retry revision drift');"

            git add apps/linkedin-review/queue.json "apps/linkedin-review/media/intake/${post_id}"
            if git diff --cached --quiet; then
              echo "${post_id}@${revision} is already promoted with the exact locked state. Treating this trigger as an idempotent replay."
              exit 0
            fi
            git commit -m "Promote LinkedIn PDF ${post_id}@${revision}"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo 'Main advanced before push; rebuilding against the latest governed queue.' >&2
            sleep $((attempt * 2))
          done
          echo 'Unable to commit governed media after three latest-main rebuild attempts.' >&2
          exit 1

      - name: Pin governed media URLs to immutable promotion commit
        id: pin
        env:
          POST_ID: ${{ steps.intake.outputs.post_id }}
          REVISION: ${{ steps.intake.outputs.revision }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          emit_outputs() {
            node -e "const r=require('/tmp/pdf-pin-result.json'); if(!/^[a-f0-9]{40}$/i.test(String(r.ref||''))) throw new Error('Pinned media ref is not an immutable commit SHA'); console.log('pdf_url='+r.pdfUrl); console.log('thumbnail_url='+r.thumbnailUrl); console.log('media_ref='+r.ref); console.log('pin_replay='+(r.replay===true?'true':'false'));" >> "$GITHUB_OUTPUT"
          }

          for attempt in 1 2 3; do
            echo "Immutable media pin attempt ${attempt}/3"
            git fetch origin main
            git reset --hard origin/main
            media_ref="$(git rev-parse HEAD)"

            MEDIA_REF="$media_ref" node <<'NODE' > /tmp/pdf-pin-result.json
          const { pinQueueMediaUrls } = require('./scripts/linkedin-pdf-intake.cjs');
          const result = pinQueueMediaUrls('apps/linkedin-review/queue.json', {
            id: process.env.POST_ID,
            revision: Number(process.env.REVISION),
            owner: process.env.REPO_OWNER,
            repo: process.env.REPO_NAME,
            ref: process.env.MEDIA_REF,
          });
          process.stdout.write(JSON.stringify(result, null, 2));
          NODE

            if git diff --quiet -- apps/linkedin-review/queue.json; then
              emit_outputs
              exit 0
            fi

            git add apps/linkedin-review/queue.json
            git commit -m "Pin LinkedIn PDF ${POST_ID}@${REVISION} media to immutable commit"
            if git push origin HEAD:main; then
              emit_outputs
              exit 0
            fi
            echo 'Main advanced before immutable media pin push; rebuilding pin against latest main.' >&2
            sleep $((attempt * 2))
          done
          echo 'Unable to pin governed media URLs after three latest-main rebuild attempts.' >&2
          exit 1

      - name: Verify private hosted media reachability and digest
        id: private_media
        env:
          POST_ID: ${{ steps.intake.outputs.post_id }}
          REVISION: ${{ steps.intake.outputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' > /tmp/private-media-proof.json
          const fs = require('node:fs');
          const { preflightMedia, MEDIA_BRIDGE_BASE } = require('./scripts/linkedin-media-preflight.cjs');

          (async () => {
            const queue = JSON.parse(fs.readFileSync('apps/linkedin-review/queue.json', 'utf8'));
            const post = (queue.posts || []).find((item) => item.id === process.env.POST_ID && String(item.revision) === String(process.env.REVISION));
            if (!post) throw new Error('Pinned queue revision is missing before private-media verification.');
            const request = {
              mediaUrl: post.mediaUrl,
              mediaKind: 'document',
              documentThumbnailUrl: post.documentThumbnailUrl || post.mediaPreviewUrl,
              documentPageCount: Number(post.carousel?.slideCount || post.documentPageCount || 0),
              mediaBytes: Number(post.carousel?.pdfBytes || post.mediaBytes || 0),
              mediaSha256: String(post.carousel?.pdfSha256 || post.mediaSha256 || ''),
            };
            const proof = await preflightMedia(request, fetch, {
              uploadToken: process.env.TTE_BRIDGE_TOKEN,
              requirePrivateBridge: true,
            });
            if (!request.mediaUrl.startsWith(MEDIA_BRIDGE_BASE)) throw new Error('PDF did not move onto the private media bridge.');
            if (!request.documentThumbnailUrl.startsWith(MEDIA_BRIDGE_BASE)) throw new Error('Thumbnail did not move onto the private media bridge.');
            if (proof.media.bytes !== Number(process.env.EXPECTED_BYTES || request.mediaBytes)) throw new Error('Private bridge PDF byte mismatch.');
            if (proof.media.sha256 !== String(process.env.EXPECTED_SHA || request.mediaSha256)) throw new Error('Private bridge PDF SHA mismatch.');
            process.stdout.write(JSON.stringify({
              host: new URL(request.mediaUrl).host,
              pdfBytes: proof.media.bytes,
              pdfSha256: proof.media.sha256,
              thumbnailBytes: proof.thumbnail?.bytes || null,
              thumbnailSha256: proof.thumbnail?.sha256 || null,
            }, null, 2));
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
          cat /tmp/private-media-proof.json
          node -e "const p=require('/tmp/private-media-proof.json'); console.log('host='+p.host); console.log('pdf_sha256='+p.pdfSha256); console.log('private_media_ready=true');" >> "$GITHUB_OUTPUT"
        env:
          POST_ID: ${{ steps.intake.outputs.post_id }}
          REVISION: ${{ steps.intake.outputs.revision }}
          EXPECTED_BYTES: ${{ steps.intake.outputs.bytes }}
          EXPECTED_SHA: ${{ steps.intake.outputs.sha256 }}
          TTE_BRIDGE_TOKEN: ${{ secrets.TTE_BRIDGE_TOKEN }}

      - name: Record governed intake proof
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = `[PDF INTAKE READY] ${{ steps.intake.outputs.post_id }}@${{ steps.intake.outputs.revision }}`;
            const body = [
              '✅ Governed LinkedIn PDF intake completed through the permanent PrivateEmail IMAP bridge.',
              '',
              `- Queue item: **${{ steps.intake.outputs.post_id }}@${{ steps.intake.outputs.revision }}**`,
              `- Pages: **${{ steps.intake.outputs.pages }}**`,
              `- Bytes: **${{ steps.intake.outputs.bytes }}**`,
              `- SHA-256: \`${{ steps.intake.outputs.sha256 }}\``,
              `- Immutable media commit: \`${{ steps.pin.outputs.media_ref }}\``,
              '- Media transport: **private repository → capability-gated Netlify bridge**',
              `- Private media host: **${{ steps.private_media.outputs.host }}**`,
              `- Source mailbox: ${{ steps.bridge.outputs.source_mailbox }}`,
              `- Source UID: ${{ steps.bridge.outputs.source_uid }}`,
              `- Intake replay: **${{ steps.intake.outputs.replay }}**`,
              `- Immutable pin replay: **${{ steps.pin.outputs.pin_replay }}**`,
              '- Repository visibility dependency: **none**. Buffer-facing media is served from the verified private-media bridge.'
              '',
              'This proves exact media and queue readiness only. It is not permission to publish.',
              'Publishing still requires the repository-owner `[APPROVED LINKEDIN]` gate.',
            ].join('\n');
            const existing = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'all', per_page: 100 });
            const match = existing.find((issue) => !issue.pull_request && issue.title === title);
            if (match) await github.rest.issues.update({ owner, repo, issue_number: match.number, body, state: 'open' });
            else await github.rest.issues.create({ owner, repo, title, body });

      - name: Close transport trigger with proof
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '✅ Exact PDF attachment retrieved, SHA/byte/page verified, promoted to governed revision-scoped media, privately bridge-hosted, pinned to an immutable Git commit and locked into the LinkedIn queue.',
                '',
                `Queue item: **${{ steps.intake.outputs.post_id }}@${{ steps.intake.outputs.revision }}**`,
                `Immutable media commit: \`${{ steps.pin.outputs.media_ref }}\``,
                'Owner publication approval remains a separate gate.',
              ].join('\n'),
            });
            await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed' });
