name: LinkedIn Buffer Migration Apply

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: linkedin-buffer-migration-apply
  cancel-in-progress: false

jobs:
  apply:
    if: startsWith(github.event.issue.title, '[APPROVED BUFFER MIGRATION]') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check restart-safe migration executor
        run: node --check scripts/linkedin-buffer-migration-apply.cjs

      - name: Apply exact owner-approved migration
        uses: actions/github-script@v7
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_LINKEDIN_PERSONAL_CHANNEL_ID: ${{ secrets.BUFFER_LINKEDIN_PERSONAL_CHANNEL_ID }}
          BUFFER_LINKEDIN_BUSINESS_CHANNEL_ID: ${{ secrets.BUFFER_LINKEDIN_BUSINESS_CHANNEL_ID }}
          BUFFER_LINKEDIN_SECONDARY_CHANNEL_ID: ${{ secrets.BUFFER_LINKEDIN_SECONDARY_CHANNEL_ID }}
        with:
          script: |
            const { run } = require('./scripts/linkedin-buffer-migration-apply.cjs');
            await run({ github, context, core });
