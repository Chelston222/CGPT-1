name: 222Emails Revenue Path Production

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NETLIFY_SITE_ID: fc7ccb38-7e6d-4a15-83bc-88bd84ea5687

jobs:
  build-preview-production:
    runs-on: ubuntu-24.04
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Verify deployment credential
        run: test -n "$NETLIFY_AUTH_TOKEN" || { echo 'NETLIFY_AUTH_TOKEN is missing'; exit 2; }

      - name: Install and build canonical source
        working-directory: apps/222emails-omega-max
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build
          test -f dist/index.html
          test -f dist/privacy/index.html
          test -f dist/terms/index.html
          test -f dist/cookies/index.html
          test -f dist/accessibility/index.html
          test -f dist/_headers
          test -f dist/_redirects
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/llms.txt
          test -f dist/authority.css
          test -f dist/client-return-systems/index.html
          test -f dist/retention-marketing-lancashire/index.html
          test -f dist/client-retention-salons-barbers-lancashire/index.html
          test -f dist/client-reactivation-aesthetics-lancashire/index.html
          test -f dist/patient-reactivation-dental-lancashire/index.html
          test -f dist/client-return-opportunity-calculator/index.html
          test -f dist/about-222emails/index.html
          test -f dist/14-day-reactivation-pilot/index.html
          test -f dist/customer-retention-blackburn/index.html
          test -f dist/e7a3c5b8d1f94a6c2e0b7d5f8a4c1e9b.txt

      - name: Run canonical content gates
        working-directory: apps/222emails-omega-max
        run: |
          set -euo pipefail
          grep -R -q 'Bring more clients back before you spend more on finding new ones' dist/assets
          grep -R -q '14-Day Reactivation Pilot' dist/assets
          grep -R -q 'Client Return System' dist/assets
          grep -R -q 'Existing tools first' dist/assets
          grep -R -q 'No card. No automatic charge.' dist/assets
          grep -q 'Great Harwood' dist/index.html
          grep -q 'OAI-SearchBot' dist/robots.txt
          grep -q 'Retention Marketing Lancashire' dist/retention-marketing-lancashire/index.html
          grep -q 'Illustrative rate, not a benchmark' dist/client-return-opportunity-calculator/index.html
          ! grep -R -q 'RecoveryDashboard' dist/assets
          ! grep -R -q 'Start your free Fit Check' dist/assets
          ! grep -R -q '61/100' dist/assets
          ! grep -R -q 'client-return-fit-check' dist/index.html
          ! grep -R -q 'Human-reviewed' src index.html public
          ! grep -R -q 'Retention Lab' src index.html public
          grep -R -q 'utm_source' src/main.tsx
          grep -R -q 'sessionStorage' src/main.tsx
          grep -q '/fit-check /14-day-reactivation-pilot/ 301' dist/_redirects
          grep -q '/revenue-recovery-check /14-day-reactivation-pilot/ 301' dist/_redirects
          grep -q 'https://222emails.com/customer-retention-blackburn/' dist/sitemap.xml
          grep -q 'https://222emails.com/14-day-reactivation-pilot/' dist/sitemap.xml
          ! grep -R -q 'Client Return Growth Check' src index.html public
          ! grep -R -q '7-Day Client Return System Sprint' src index.html public
          ! grep -R -q '£997' src index.html public
          ! grep -R -q '£595/mo' src index.html public
          ! grep -R -q 'tally.so/r/44057b' src index.html public
          ! grep -R -q 'Free Revenue Recovery Check' src index.html public
          ! grep -R -q 'Free Recovery Check' src index.html public
          ! grep -R -q 'href="/revenue-recovery-check"' src index.html public

      - name: Install Netlify CLI
        run: npm install -g netlify-cli@latest

      - name: Create isolated draft deploy
        working-directory: apps/222emails-omega-max
        run: |
          set -euo pipefail
          netlify deploy --dir=dist --no-build --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --message="222Emails competitive authority candidate" --json > /tmp/draft.json
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/draft.json','utf8'));
          const url=j.deploy_url||j.deployUrl||j.url;
          if(!url) process.exit(1);
          fs.appendFileSync(process.env.GITHUB_ENV,`DRAFT_URL=${url}\n`);
          console.log(`Draft deploy: ${url}`);
          NODE

      - name: Smoke test isolated draft
        run: |
          set -euo pipefail
          for path in / /14-day-reactivation-pilot/ /customer-retention-blackburn/ /client-return-systems/ /retention-marketing-lancashire/ /client-retention-salons-barbers-lancashire/ /client-reactivation-aesthetics-lancashire/ /patient-reactivation-dental-lancashire/ /client-return-opportunity-calculator/ /about-222emails/ /privacy/ /terms/ /cookies/ /accessibility/ /robots.txt /sitemap.xml /llms.txt /e7a3c5b8d1f94a6c2e0b7d5f8a4c1e9b.txt; do
            code=$(curl -L --retry 4 --retry-delay 2 -sS -o /tmp/page -w '%{http_code}' "${DRAFT_URL}${path}")
            test "$code" = "200" || { echo "Draft ${path} returned ${code}"; exit 1; }
          done
          code=$(curl -L --retry 4 --retry-delay 2 -sS -o /tmp/legacy -w '%{http_code}' "${DRAFT_URL}/fit-check")
          test "$code" = "200" || { echo "Legacy redirect failed: $code"; exit 1; }
          curl -fsSL --retry 4 "$DRAFT_URL/" | grep -q 'Client Return Systems for appointment-led businesses'
          curl -fsSL --retry 4 "$DRAFT_URL/14-day-reactivation-pilot/" | grep -q '14-Day Reactivation Pilot'
          curl -fsSL --retry 4 "$DRAFT_URL/customer-retention-blackburn/" | grep -q 'Customer retention for Blackburn appointment-led businesses'
          curl -fsSL --retry 4 "$DRAFT_URL/retention-marketing-lancashire/" | grep -q 'Retention marketing built around getting appointment-led clients to come back'
          curl -fsSL --retry 4 "$DRAFT_URL/client-return-opportunity-calculator/" | grep -q 'Illustrative rate, not a benchmark'
          curl -fsSL --retry 4 "$DRAFT_URL/privacy/" | grep -q 'How 222Emails collects and uses personal data'

      - name: Publish verified build to production
        working-directory: apps/222emails-omega-max
        run: |
          set -euo pipefail
          netlify deploy --dir=dist --no-build --prod --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --message="222Emails competitive authority production" --json > /tmp/prod.json
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/prod.json','utf8'));
          const url=j.url||j.deploy_url||j.deployUrl;
          if(!url) process.exit(1);
          fs.appendFileSync(process.env.GITHUB_ENV,`PROD_URL=${url}\n`);
          console.log(`Production URL: ${url}`);
          NODE

      - name: Production smoke tests
        run: |
          set -euo pipefail
          for path in / /14-day-reactivation-pilot/ /customer-retention-blackburn/ /client-return-systems/ /retention-marketing-lancashire/ /client-retention-salons-barbers-lancashire/ /client-reactivation-aesthetics-lancashire/ /patient-reactivation-dental-lancashire/ /client-return-opportunity-calculator/ /about-222emails/ /privacy/ /terms/ /cookies/ /accessibility/; do
            code=$(curl -L --retry 6 --retry-delay 2 -sS -o /tmp/page -w '%{http_code}' "${PROD_URL}${path}")
            test "$code" = "200" || { echo "Production ${path} returned ${code}"; exit 1; }
          done
          curl -fsSL --retry 6 "$PROD_URL/" | grep -q 'Client Return Systems for appointment-led businesses'
          curl -fsSL --retry 6 "$PROD_URL/14-day-reactivation-pilot/" | grep -q '14-Day Reactivation Pilot'
          curl -fsSL --retry 6 "$PROD_URL/customer-retention-blackburn/" | grep -q 'Customer retention for Blackburn appointment-led businesses'
          curl -fsSL --retry 6 "$PROD_URL/retention-marketing-lancashire/" | grep -q 'Retention marketing built around getting appointment-led clients to come back'
          curl -fsSL --retry 6 "$PROD_URL/client-return-opportunity-calculator/" | grep -q 'Illustrative rate, not a benchmark'
          oai_code=$(curl -L --retry 6 --retry-delay 2 -A 'Mozilla/5.0 (compatible; OAI-SearchBot/1.4; +https://openai.com/searchbot)' -sS -o /tmp/oai-page -w '%{http_code}' "$PROD_URL/")
          test "$oai_code" = "200" || { echo "OAI-SearchBot-style request returned $oai_code"; exit 1; }

      - name: Notify IndexNow of changed authority URLs
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data '{
              "host": "222emails.com",
              "key": "e7a3c5b8d1f94a6c2e0b7d5f8a4c1e9b",
              "keyLocation": "https://222emails.com/e7a3c5b8d1f94a6c2e0b7d5f8a4c1e9b.txt",
              "urlList": [
                "https://222emails.com/",
                "https://222emails.com/14-day-reactivation-pilot/",
                "https://222emails.com/customer-retention-blackburn/",
                "https://222emails.com/client-return-systems/",
                "https://222emails.com/retention-marketing-lancashire/",
                "https://222emails.com/about-222emails/"
              ]
            }'

      - name: Release summary
        run: |
          echo "222Emails competitive authority build passed release gates."
          echo "Draft: ${DRAFT_URL}"
          echo "Production: ${PROD_URL}"
