name: Retired in-repo LinkedIn media staging

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  retired:
    if: startsWith(github.event.issue.title, '[STAGE LINKEDIN MEDIA]') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Stop legacy in-repo media staging
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '⛔ In-repo public media staging is retired.',
                '',
                'The operations repository is private-source only.',
                'Exact approved media must be promoted to the dedicated provider-media surface before Buffer approval.',
                'Do not recreate raw public URLs from the operations repository.'
              ].join('\n')
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'not_planned'
            });
