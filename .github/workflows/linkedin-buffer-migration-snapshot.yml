name: LinkedIn Buffer Migration Snapshot

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: linkedin-buffer-migration-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.event_name != 'issues' || (startsWith(github.event.issue.title, '[BUFFER QUEUE SNAPSHOT]') && github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Snapshot and reconcile current LinkedIn Buffer queue
        uses: actions/github-script@v7
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_LINKEDIN_PERSONAL_CHANNEL_ID: ${{ secrets.BUFFER_LINKEDIN_PERSONAL_CHANNEL_ID }}
          BUFFER_LINKEDIN_BUSINESS_CHANNEL_ID: ${{ secrets.BUFFER_LINKEDIN_BUSINESS_CHANNEL_ID }}
          BUFFER_LINKEDIN_SECONDARY_CHANNEL_ID: ${{ secrets.BUFFER_LINKEDIN_SECONDARY_CHANNEL_ID }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const queue = JSON.parse(fs.readFileSync(path.join(process.env.GITHUB_WORKSPACE, 'apps/linkedin-review/queue.json'), 'utf8'));
            const policy = JSON.parse(fs.readFileSync(path.join(process.env.GITHUB_WORKSPACE, 'apps/linkedin-review/distribution-policy.json'), 'utf8'));

            async function buffer(query) {
              const response = await fetch('https://api.buffer.com', {
                method: 'POST',
                headers: { 'content-type': 'application/json', authorization: `Bearer ${process.env.BUFFER_API_KEY}` },
                body: JSON.stringify({ query }),
              });
              const payload = await response.json().catch(() => ({}));
              const messages = (payload.errors || []).map((error) => error.message).filter(Boolean);
              if (!response.ok || messages.length) throw new Error(messages.join('; ') || `Buffer HTTP ${response.status}`);
              return payload.data;
            }

            function localDate(value, timeZone = 'Europe/London') {
              const date = new Date(value);
              if (Number.isNaN(date.getTime())) return '';
              return new Intl.DateTimeFormat('en-CA', { timeZone, year: 'numeric', month: '2-digit', day: '2-digit' }).format(date);
            }

            function isoWeek(local) {
              const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(local || '');
              if (!match) return '';
              const date = new Date(Date.UTC(Number(match[1]), Number(match[2]) - 1, Number(match[3])));
              const day = date.getUTCDay() || 7;
              date.setUTCDate(date.getUTCDate() + 4 - day);
              const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
              const week = Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
              return `${date.getUTCFullYear()}-W${String(week).padStart(2, '0')}`;
            }

            if (!process.env.BUFFER_API_KEY) throw new Error('BUFFER_API_KEY is not configured.');
            const channelIds = {
              personal: process.env.BUFFER_LINKEDIN_PERSONAL_CHANNEL_ID,
              main: process.env.BUFFER_LINKEDIN_BUSINESS_CHANNEL_ID,
              secondary: process.env.BUFFER_LINKEDIN_SECONDARY_CHANNEL_ID,
            };
            if (Object.values(channelIds).some((id) => !id)) throw new Error('One or more LinkedIn Buffer channel IDs are missing.');
            const targetByChannel = Object.fromEntries(Object.entries(channelIds).map(([target, id]) => [id, target]));

            const account = await buffer('query MigrationAccount { account { organizations { id } } }');
            const organizationId = account.account?.organizations?.[0]?.id;
            if (!organizationId) throw new Error('Buffer returned no organisation ID.');
            const scheduled = await buffer(`query MigrationScheduled { posts(first: 100, input: { organizationId: ${JSON.stringify(organizationId)}, filter: { status: [scheduled], channelIds: ${JSON.stringify(Object.values(channelIds))} } }) { edges { node { id channelId dueAt status } } pageInfo { hasNextPage } } }`);
            if (scheduled.posts?.pageInfo?.hasNextPage) throw new Error('Buffer returned more than 100 scheduled LinkedIn posts; snapshot would be incomplete.');
            const live = (scheduled.posts?.edges || []).map((edge) => edge.node);

            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'all', creator: owner, per_page: 100 });
            const approvals = issues.filter((issue) => !issue.pull_request && /\[(?:APPROVED|FAILED) LINKEDIN(?: WEEK)?\]/.test(issue.title));
            const ledger = new Map();
            const rowPattern = /^-\s+([^@\n:]+)@([^\s·]+)\s+·\s+([^:]+):\s+Buffer post ID\s+`([^`]+)`(?:\s+—\s+([^\s\n]+))?/gm;
            for (const issue of approvals) {
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: issue.number, per_page: 100 });
              for (const comment of comments) {
                let match;
                while ((match = rowPattern.exec(String(comment.body || '')))) {
                  ledger.set(match[4], { queueId: match[1].trim(), revision: String(match[2]).trim(), channelName: match[3].trim(), dueAt: match[5] || null, issue: issue.number });
                }
                rowPattern.lastIndex = 0;
              }
            }

            const queueByKey = new Map((queue.posts || []).map((post) => [`${post.id}@${post.revision}`, post]));
            const rows = live.map((post) => {
              const target = targetByChannel[post.channelId] || 'UNKNOWN';
              const match = ledger.get(post.id) || null;
              const queuePost = match ? queueByKey.get(`${match.queueId}@${match.revision}`) || null : null;
              const date = localDate(post.dueAt, policy.timezone || 'Europe/London');
              return {
                bufferId: post.id,
                target,
                dueAt: post.dueAt,
                date,
                week: isoWeek(date),
                queueId: match?.queueId || null,
                revision: match?.revision || null,
                approvalIssue: match?.issue || null,
                title: queuePost?.title || null,
                category: queuePost?.category || null,
                sourceType: queuePost?.sourceType || null,
                funnelStage: queuePost?.funnelStage || null,
                mapped: Boolean(match && queuePost),
              };
            }).sort((a, b) => String(a.dueAt).localeCompare(String(b.dueAt)) || a.target.localeCompare(b.target));

            const daily = new Map();
            const weekly = new Map();
            for (const row of rows) {
              const d = `${row.date}:${row.target}`;
              const w = `${row.week}:${row.target}`;
              daily.set(d, (daily.get(d) || 0) + 1);
              weekly.set(w, (weekly.get(w) || 0) + 1);
            }
            const maxFor = (target, period) => {
              const account = policy.accounts?.[target];
              if (!account) return null;
              return period === 'day' ? account.maximumPerDay : account.maximumPerWeek;
            };
            const cadenceFailures = [];
            for (const [key, count] of daily) {
              const target = key.split(':').at(-1);
              const max = maxFor(target, 'day');
              if (Number.isFinite(max) && count > max) cadenceFailures.push(`${key} = ${count} > ${max}/day`);
            }
            for (const [key, count] of weekly) {
              const target = key.split(':').at(-1);
              const max = maxFor(target, 'week');
              if (Number.isFinite(max) && count > max) cadenceFailures.push(`${key} = ${count} > ${max}/week`);
            }

            const unmapped = rows.filter((row) => !row.mapped);
            const counts = Object.fromEntries(['personal', 'main', 'secondary'].map((target) => [target, rows.filter((row) => row.target === target).length]));
            const table = rows.map((row) => `| ${row.target} | ${row.dueAt || ''} | ${row.queueId ? `${row.queueId}@${row.revision}` : 'UNMAPPED'} | ${String(row.title || '').replace(/\|/g, '\\|') || 'UNKNOWN'} | #${row.approvalIssue || '-'} |`).join('\n');
            const body = [
              '# Buffer migration snapshot', '',
              '**READ-ONLY. No Buffer post, schedule or channel was changed.**', '',
              `- Captured at: **${new Date().toISOString()}**`,
              `- Current scheduled placements: **${rows.length}**`,
              `- Personal: **${counts.personal || 0}**`,
              `- 222Emails company: **${counts.main || 0}**`,
              `- Retention School technical target secondary: **${counts.secondary || 0}**`,
              `- Approval/queue mapping: **${rows.length - unmapped.length}/${rows.length}**`,
              `- Cadence contract: **${cadenceFailures.length ? 'FAIL' : 'PASS'}**`,
              ...(cadenceFailures.length ? cadenceFailures.map((x) => `  - ${x}`) : []), '',
              '| Target | Due | Queue record | Title | Approval |',
              '|---|---|---|---|---|',
              table || '| - | - | - | - | - |', '',
              ...(unmapped.length ? ['## Blocker', `${unmapped.length} live Buffer placement(s) could not be mapped back to a locked queue revision. Do not reflow or delete them until reconciled.`] : ['Every live Buffer placement maps back to a locked queue revision and approval issue.']), '',
              'Next migration step: classify every mapped live placement KEEP / MOVE / REPURPOSE / RETIRE against the v1.12 account-role policy before any recurring-schedule edit.',
            ].join('\n');

            if (context.eventName === 'issues') {
              await github.rest.issues.createComment({ owner, repo, issue_number: context.issue.number, body });
              await github.rest.issues.update({ owner, repo, issue_number: context.issue.number, state: 'closed', state_reason: 'completed' });
            }
            core.summary.addHeading('Buffer migration snapshot').addRaw(body).write();
            if (unmapped.length || cadenceFailures.length) core.setFailed('Snapshot found an unmapped placement or live cadence violation. See the issue comment.');
