name: 222Emails Netlify Secret Check

on:
  push:
    paths:
      - '.github/workflows/222emails-netlify-secret-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN_A: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_AUTH_TOKEN_B: ${{ secrets.NETLIFY_PERSONAL_ACCESS_TOKEN }}
    steps:
      - name: Check Netlify secret availability without exposing values
        shell: bash
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN_A" ]; then
            echo "NETLIFY_SECRET_STATUS=NETLIFY_AUTH_TOKEN_AVAILABLE"
          elif [ -n "$NETLIFY_AUTH_TOKEN_B" ]; then
            echo "NETLIFY_SECRET_STATUS=NETLIFY_PERSONAL_ACCESS_TOKEN_AVAILABLE"
          else
            echo "NETLIFY_SECRET_STATUS=NONE_AVAILABLE"
            exit 2
          fi
