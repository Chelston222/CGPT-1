name: Facebook Groups Daily Acquisition Packet

on:
  schedule:
    - cron: '15 7 * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: facebook-groups-daily-acquisition-packet
  cancel-in-progress: false

jobs:
  packet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create today's rule-aware acquisition packet
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');

            const configPath = path.join(process.env.GITHUB_WORKSPACE, 'apps/facebook-groups-acquisition/targets.json');
            const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const now = new Date();
            const start = Date.parse('2026-08-12T00:00:00+01:00');
            const end = Date.parse('2026-09-10T23:59:59+01:00');
            if (now.getTime() < start || now.getTime() > end) {
              core.info('Outside the 30-day launch window. No packet created.');
              return;
            }

            const dayIndex = Math.floor((now.getTime() - start) / 86400000) + 1;
            const date = new Intl.DateTimeFormat('en-GB', {
              timeZone: config.timezone,
              year: 'numeric', month: '2-digit', day: '2-digit'
            }).format(now);

            const archetypes = [
              {
                id: 'P1', name: 'Revenue Leak Diagnostic', cta: 'AUDIT',
                segments: ['general-uk', 'north-west', 'lancashire'],
                modes: ['direct-promo', 'authority-first']
              },
              {
                id: 'P2', name: 'Ecommerce Store Diagnostic', cta: 'STORE',
                segments: ['ecommerce'],
                modes: ['direct-promo', 'authority-first']
              },
              {
                id: 'P3', name: 'Local Lancashire Founder', cta: 'LOCAL',
                segments: ['lancashire', 'north-west'],
                modes: ['direct-promo', 'authority-first']
              },
              {
                id: 'P4', name: 'Public Mini Audit', cta: 'AUDIT',
                segments: ['general-uk', 'ecommerce', 'salon', 'fitness'],
                modes: ['authority-first']
              },
              {
                id: 'P5', name: 'Retention and Reactivation', cta: 'AUDIT',
                segments: ['general-uk', 'ecommerce', 'salon', 'fitness'],
                modes: ['direct-promo', 'authority-first']
              }
            ];
            const archetype = archetypes[(dayIndex - 1) % archetypes.length];

            const tierWeight = { 'A+': 5, 'A': 4, 'B+': 3, 'B': 2, 'WATCH': 0 };
            const compatible = config.groups
              .filter(g => g.mode !== 'listen-only')
              .filter(g => archetype.segments.includes(g.segment))
              .filter(g => archetype.modes.includes(g.mode))
              .sort((a, b) => (tierWeight[b.tier] || 0) - (tierWeight[a.tier] || 0) || a.id.localeCompare(b.id));

            if (!compatible.length) {
              core.setFailed(`No compatible groups configured for ${archetype.id}: ${archetype.name}`);
              return;
            }

            const cycle = Math.floor((dayIndex - 1) / archetypes.length);
            const offset = (cycle * 3) % compatible.length;
            const selected = [];
            for (let n = 0; n < compatible.length && selected.length < 3; n++) {
              const g = compatible[(offset + n) % compatible.length];
              if (!selected.some(x => x.id === g.id)) selected.push(g);
            }

            function ctaFor(group) {
              if (archetype.id === 'P2') return 'STORE';
              if (archetype.id === 'P3') return 'LOCAL';
              if (group.segment === 'ecommerce') return 'STORE';
              if (group.segment === 'salon') return 'SALON';
              if (group.segment === 'fitness') return 'GYM';
              return archetype.cta;
            }

            const title = `[FB GROUPS DAY ${String(dayIndex).padStart(2,'0')}] ${date} · ${archetype.name}`;
            const existing = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'all', per_page: 100 });
            if (existing.some(i => i.title === title)) {
              core.info('Daily packet already exists.');
              return;
            }

            const groupLines = selected.map((g, i) => [
              `### ${i + 1}. ${g.name}`,
              `- Tier: **${g.tier}**`,
              `- Segment: **${g.segment}**`,
              `- Mode: **${g.mode}**`,
              `- Rule status: ${g.ruleStatus}`,
              `- CTA keyword: **${ctaFor(g)}**`,
              `- Cooling period: **${g.coolingHours || config.rules.defaultCoolingHoursPerGroup} hours**`,
              `- [ ] Open the group and check today's live rules before posting`,
              `- [ ] Confirm this group has not been posted to inside its cooling period`,
              `- [ ] Use the ${archetype.id} copy in \`apps/facebook-groups-acquisition/POSTS.md\` and apply the segment adaptation where stated`,
              `- [ ] Adapt the opening line to the group rather than copying blindly`,
              `- [ ] Post manually in Facebook`,
              `- [ ] Paste the Facebook post URL into a comment on this issue`,
              `- [ ] Record meaningful replies and every audit request`
            ].join('\n')).join('\n\n');

            const reviewDue = dayIndex % 7 === 0 || dayIndex === 30;
            const reviewBlock = reviewDue ? [
              '',
              '## Omega weekly review due today',
              '- [ ] Count compliant posts from the last 7 days',
              '- [ ] Count meaningful owner conversations',
              '- [ ] Count audit requests and qualified audits',
              '- [ ] Count implementation offers and revenue won',
              '- [ ] Mark each active group SCALE, WATCH, RETIRE or PAUSE using PLAYBOOK.md',
              '- [ ] Give next week\'s slots first to groups and archetypes producing qualified audits or revenue',
              '- [ ] Do not increase posting volume to compensate for weak relevance'
            ] : [];

            const body = [
              '# 222 Emails Facebook Groups Acquisition Packet',
              '',
              `**Day ${dayIndex}/30 · ${date} · Europe/London**`,
              '',
              '## Today’s objective',
              `Run **${archetype.id}: ${archetype.name}** across up to three compatible groups. Exact copy is stored in \`apps/facebook-groups-acquisition/POSTS.md\`.`,
              '',
              '## Hard gate',
              '- Do not use browser bots or auto-posting scripts.',
              '- Do not post if the current group rules prohibit promotion or the chosen format.',
              '- Do not publish identical copy back-to-back across groups.',
              '- Respect the configured cooling period for each group.',
              '- The final Facebook submission must be human.',
              '',
              '## Targets',
              groupLines,
              '',
              '## Engagement sprint after posting',
              '- [ ] Spend 10-15 minutes responding to genuine comments',
              '- [ ] Give useful public answers before moving anybody to DM',
              '- [ ] DM only people who explicitly engage/request help or where a legitimate prospecting basis exists',
              '- [ ] Log every requested audit in the current 222 Emails audit tracker and, if needed, `apps/facebook-groups-acquisition/lead-tracker.csv`',
              '',
              '## Comment reply for CTA responses',
              '> Thanks [Name]. Send me your website/store URL by DM and I’ll take a look. I’ll focus on the highest-impact customer-journey leak I can identify first, then tell you what I would prioritise.',
              '',
              '## First DM after an explicit request',
              '> Hey [Name], thanks for commenting on the post. Send me the website/store URL you want me to review. If there is a particular issue you already suspect, tell me that too. I’ll start with the highest-impact leak I can identify.',
              '',
              '## Daily scorecard',
              '- Posts successfully published: /3',
              '- Meaningful owner conversations:',
              '- CTA comments:',
              '- DMs started:',
              '- URLs received:',
              '- Qualified audits created:',
              '- Implementation conversations:',
              '- Revenue won (£):',
              '- Posts removed/rejected:',
              '- Rule changes discovered:',
              ...reviewBlock,
              '',
              '## Close-out',
              '- [ ] Update lead tracker / existing audit record',
              '- [ ] Comment the scorecard on this issue',
              '- [ ] Close this issue when all follow-up actions are captured',
              '',
              'Operating rules, qualification, KPIs and scale/watch/retire logic: `apps/facebook-groups-acquisition/PLAYBOOK.md`.'
            ].join('\n');

            await github.rest.issues.create({ owner, repo, title, body });
