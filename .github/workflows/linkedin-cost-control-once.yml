name: LinkedIn Page Identity Check

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read

jobs:
  inspect:
    if: startsWith(github.event.issue.title, '[LINKEDIN PAGE IDENTITY]') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Read safe LinkedIn Page identity from Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          CHANNEL_ID: ${{ secrets.BUFFER_LINKEDIN_BUSINESS_CHANNEL_ID }}
        run: |
          node <<'NODE'
          const query = `query TTEPage { channel(input: { id: ${JSON.stringify(process.env.CHANNEL_ID)} }) { service serviceId type name displayName externalLink descriptor } }`;
          const response = await fetch('https://api.buffer.com', {
            method: 'POST',
            headers: { 'content-type': 'application/json', authorization: `Bearer ${process.env.BUFFER_API_KEY}` },
            body: JSON.stringify({ query }),
          });
          const payload = await response.json();
          if (!response.ok || payload.errors?.length || !payload.data?.channel) process.exit(1);
          console.log('SAFE_LINKEDIN_PAGE_IDENTITY=' + JSON.stringify(payload.data.channel));
          NODE
