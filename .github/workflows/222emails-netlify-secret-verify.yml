name: Verify Netlify production secret

on:
  push:
    paths:
      - '.github/workflows/222emails-netlify-secret-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - name: Verify token exists without printing it
        shell: bash
        run: |
          test -n "$NETLIFY_AUTH_TOKEN" || { echo 'NETLIFY_AUTH_TOKEN missing'; exit 2; }
          echo 'NETLIFY_AUTH_TOKEN_PRESENT=true'
