name: TTE Klaviyo Capability Discovery

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/tte-klaviyo/capability_discovery.py'
      - '.github/workflows/tte-klaviyo-capability-discovery.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Probe read-only Klaviyo capabilities
        env:
          KLAVIYO_PRIVATE_API_KEY: ${{ secrets.KLAVIYO_PRIVATE_API_KEY }}
        run: python apps/tte-klaviyo/capability_discovery.py
