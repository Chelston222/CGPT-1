name: TTE Klaviyo Go Live

on:
  workflow_dispatch:
    inputs:
      visual_qa:
        description: 'Desktop, mobile and dark-mode visual QA complete'
        required: true
        type: choice
        options: [BLOCK, PASS]
        default: BLOCK
      seed_qa:
        description: 'Seed inbox, links and replies verified'
        required: true
        type: choice
        options: [BLOCK, PASS]
        default: BLOCK
      domain_qa:
        description: 'SPF, DKIM and DMARC state/alignment verified'
        required: true
        type: choice
        options: [BLOCK, PASS]
        default: BLOCK
      diagnostic_qa:
        description: 'Free Revenue Recovery Check works end to end and attribution is verified'
        required: true
        type: choice
        options: [BLOCK, PASS]
        default: BLOCK
      capture_qa:
        description: 'Public double-opt-in capture path feeds Email List SjerhA'
        required: true
        type: choice
        options: [BLOCK, PASS]
        default: BLOCK
      exit_qa:
        description: 'Qualified-opportunity/client exit or suppression logic is verified'
        required: true
        type: choice
        options: [BLOCK, PASS]
        default: BLOCK
      one_click_qa:
        description: 'Provider-compatible one-click unsubscribe is verified where applicable'
        required: true
        type: choice
        options: [BLOCK, PASS]
        default: BLOCK
      monitoring_qa:
        description: 'Complaint and bounce monitoring is verified'
        required: true
        type: choice
        options: [BLOCK, PASS]
        default: BLOCK
      activation_confirmation:
        description: 'Type exactly GO-LIVE-VbBAhU'
        required: true
        type: string

permissions:
  contents: read

jobs:
  activate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Re-run current live-account verification
        env:
          KLAVIYO_PRIVATE_API_KEY: ${{ secrets.KLAVIYO_PRIVATE_API_KEY }}
          TTE_APEX_V2_FLOW_ID: VbBAhU
        run: python apps/tte-klaviyo/verify_apex_v2_flow.py
      - name: Re-run launch-readiness gate immediately before activation
        env:
          KLAVIYO_PRIVATE_API_KEY: ${{ secrets.KLAVIYO_PRIVATE_API_KEY }}
          TTE_FLAGSHIP_FLOW_ID: VbBAhU
        run: python apps/tte-klaviyo/launch_readiness.py
      - name: Activate only when every external gate passes
        env:
          KLAVIYO_PRIVATE_API_KEY: ${{ secrets.KLAVIYO_PRIVATE_API_KEY }}
          VISUAL_QA: ${{ inputs.visual_qa }}
          SEED_QA: ${{ inputs.seed_qa }}
          DOMAIN_QA: ${{ inputs.domain_qa }}
          DIAGNOSTIC_QA: ${{ inputs.diagnostic_qa }}
          CAPTURE_QA: ${{ inputs.capture_qa }}
          EXIT_QA: ${{ inputs.exit_qa }}
          ONE_CLICK_QA: ${{ inputs.one_click_qa }}
          MONITORING_QA: ${{ inputs.monitoring_qa }}
          ACTIVATION_CONFIRMATION: ${{ inputs.activation_confirmation }}
        run: python apps/tte-klaviyo/activate_flagship_flow.py
