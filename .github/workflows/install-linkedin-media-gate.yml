name: Install permanent LinkedIn media QA gate

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  install:
    if: startsWith(github.event.issue.title, '[RUN LINKEDIN MEDIA HARDENING]') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire media QA into Buffer dispatch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/linkedin-buffer-autopost.yml')
          text = path.read_text()

          import_anchor = "            const { assertLiveNotionQualityGate } = require(path.join(process.env.GITHUB_WORKSPACE, 'scripts/linkedin-notion-quality-gate.cjs'));"
          quality_import = "            const { assertHostedImageQuality } = require(path.join(process.env.GITHUB_WORKSPACE, 'scripts/linkedin-media-quality.cjs'));"
          if quality_import not in text:
              if import_anchor not in text:
                  raise SystemExit('Could not locate Buffer workflow import anchor.')
              text = text.replace(import_anchor, import_anchor + '\n' + quality_import, 1)

          loop_anchor = "                for (const { job, channel, key } of plan.dispatch) {\n                  if (channel.dueAt && new Date(channel.dueAt).getTime() <= Date.now() + 5 * 60_000) {"
          loop_replacement = "                for (const { job, channel, key } of plan.dispatch) {\n                  if (job.request.mediaUrl && job.request.mediaKind === 'image') {\n                    await assertHostedImageQuality(job.request.mediaUrl, fetch);\n                  }\n                  if (channel.dueAt && new Date(channel.dueAt).getTime() <= Date.now() + 5 * 60_000) {"
          if "await assertHostedImageQuality(job.request.mediaUrl, fetch);" not in text:
              if loop_anchor not in text:
                  raise SystemExit('Could not locate Buffer dispatch loop anchor.')
              text = text.replace(loop_anchor, loop_replacement, 1)

          path.write_text(text)
          PY

      - name: Regression-test quality rules
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const { assertStableMediaUrl, requiredMinimum } = require('./scripts/linkedin-media-quality.cjs');
          assert.throws(() => assertStableMediaUrl('https://media.canva.com/v2/image-resize/height:200/width:160?x-canva-quality=thumbnail'));
          assert.throws(() => assertStableMediaUrl('https://drive.google.com/file/d/example/view'));
          assert.deepEqual(requiredMinimum(1080, 1350), { shape: 'portrait', width: 1080, height: 1350 });
          assert.deepEqual(requiredMinimum(1200, 627), { shape: 'landscape', width: 1200, height: 627 });
          assert.deepEqual(requiredMinimum(1080, 1080), { shape: 'square', width: 1080, height: 1080 });
          console.log('LinkedIn media QA regression checks passed.');
          NODE
          grep -q "assertHostedImageQuality" .github/workflows/linkedin-buffer-autopost.yml

      - name: Commit hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/linkedin-buffer-autopost.yml scripts/linkedin-media-quality.cjs
          if git diff --cached --quiet; then
            echo 'Permanent media QA already installed.'
          else
            git commit -m 'Enforce LinkedIn media resolution before Buffer dispatch'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Record completion
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '✅ Permanent LinkedIn media QA gate installed.',
                '',
                '- Canva preview and Google Drive share URLs are rejected.',
                '- Expiring AWS/Google signed image URLs are rejected.',
                '- Direct image bytes are fetched before Buffer dispatch.',
                '- Portrait media must be at least **1080×1350**.',
                '- Square media must be at least **1080×1080**.',
                '- Landscape media must be at least **1200×627**.',
                '- Buffer mutation happens only after media QA passes.',
              ].join('\n'),
            });
            await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed' });
