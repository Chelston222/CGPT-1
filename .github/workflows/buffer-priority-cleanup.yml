name: Buffer Priority Cleanup

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  cleanup:
    if: startsWith(github.event.issue.title, '[BUFFER CLEANUP]') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Delete explicitly listed Buffer posts
        uses: actions/github-script@v7
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue = context.payload.issue;
            const line = String(issue.body || '').match(/^DELETE_POST_IDS:\s*(.+)$/im)?.[1] || '';
            const ids = line.split(',').map((id) => id.trim()).filter(Boolean);
            if (!ids.length || ids.length > 30) throw new Error('DELETE_POST_IDS must contain 1 to 30 explicit Buffer post IDs.');
            if (new Set(ids).size !== ids.length) throw new Error('Duplicate Buffer post ID in cleanup request.');
            const deleted = [];
            for (const id of ids) {
              if (!/^[a-f0-9]{24}$/i.test(id)) throw new Error(`Invalid Buffer post ID: ${id}`);
              const query = `mutation DeleteScheduledPost { deletePost(input: { id: ${JSON.stringify(id)} }) { __typename ... on DeletePostSuccess { id } } }`;
              const response = await fetch('https://api.buffer.com', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${process.env.BUFFER_API_KEY}` },
                body: JSON.stringify({ query }),
              });
              const payload = await response.json().catch(() => ({}));
              if (!response.ok || payload.errors?.length || payload.data?.deletePost?.__typename !== 'DeletePostSuccess') {
                throw new Error(`Buffer delete failed for ${id}: ${payload.errors?.map((e) => e.message).join('; ') || payload.data?.deletePost?.__typename || `HTTP ${response.status}`}`);
              }
              deleted.push(id);
            }
            await github.rest.issues.createComment({
              owner, repo, issue_number: issue.number,
              body: `✅ Buffer priority cleanup complete.\n\nDeleted **${deleted.length}** explicitly listed scheduled posts.\n\n${deleted.map((id) => `- \`${id}\``).join('\n')}\n\nNo other Buffer posts were touched.`,
            });
            await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
