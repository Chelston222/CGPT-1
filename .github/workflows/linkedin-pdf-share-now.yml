name: RETIRED - LinkedIn PDF Share Now

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Stop retired parallel publishing route
        shell: bash
        run: |
          echo 'RETIRED: Do not publish LinkedIn PDFs through the former share-now lane.' >&2
          echo 'Use the canonical governed route: authorised Gmail -> PrivateEmail IMAP -> exact GitHub PDF intake -> Notion live quality gate -> repository-owner [APPROVED LINKEDIN] -> Buffer -> independent publication verifier.' >&2
          echo 'If an immediate post is genuinely required, create a new locked queue revision with a safe near-term schedule and use the canonical approval lane. Do not bypass its gates.' >&2
          exit 1
