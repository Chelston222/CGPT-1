name: LinkedIn Publication Backfill

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: linkedin-publication-backfill
  cancel-in-progress: false

jobs:
  reconcile:
    if: startsWith(github.event.issue.title, '[LINKEDIN VERIFY NOW]') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile historical Buffer acceptance with publication evidence
        uses: actions/github-script@v7
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            if (!process.env.BUFFER_API_KEY) throw new Error('BUFFER_API_KEY is not configured');

            async function buffer(query) {
              const response = await fetch('https://api.buffer.com', {
                method: 'POST',
                headers: {
                  'content-type': 'application/json',
                  authorization: `Bearer ${process.env.BUFFER_API_KEY}`,
                },
                body: JSON.stringify({ query }),
              });
              const payload = await response.json().catch(() => ({}));
              const messages = (payload.errors || []).map((error) => error.message).filter(Boolean);
              if (!response.ok || messages.length) throw new Error(messages.join('; ') || `Buffer HTTP ${response.status}`);
              return payload.data;
            }

            function acceptedRows(comments) {
              const rows = [];
              for (const comment of comments) {
                const body = String(comment.body || '');
                const regex = /^-\s+([^\n:]+?):\s+Buffer post ID\s+`([^`]+)`(?:\s+—\s+([^\s\n]+))?/gm;
                let match;
                while ((match = regex.exec(body))) rows.push({
                  label: match[1].trim(),
                  bufferId: match[2],
                  dueAt: match[3] || null,
                });
              }
              return rows;
            }

            function markerSet(comments, kind) {
              const out = new Set();
              const regex = new RegExp(`<!-- ${kind} bufferId=([^\\s>]+)`, 'g');
              for (const comment of comments) {
                let match;
                while ((match = regex.exec(String(comment.body || '')))) out.add(match[1]);
              }
              return out;
            }

            const account = await buffer('query BackfillAccount { account { organizations { id } } }');
            const organizationId = account?.account?.organizations?.[0]?.id;
            if (!organizationId) throw new Error('Buffer returned no organisation ID for historical reconciliation.');

            const since = new Date(Date.now() - 35 * 24 * 60 * 60 * 1000).toISOString();
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'all',
              creator: owner,
              since,
              per_page: 100,
            });
            const candidates = issues.filter((issue) => !issue.pull_request && /\[(?:APPROVED|FAILED) LINKEDIN(?: WEEK)?\]/.test(issue.title));

            const records = [];
            for (const issue of candidates) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: issue.number,
                per_page: 100,
              });
              const verified = markerSet(comments, 'LINKEDIN_PUBLICATION_VERIFIED');
              const failed = markerSet(comments, 'LINKEDIN_PUBLICATION_FAILED');
              const draftVerified = markerSet(comments, 'LINKEDIN_DRAFT_CANARY_VERIFIED');
              const analytics = markerSet(comments, 'LINKEDIN_ANALYTICS_CAPTURED');
              const native = markerSet(comments, 'LINKEDIN_NATIVE_ANALYTICS_REQUIRED');
              const isDraft = /^MODE:\s*draft\s*$/mi.test(String(issue.body || ''));
              for (const row of acceptedRows(comments)) {
                records.push({
                  issue,
                  row,
                  isDraft,
                  publicationResolved: verified.has(row.bufferId) || failed.has(row.bufferId) || draftVerified.has(row.bufferId),
                  analyticsResolved: analytics.has(row.bufferId) || native.has(row.bufferId),
                });
              }
            }

            const unresolvedIds = new Set(records.filter((record) => !record.publicationResolved).map((record) => record.row.bufferId));
            const postsById = new Map();
            let cursor = null;
            let pagesFetched = 0;
            const pageCap = 20;

            while (pagesFetched < pageCap && unresolvedIds.size) {
              const afterArg = cursor ? `after: ${JSON.stringify(cursor)}, ` : '';
              const data = await buffer(`query BackfillPosts {
                posts(first: 100, ${afterArg}input: {
                  organizationId: ${JSON.stringify(organizationId)},
                  filter: { status: [sent, error, draft, scheduled, sending, needs_approval] }
                }) {
                  edges { node { id status dueAt sentAt externalLink channelId error { message supportUrl } assets { mimeType } } }
                  pageInfo { hasNextPage endCursor }
                }
              }`);
              pagesFetched += 1;
              for (const edge of data?.posts?.edges || []) {
                const post = edge.node;
                postsById.set(post.id, post);
                unresolvedIds.delete(post.id);
              }
              if (!data?.posts?.pageInfo?.hasNextPage) break;
              cursor = data.posts.pageInfo.endCursor;
              if (!cursor) throw new Error('Buffer pagination reported another page without an endCursor.');
            }

            const now = Date.now();
            const byIssue = new Map();
            const summary = {
              accepted: records.length,
              alreadyResolved: records.filter((record) => record.publicationResolved).length,
              sent: 0,
              drafts: 0,
              errors: 0,
              pending: 0,
              future: 0,
              missing: 0,
              nativeAnalytics: 0,
            };

            function addOutcome(issueNumber, lines) {
              if (!byIssue.has(issueNumber)) byIssue.set(issueNumber, []);
              byIssue.get(issueNumber).push(...lines);
            }

            for (const record of records) {
              if (record.publicationResolved) continue;
              const { issue, row, isDraft } = record;
              const post = postsById.get(row.bufferId);
              const due = Date.parse(row.dueAt || post?.dueAt || '');

              if (!post) {
                const isFuture = Number.isFinite(due) && due > now - 30 * 60 * 1000;
                if (isFuture) {
                  summary.future += 1;
                  continue;
                }
                summary.missing += 1;
                addOutcome(issue.number, [
                  `- ⚠️ ${row.label}: Buffer post \`${row.bufferId}\` was not found in the paginated organisation history. Publication remains unverified.`,
                  `  <!-- LINKEDIN_PUBLICATION_PENDING bufferId=${row.bufferId} -->`,
                ]);
                continue;
              }

              if (isDraft) {
                if (post.status === 'draft') {
                  summary.drafts += 1;
                  addOutcome(issue.number, [
                    `- ✅ ${row.label}: Buffer post \`${row.bufferId}\` independently verified as **draft**.`,
                    `  <!-- LINKEDIN_DRAFT_CANARY_VERIFIED bufferId=${row.bufferId} -->`,
                  ]);
                } else if (post.status === 'error') {
                  summary.errors += 1;
                  addOutcome(issue.number, [
                    `- ❌ ${row.label}: draft canary \`${row.bufferId}\` is **error**: ${post.error?.message || 'Buffer returned no error message.'}`,
                    `  <!-- LINKEDIN_PUBLICATION_FAILED bufferId=${row.bufferId} -->`,
                  ]);
                } else {
                  summary.errors += 1;
                  addOutcome(issue.number, [
                    `- ❌ ${row.label}: draft canary \`${row.bufferId}\` entered unexpected state **${post.status}**.`,
                    `  <!-- LINKEDIN_PUBLICATION_FAILED bufferId=${row.bufferId} -->`,
                  ]);
                }
                continue;
              }

              if (post.status === 'sent' && post.sentAt) {
                summary.sent += 1;
                const analyticsLines = record.analyticsResolved ? [] : [
                  '- Historical analytics fallback: route this placement to native LinkedIn analytics rather than issuing another Buffer API call during backfill.',
                  `  <!-- LINKEDIN_NATIVE_ANALYTICS_REQUIRED bufferId=${row.bufferId} -->`,
                ];
                if (!record.analyticsResolved) summary.nativeAnalytics += 1;
                addOutcome(issue.number, [
                  `- ✅ ${row.label}: Buffer post \`${row.bufferId}\` independently verified **sent** at **${post.sentAt}**${post.externalLink ? ` — ${post.externalLink}` : ''}.`,
                  `  <!-- LINKEDIN_PUBLICATION_VERIFIED bufferId=${row.bufferId} sentAt=${post.sentAt} -->`,
                  ...analyticsLines,
                ]);
                continue;
              }

              if (post.status === 'error') {
                summary.errors += 1;
                addOutcome(issue.number, [
                  `- ❌ ${row.label}: Buffer post \`${row.bufferId}\` is **error**: ${post.error?.message || 'Buffer returned no error message.'}`,
                  `  <!-- LINKEDIN_PUBLICATION_FAILED bufferId=${row.bufferId} -->`,
                ]);
                continue;
              }

              if (Number.isFinite(due) && due > now - 30 * 60 * 1000) {
                summary.future += 1;
                continue;
              }

              summary.pending += 1;
              addOutcome(issue.number, [
                `- ⚠️ ${row.label}: Buffer post \`${row.bufferId}\` is still **${post.status || 'unknown'}** after its grace window.`,
                `  <!-- LINKEDIN_PUBLICATION_PENDING bufferId=${row.bufferId} -->`,
              ]);
            }

            for (const [issueNumber, outcomeLines] of byIssue) {
              if (!outcomeLines.length) continue;
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: [
                  '## Historical publication reconciliation',
                  '',
                  ...outcomeLines,
                  '',
                  'This evidence was read from Buffer in bulk. No Buffer post was created, edited, deleted or rescheduled by this reconciliation.',
                ].join('\n'),
              });
              const issue = candidates.find((candidate) => candidate.number === issueNumber);
              const containsFailureOrPending = outcomeLines.some((line) => line.includes('❌') || line.includes('⚠️'));
              if (containsFailureOrPending && issue?.state === 'closed') {
                await github.rest.issues.update({ owner, repo, issue_number: issueNumber, state: 'open' });
              }
            }

            const unresolvedHistorical = summary.errors + summary.pending + summary.missing;
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: context.issue.number,
              body: [
                '## LinkedIn publication backfill complete',
                '',
                `- Accepted placements examined: **${summary.accepted}**`,
                `- Already publication-resolved before this run: **${summary.alreadyResolved}**`,
                `- Newly verified sent: **${summary.sent}**`,
                `- Newly verified non-public drafts: **${summary.drafts}**`,
                `- Explicit Buffer errors: **${summary.errors}**`,
                `- Still pending after grace window: **${summary.pending}**`,
                `- Future/not-yet-due placements left untouched: **${summary.future}**`,
                `- Accepted IDs not found in Buffer history: **${summary.missing}**`,
                `- Historical native-analytics routes added: **${summary.nativeAnalytics}**`,
                `- Buffer history pages fetched: **${pagesFetched}**`,
                '',
                unresolvedHistorical
                  ? `⚠️ **${unresolvedHistorical} historical placement(s) remain unresolved.** Keep the release gate open.`
                  : '✅ Historical publication evidence is reconciled with no unexplained overdue placement remaining in this backfill scope.',
                '',
                'Buffer access in this workflow is strictly read-only.',
              ].join('\n'),
            });

            if (unresolvedHistorical) {
              core.setFailed(`${unresolvedHistorical} historical publication placement(s) remain unresolved.`);
            } else {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: context.issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }
