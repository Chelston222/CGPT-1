name: LLM Wiki CI

on:
  pull_request:
    paths:
      - 'apps/llm-wiki/**'
      - 'context/**'
      - 'docs/**'
      - 'prompts/**'
      - 'SYSTEMS_CONSTITUTION.md'
  push:
    branches: [main]
    paths:
      - 'apps/llm-wiki/**'
      - 'context/**'
      - 'docs/**'
      - 'prompts/**'
      - 'SYSTEMS_CONSTITUTION.md'
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-health:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/llm-wiki
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile memory modules
        run: python -m compileall -q src tests
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Initialise and ingest repository knowledge
        run: |
          python -m src.cli init
          python -m src.cli ingest --repo ../..
      - name: Hybrid retrieval smoke test
        run: python -m src.cli context "222Emails revenue recovery" --limit 5
      - name: ChatGPT MCP contract smoke test
        run: |
          python - <<'PY'
          from src.kernel import connect
          from src.mcp_server import dispatch
          conn = connect('.data/wiki.db')
          init = dispatch(conn, {'jsonrpc':'2.0','id':1,'method':'initialize','params':{}})
          tools = dispatch(conn, {'jsonrpc':'2.0','id':2,'method':'tools/list','params':{}})
          names = {tool['name'] for tool in tools['result']['tools']}
          assert init['result']['serverInfo']['version'] == '3.0.0'
          assert {'search','fetch','wiki_search','wiki_context','connector_search','wiki_health'} <= names
          assert all(tool['annotations']['readOnlyHint'] for tool in tools['result']['tools'])
          conn.close()
          PY
      - name: Memory health stats
        run: python -m src.cli stats
      - name: Structural and governance lint
        run: python -m src.cli lint --fail-on-error
