name: TTE Klaviyo Deploy Draft Templates

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tte-klaviyo-deploy-drafts.yml'
      - 'apps/tte-klaviyo/update_flow_message_templates.py'

permissions:
  contents: read

jobs:
  deploy-draft-templates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy five reusable draft templates
        env:
          KLAVIYO_PRIVATE_API_KEY: ${{ secrets.KLAVIYO_PRIVATE_API_KEY }}
          FREE_AUDIT_URL: https://form.jotform.com/262067771632056
        run: python apps/tte-klaviyo/deploy_templates.py

      - name: Sync final content into flagship flow message templates
        env:
          KLAVIYO_PRIVATE_API_KEY: ${{ secrets.KLAVIYO_PRIVATE_API_KEY }}
        run: python apps/tte-klaviyo/update_flow_message_templates.py
