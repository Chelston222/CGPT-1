name: LinkedIn Autopost via Buffer

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  publish:
    if: startsWith(github.event.issue.title, '[APPROVED LINKEDIN]') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Check out request checks
        uses: actions/checkout@v4

      - name: Validate, dispatch and audit Buffer posts
        uses: actions/github-script@v7
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_LINKEDIN_PERSONAL_CHANNEL_ID: ${{ secrets.BUFFER_LINKEDIN_PERSONAL_CHANNEL_ID }}
          BUFFER_LINKEDIN_BUSINESS_CHANNEL_ID: ${{ secrets.BUFFER_LINKEDIN_BUSINESS_CHANNEL_ID }}
          BUFFER_LINKEDIN_SECONDARY_CHANNEL_ID: ${{ secrets.BUFFER_LINKEDIN_SECONDARY_CHANNEL_ID }}
        with:
          script: |
            const path = require('node:path');
            const {
              buildCreatePostMutation,
              validateRequest,
            } = require(path.join(process.env.GITHUB_WORKSPACE, 'scripts/linkedin-review-core.cjs'));

            const results = [];
            let request;

            try {
              // This validates every target, secret, schedule, copy variant and media URL
              // before the first Buffer mutation. Buffer does not offer a transaction
              // across channels, so this removes avoidable partial-send failures.
              request = validateRequest(context.payload.issue.body || '', process.env);

              for (const channel of request.channels) {
                const query = buildCreatePostMutation(channel, request.mode, request.mediaUrl);
                const response = await fetch('https://api.buffer.com', {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${process.env.BUFFER_API_KEY}`,
                  },
                  body: JSON.stringify({ query }),
                });

                let payload;
                try {
                  payload = await response.json();
                } catch {
                  throw new Error(`${channel.name}: Buffer returned a non-JSON response.`);
                }

                if (!response.ok) throw new Error(`${channel.name}: Buffer HTTP ${response.status}.`);
                if (payload.errors?.length) {
                  throw new Error(`${channel.name}: ${payload.errors.map((error) => error.message).join('; ')}`);
                }

                const result = payload.data?.createPost;
                if (!result) throw new Error(`${channel.name}: Buffer returned no createPost result.`);
                if (result.message) throw new Error(`${channel.name}: ${result.message}`);
                if (!result.post?.id) throw new Error(`${channel.name}: Buffer did not return a post ID.`);

                results.push({
                  target: channel.target,
                  name: channel.name,
                  postId: result.post.id,
                  dueAt: channel.dueAt,
                });
              }

              const status = request.mode === 'draft' ? 'buffer_draft' : 'scheduled';
              const resultLines = results.map((result) =>
                `- ${result.name}: Buffer post ID \`${result.postId}\`${result.dueAt ? ` — ${result.dueAt}` : ''}`,
              );

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: [
                  '✅ Buffer accepted every requested destination.',
                  '',
                  `- Audit status: **${status}**`,
                  `- Queue post: **${request.postId || 'legacy issue'}**`,
                  `- Revision: **${request.revision}**`,
                  `- Category: **${request.category}**`,
                  `- Mode: **${request.mode}**`,
                  ...resultLines,
                  request.mediaUrl ? '- Media: attached from the explicitly approved HTTPS URL' : '- Media: none',
                  '',
                  request.mode === 'draft'
                    ? 'This validation created Buffer drafts only. Nothing was scheduled or published.'
                    : 'This records Buffer acceptance, not proof of LinkedIn publication. Publication must be recorded separately.',
                ].join('\n'),
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
              });
            } catch (error) {
              const partial = results.length
                ? results.map((result) => `- ${result.name}: Buffer post ID \`${result.postId}\``).join('\n')
                : '- None';

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: [
                  '❌ LinkedIn Buffer dispatch failed closed.',
                  '',
                  `- Error: ${error.message}`,
                  '- Destinations created before the failure:',
                  partial,
                  '',
                  results.length
                    ? 'Do not retry this issue blindly: Buffer cannot roll back a post already created on another channel.'
                    : 'No Buffer post was created by this run.',
                  'The approval issue remains open and nothing should be assumed published.',
                ].join('\n'),
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                title: context.payload.issue.title.replace('[APPROVED LINKEDIN]', '[FAILED LINKEDIN]'),
              });
              core.setFailed(error.message);
            }
