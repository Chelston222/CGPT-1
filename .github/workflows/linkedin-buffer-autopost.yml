name: LinkedIn Autopost via Buffer

on:
  issues:
    types: [opened]
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

# One global release lock protects Buffer capacity calculations. GitHub keeps at
# most one pending run per concurrency group, so every surviving run drains the
# full open approval queue rather than processing only its triggering issue.
concurrency:
  group: linkedin-buffer-capacity-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'issues' || ((startsWith(github.event.issue.title, '[APPROVED LINKEDIN]') || startsWith(github.event.issue.title, '[APPROVED LINKEDIN WEEK]')) && github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    steps:
      - name: Check out approval checks
        uses: actions/checkout@v4

      - name: Validate approval, release within capacity and audit
        uses: actions/github-script@v7
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_LINKEDIN_PERSONAL_CHANNEL_ID: ${{ secrets.BUFFER_LINKEDIN_PERSONAL_CHANNEL_ID }}
          BUFFER_LINKEDIN_BUSINESS_CHANNEL_ID: ${{ secrets.BUFFER_LINKEDIN_BUSINESS_CHANNEL_ID }}
          BUFFER_LINKEDIN_SECONDARY_CHANNEL_ID: ${{ secrets.BUFFER_LINKEDIN_SECONDARY_CHANNEL_ID }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
        with:
          script: |
            const path = require('node:path');
            const fs = require('node:fs');
            const { buildCreatePostMutation, validateRequest } = require(path.join(process.env.GITHUB_WORKSPACE, 'scripts/linkedin-review-core.cjs'));
            const { preflightMedia } = require(path.join(process.env.GITHUB_WORKSPACE, 'scripts/linkedin-media-preflight.cjs'));
            const { postBody, validateWeeklyBatch, withQaReplenishment } = require(path.join(process.env.GITHUB_WORKSPACE, 'scripts/linkedin-week-batch.cjs'));
            const { acceptedMarker, classifyBufferFailure, localDate, parseAcceptedMarkers, planCapacityWindow, validateDailyPlacementLimit } = require(path.join(process.env.GITHUB_WORKSPACE, 'scripts/linkedin-buffer-capacity.cjs'));
            const { assertLiveNotionQualityGate } = require(path.join(process.env.GITHUB_WORKSPACE, 'scripts/linkedin-notion-quality-gate.cjs'));

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const baseQueue = JSON.parse(fs.readFileSync(path.join(process.env.GITHUB_WORKSPACE, 'apps/linkedin-review/queue.json'), 'utf8'));
            const queue = withQaReplenishment(baseQueue);

            async function buffer(query) {
              const response = await fetch('https://api.buffer.com', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${process.env.BUFFER_API_KEY}` },
                body: JSON.stringify({ query }),
              });
              let payload;
              try { payload = await response.json(); } catch { payload = {}; }
              const messages = [...(payload.errors || []).map((error) => error.message), payload.data?.createPost?.message].filter(Boolean);
              if (!response.ok || messages.length) {
                const error = new Error(messages.join('; ') || `Buffer HTTP ${response.status}`);
                error.failure = classifyBufferFailure({ status: response.status, messages, headers: Object.fromEntries(response.headers.entries()) });
                throw error;
              }
              return payload.data;
            }

            async function queueOccupancy(channelIds) {
              const account = await buffer('query CapacityAccount { account { organizations { id } } }');
              const organizationId = account.account?.organizations?.[0]?.id;
              if (!organizationId) throw new Error('Buffer returned no organisation ID for capacity preflight.');
              const query = `query ScheduledCapacity { posts(first: 100, input: { organizationId: ${JSON.stringify(organizationId)}, filter: { status: [scheduled], channelIds: ${JSON.stringify(channelIds)} } }) { edges { node { id channelId dueAt status } } pageInfo { hasNextPage } } }`;
              const data = await buffer(query);
              if (data.posts?.pageInfo?.hasNextPage) throw new Error('Buffer capacity preflight returned more than 100 scheduled posts; refusing an incomplete count.');
              const counts = Object.fromEntries(channelIds.map((id) => [id, 0]));
              const scheduled = [];
              for (const edge of data.posts?.edges || []) {
                counts[edge.node.channelId] = (counts[edge.node.channelId] || 0) + 1;
                scheduled.push({ channelId: edge.node.channelId, dueAt: edge.node.dueAt });
              }
              return { counts, scheduled };
            }

            function requestFingerprint(request) {
              return JSON.stringify({
                postId: request.postId,
                revision: String(request.revision),
                category: request.category,
                mode: request.mode,
                mediaUrl: request.mediaUrl || null,
                mediaKind: request.mediaKind,
                mediaAltText: request.mediaAltText || '',
                mediaBytes: request.mediaBytes || null,
                mediaSha256: request.mediaSha256 || null,
                documentTitle: request.documentTitle || '',
                documentThumbnailUrl: request.documentThumbnailUrl || null,
                documentPageCount: request.documentPageCount || null,
                channels: request.channels.map((channel) => ({
                  target: channel.target,
                  id: channel.id,
                  text: channel.text,
                  dueAt: channel.dueAt || null,
                })),
              });
            }

            // Never process only the triggering issue. GitHub concurrency may replace an
            // older pending run with a newer one, so the surviving run must drain all
            // current approvals under the same global capacity lock.
            const issues = (await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', creator: owner, per_page: 100,
            }))
              .filter((issue) => !issue.pull_request && (issue.title.startsWith('[APPROVED LINKEDIN WEEK]') || issue.title.startsWith('[APPROVED LINKEDIN]')))
              .sort((a, b) => a.number - b.number);

            for (const issue of issues) {
              const results = [];
              try {
                const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: issue.number, per_page: 100 });
                const accepted = parseAcceptedMarkers(comments);
                const isWeekly = issue.title.startsWith('[APPROVED LINKEDIN WEEK]');
                const batch = isWeekly ? validateWeeklyBatch(issue.body || '', baseQueue, process.env, Date.parse(issue.created_at), { allowGeneratedAtDrift: accepted.size > 0 }) : null;

                let jobs;
                if (isWeekly) {
                  jobs = batch.jobs;
                } else {
                  const approvedRequest = validateRequest(issue.body || '', process.env, Date.parse(issue.created_at));
                  const queuePost = (queue.posts || []).find((post) => post.id === approvedRequest.postId && String(post.revision) === String(approvedRequest.revision));
                  if (!queuePost) throw new Error(`${approvedRequest.postId}@${approvedRequest.revision} is not the current locked queue revision. Legacy issue-only dispatch is disabled.`);
                  const lockedRequest = validateRequest(postBody(queuePost), process.env, Date.parse(issue.created_at));
                  if (requestFingerprint(approvedRequest) !== requestFingerprint(lockedRequest)) {
                    throw new Error(`${approvedRequest.postId}@${approvedRequest.revision} approval body does not exactly match the locked queue copy, schedule, targets or media.`);
                  }
                  jobs = [{ post: queuePost, request: lockedRequest }];
                }

                const qualitySnapshots = [];
                const modes = new Set();
                for (const job of jobs) {
                  const queuePost = (queue.posts || []).find((post) => post.id === job.post.id && String(post.revision) === String(job.post.revision));
                  if (!queuePost) throw new Error(`${job.post.id}@${job.post.revision} is not the current locked queue revision.`);
                  if (process.env.NOTION_API_KEY && queuePost.sourceType !== 'qa_replenishment' && queuePost.sourceType !== 'qa_weekly_replenishment') {
                    const quality = await assertLiveNotionQualityGate(queuePost, process.env.NOTION_API_KEY, fetch);
                    modes.add('live-notion');
                    qualitySnapshots.push({ id: queuePost.id, revision: queuePost.revision, ...quality.snapshot, mode: 'live-notion' });
                  } else {
                    modes.add('owner-approved-current-queue');
                    qualitySnapshots.push({ id: queuePost.id, revision: queuePost.revision, mode: 'owner-approved-current-queue' });
                  }
                }
                const qualityMode = modes.size === 1 ? [...modes][0] : [...modes].sort().join('+');

                const channelIdByTarget = Object.fromEntries(jobs.flatMap((job) => job.request.channels.map((channel) => [channel.target, channel.id])));
                const capacity = await queueOccupancy(Object.values(channelIdByTarget));
                const occupancy = Object.fromEntries(Object.entries(channelIdByTarget).map(([target, id]) => [target, capacity.counts[id] || 0]));
                const plan = planCapacityWindow(jobs, occupancy, accepted);

                const targetByChannelId = Object.fromEntries(Object.entries(channelIdByTarget).map(([target, id]) => [id, target]));
                const proposedJobs = plan.dispatch.map(({ job, channel }) => ({
                  post: job.post,
                  request: { mode: job.request.mode, channels: [channel] },
                }));
                const proposedDates = new Set(plan.dispatch.map(({ channel }) => localDate(channel.dueAt, queue.timezone || 'Europe/London')).filter(Boolean));
                const occupiedJobs = capacity.scheduled
                  .filter((entry) => proposedDates.has(localDate(entry.dueAt, queue.timezone || 'Europe/London')))
                  .map((entry, index) => ({
                    post: { id: `buffer-existing-${index}`, revision: 1 },
                    request: { mode: 'schedule', channels: [{ target: targetByChannelId[entry.channelId], dueAt: entry.dueAt }] },
                  }));
                validateDailyPlacementLimit([...occupiedJobs, ...proposedJobs], 15, 5, queue.timezone || 'Europe/London');

                const mediaProofs = new Map();
                for (const { job } of plan.dispatch) {
                  const proofKey = `${job.post.id}@${job.post.revision}`;
                  if (!job.request.mediaUrl || mediaProofs.has(proofKey)) continue;
                  mediaProofs.set(proofKey, await preflightMedia(job.request, fetch));
                }

                for (const { job, channel, key } of plan.dispatch) {
                  if (channel.dueAt && new Date(channel.dueAt).getTime() <= Date.now() + 5 * 60_000) {
                    throw new Error(`${job.post.id} / ${channel.name}: approved time is too close or has passed; revise the schedule and approve the new revision.`);
                  }
                  const media = job.request.mediaUrl ? {
                    url: job.request.mediaUrl,
                    kind: job.request.mediaKind,
                    title: job.request.documentTitle,
                    thumbnailUrl: job.request.documentThumbnailUrl,
                    altText: job.request.mediaAltText,
                  } : null;
                  const data = await buffer(buildCreatePostMutation(channel, job.request.mode, media));
                  const result = data.createPost;
                  if (!result?.post?.id) throw new Error(`${job.post.id} / ${channel.name}: Buffer did not return a post ID.`);
                  const proof = mediaProofs.get(`${job.post.id}@${job.post.revision}`)?.media || null;
                  results.push({ key, queueId: job.post.id, revision: job.post.revision, name: channel.name, postId: result.post.id, dueAt: channel.dueAt, mediaProof: proof });
                }

                const resultLines = results.map((result) => `- ${result.queueId}@${result.revision} · ${result.name}: Buffer post ID \`${result.postId}\`${result.dueAt ? ` — ${result.dueAt}` : ''}${result.mediaProof ? ` — media ${result.mediaProof.bytes} bytes / SHA-256 ${result.mediaProof.sha256}` : ''}\n  ${acceptedMarker(result.key)}`);
                const qualityLines = qualitySnapshots.map((snapshot) => snapshot.mode === 'live-notion'
                  ? `- ${snapshot.id}@${snapshot.revision}: ${snapshot.decision} · ${snapshot.approval} · Anti-DNA ${snapshot.antiDnaPass ? 'PASS' : 'FAIL'} · ${snapshot.automationStatus}`
                  : `- ${snapshot.id}@${snapshot.revision}: ${snapshot.mode}`);
                const waiting = plan.waiting.length;
                const waitingMarker = `<!-- BUFFER_CAPACITY_WAIT ${waiting} -->`;
                const alreadyReportedSameWait = comments.some((comment) => comment.user?.login === 'github-actions[bot]' && String(comment.body || '').includes(waitingMarker));
                if (results.length || !waiting || !alreadyReportedSameWait) await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number, body: [
                    waiting ? '🕒 Buffer capacity window processed.' : '✅ Buffer accepted every remaining requested destination.',
                    '',
                    `- Quality gate mode: **${qualityMode}**`,
                    ...qualityLines,
                    `- Audit status: **${waiting ? 'approved — waiting for Buffer capacity' : 'scheduled'}**`,
                    batch ? `- Approved week: **${batch.weekStart} to ${batch.weekEnd}**` : `- Queue post: **${jobs[0].post.id}**`,
                    `- Already accepted before this run: **${plan.alreadyAccepted.length}**`,
                    `- Accepted in this run: **${results.length}**`,
                    `- Waiting for a free queue slot: **${waiting}**`,
                    ...(resultLines.length ? resultLines : ['- No new Buffer placements were created in this capacity check.']),
                    '',
                    waiting ? 'The exact owner approval remains locked. The next automatic capacity check will resume without recreating accepted destinations.' : 'This records Buffer acceptance, not proof of LinkedIn publication. Publication verification is handled separately after the due time.',
                    waiting ? waitingMarker : '',
                  ].join('\n'),
                });
                if (!waiting) await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
              } catch (error) {
                const retryable = error.failure?.retryable === true;
                const partial = results.length
                  ? results.map((result) => `- ${result.queueId}@${result.revision} · ${result.name}: Buffer post ID \`${result.postId}\`\n  ${acceptedMarker(result.key)}`).join('\n')
                  : '- None';
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: [
                    '❌ LinkedIn Buffer dispatch failed closed.', '',
                    `- Error: ${error.message}`,
                    `- Failure class: **${error.failure?.code || (error.qualityGate ? 'live_quality_gate' : 'preflight_failure')}**`,
                    '- Destinations created before the failure:', partial, '',
                    retryable ? 'The next capacity check will retry and skip every destination recorded above.' : 'This needs correction and a new revision before scheduling can continue.',
                    'Nothing should be assumed published.',
                  ].join('\n'),
                });
                if (!retryable) await github.rest.issues.update({
                  owner, repo, issue_number: issue.number,
                  title: issue.title.replace('[APPROVED LINKEDIN WEEK]', '[FAILED LINKEDIN WEEK]').replace('[APPROVED LINKEDIN]', '[FAILED LINKEDIN]'),
                });
                if (context.eventName === 'issues') core.setFailed(error.message);
              }
            }
