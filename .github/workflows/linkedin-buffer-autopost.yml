name: LinkedIn Autopost via Buffer

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  publish:
    if: startsWith(github.event.issue.title, '[APPROVED LINKEDIN]') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Validate and create Buffer post
        uses: actions/github-script@v7
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_LINKEDIN_PERSONAL_CHANNEL_ID: ${{ secrets.BUFFER_LINKEDIN_PERSONAL_CHANNEL_ID }}
          BUFFER_LINKEDIN_BUSINESS_CHANNEL_ID: ${{ secrets.BUFFER_LINKEDIN_BUSINESS_CHANNEL_ID }}
        with:
          script: |
            const body = context.payload.issue.body || '';
            const lines = body.split(/\r?\n/);
            const header = {};
            let separator = -1;

            for (let i = 0; i < lines.length; i++) {
              if (lines[i].trim() === '---') {
                separator = i;
                break;
              }
              const match = lines[i].match(/^([A-Z_]+):\s*(.*)$/);
              if (match) header[match[1]] = match[2].trim();
            }

            if (separator < 0) throw new Error('Missing --- separator. Use the approved post template.');
            if (!process.env.BUFFER_API_KEY) throw new Error('Missing BUFFER_API_KEY repository secret.');

            const text = lines.slice(separator + 1).join('\n').trim();
            if (!text) throw new Error('Post text is empty.');
            if (text.length > 3000) throw new Error('Post exceeds the 3,000-character safety limit.');

            const target = (header.TARGET || 'personal').toLowerCase();
            if (!['personal', 'business', 'both'].includes(target)) {
              throw new Error('TARGET must be personal, business, or both.');
            }

            const targets = [];
            if (target === 'personal' || target === 'both') {
              if (!process.env.BUFFER_LINKEDIN_PERSONAL_CHANNEL_ID) {
                throw new Error('Missing BUFFER_LINKEDIN_PERSONAL_CHANNEL_ID repository secret.');
              }
              targets.push({ name: 'LinkedIn personal', id: process.env.BUFFER_LINKEDIN_PERSONAL_CHANNEL_ID });
            }
            if (target === 'business' || target === 'both') {
              if (!process.env.BUFFER_LINKEDIN_BUSINESS_CHANNEL_ID) {
                throw new Error('Missing BUFFER_LINKEDIN_BUSINESS_CHANNEL_ID repository secret.');
              }
              targets.push({ name: 'LinkedIn business', id: process.env.BUFFER_LINKEDIN_BUSINESS_CHANNEL_ID });
            }

            const mode = (header.MODE || 'schedule').toLowerCase();
            if (!['schedule', 'queue', 'draft'].includes(mode)) {
              throw new Error('MODE must be schedule, queue, or draft.');
            }

            let dueAtIso = null;
            let scheduleLabel = 'Buffer queue';
            if (mode === 'schedule') {
              if (!header.SCHEDULE_AT) throw new Error('SCHEDULE_AT is required when MODE is schedule.');
              const dueAt = new Date(header.SCHEDULE_AT);
              if (Number.isNaN(dueAt.getTime())) throw new Error('SCHEDULE_AT is not a valid ISO date/time.');
              if (dueAt.getTime() <= Date.now() + 60_000) {
                throw new Error('SCHEDULE_AT must be at least one minute in the future.');
              }
              dueAtIso = dueAt.toISOString();
              scheduleLabel = dueAtIso;
            } else if (mode === 'draft') {
              scheduleLabel = 'Saved as Buffer draft';
            }

            let mediaUrl = null;
            if (header.MEDIA_URL) {
              try {
                mediaUrl = new URL(header.MEDIA_URL);
              } catch {
                throw new Error('MEDIA_URL is invalid.');
              }
              if (mediaUrl.protocol !== 'https:') throw new Error('MEDIA_URL must use HTTPS.');
            }

            const results = [];
            for (const channel of targets) {
              const fields = [
                `text: ${JSON.stringify(text)}`,
                `channelId: ${JSON.stringify(channel.id)}`,
                'schedulingType: automatic'
              ];

              if (mode === 'schedule') {
                fields.push('mode: customScheduled');
                fields.push(`dueAt: ${JSON.stringify(dueAtIso)}`);
              } else {
                fields.push('mode: addToQueue');
                if (mode === 'draft') fields.push('saveToDraft: true');
              }

              if (mediaUrl) {
                fields.push(`assets: [{ image: { url: ${JSON.stringify(mediaUrl.toString())} } }]`);
              }

              const query = `
                mutation CreatePost {
                  createPost(input: {
                    ${fields.join(',\n                    ')}
                  }) {
                    ... on PostActionSuccess {
                      post {
                        id
                        text
                        assets { id mimeType }
                      }
                    }
                    ... on MutationError { message }
                  }
                }
              `;

              const response = await fetch('https://api.buffer.com', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${process.env.BUFFER_API_KEY}`
                },
                body: JSON.stringify({ query })
              });

              let payload;
              try {
                payload = await response.json();
              } catch {
                throw new Error(`${channel.name}: Buffer returned a non-JSON response.`);
              }

              if (!response.ok) throw new Error(`${channel.name}: Buffer HTTP ${response.status}`);
              if (payload.errors?.length) {
                throw new Error(`${channel.name}: ${payload.errors.map(e => e.message).join('; ')}`);
              }

              const result = payload.data?.createPost;
              if (!result) throw new Error(`${channel.name}: Buffer returned no createPost result.`);
              if (result.message) throw new Error(`${channel.name}: ${result.message}`);
              if (!result.post?.id) throw new Error(`${channel.name}: Buffer did not return a post ID.`);

              results.push(`- ${channel.name}: Buffer post ID \`${result.post.id}\``);
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ Sent to Buffer successfully.\n\n${results.join('\n')}\n- Mode: **${mode}**\n- Scheduled/queue value: **${scheduleLabel}**${mediaUrl ? '\n- Media: attached from approved HTTPS URL' : ''}`
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '❌ LinkedIn autopost failed. Open the Actions run for the exact validation or Buffer error. The issue remains open and nothing should be assumed published.'
            });
