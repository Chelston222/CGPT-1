name: LinkedIn Autopost via Buffer

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  publish:
    if: (startsWith(github.event.issue.title, '[APPROVED LINKEDIN]') || startsWith(github.event.issue.title, '[APPROVED LINKEDIN WEEK]')) && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Check out request checks
        uses: actions/checkout@v4

      - name: Validate, dispatch and audit Buffer posts
        uses: actions/github-script@v7
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_LINKEDIN_PERSONAL_CHANNEL_ID: ${{ secrets.BUFFER_LINKEDIN_PERSONAL_CHANNEL_ID }}
          BUFFER_LINKEDIN_BUSINESS_CHANNEL_ID: ${{ secrets.BUFFER_LINKEDIN_BUSINESS_CHANNEL_ID }}
          BUFFER_LINKEDIN_SECONDARY_CHANNEL_ID: ${{ secrets.BUFFER_LINKEDIN_SECONDARY_CHANNEL_ID }}
        with:
          script: |
            const path = require('node:path');
            const fs = require('node:fs');
            const {
              buildCreatePostMutation,
              validateRequest,
            } = require(path.join(process.env.GITHUB_WORKSPACE, 'scripts/linkedin-review-core.cjs'));
            const { validateWeeklyBatch } = require(path.join(process.env.GITHUB_WORKSPACE, 'scripts/linkedin-week-batch.cjs'));

            const results = [];
            let jobs = [];
            let batch = null;

            try {
              const isWeekly = context.payload.issue.title.startsWith('[APPROVED LINKEDIN WEEK]');
              if (isWeekly) {
                const queue = JSON.parse(fs.readFileSync(path.join(process.env.GITHUB_WORKSPACE, 'apps/linkedin-review/queue.json'), 'utf8'));
                batch = validateWeeklyBatch(context.payload.issue.body || '', queue, process.env);
                jobs = batch.jobs;
              } else {
                const request = validateRequest(context.payload.issue.body || '', process.env);
                jobs = [{ post: { id: request.postId, revision: request.revision, category: request.category }, request }];
              }

              // All jobs are fully validated above before the first Buffer request.
              for (const job of jobs) {
                for (const channel of job.request.channels) {
                  const query = buildCreatePostMutation(channel, job.request.mode, job.request.mediaUrl);
                  const response = await fetch('https://api.buffer.com', {
                    method: 'POST',
                    headers: {
                      'Content-Type': 'application/json',
                      'Authorization': `Bearer ${process.env.BUFFER_API_KEY}`,
                    },
                    body: JSON.stringify({ query }),
                  });

                  let payload;
                  try {
                    payload = await response.json();
                  } catch {
                    throw new Error(`${job.post.id} / ${channel.name}: Buffer returned a non-JSON response.`);
                  }

                  if (!response.ok) throw new Error(`${job.post.id} / ${channel.name}: Buffer HTTP ${response.status}.`);
                  if (payload.errors?.length) throw new Error(`${job.post.id} / ${channel.name}: ${payload.errors.map((error) => error.message).join('; ')}`);

                  const result = payload.data?.createPost;
                  if (!result) throw new Error(`${job.post.id} / ${channel.name}: Buffer returned no createPost result.`);
                  if (result.message) throw new Error(`${job.post.id} / ${channel.name}: ${result.message}`);
                  if (!result.post?.id) throw new Error(`${job.post.id} / ${channel.name}: Buffer did not return a post ID.`);

                  results.push({ queueId: job.post.id, revision: job.post.revision, target: channel.target, name: channel.name, postId: result.post.id, dueAt: channel.dueAt });
                }
              }

              const resultLines = results.map((result) =>
                `- ${result.queueId}@${result.revision} · ${result.name}: Buffer post ID \`${result.postId}\`${result.dueAt ? ` — ${result.dueAt}` : ''}`,
              );

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: [
                  '✅ Buffer accepted every requested destination.',
                  '',
                  '- Audit status: **scheduled**',
                  batch ? `- Approved week: **${batch.weekStart} to ${batch.weekEnd}**` : `- Queue post: **${jobs[0].post.id || 'legacy issue'}**`,
                  `- Locked items: **${jobs.length}**`,
                  ...resultLines,
                  '',
                  'This records Buffer acceptance, not proof of LinkedIn publication. Publication must be recorded separately.',
                ].join('\n'),
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
              });
            } catch (error) {
              const partial = results.length
                ? results.map((result) => `- ${result.queueId}@${result.revision} · ${result.name}: Buffer post ID \`${result.postId}\``).join('\n')
                : '- None';

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: [
                  '❌ LinkedIn Buffer dispatch failed closed.',
                  '',
                  `- Error: ${error.message}`,
                  '- Destinations created before the failure:',
                  partial,
                  '',
                  results.length
                    ? 'Do not retry this issue blindly: Buffer cannot roll back a post already created on another channel.'
                    : 'No Buffer post was created by this run.',
                  'The approval issue remains open and nothing should be assumed published.',
                ].join('\n'),
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                title: context.payload.issue.title
                  .replace('[APPROVED LINKEDIN WEEK]', '[FAILED LINKEDIN WEEK]')
                  .replace('[APPROVED LINKEDIN]', '[FAILED LINKEDIN]'),
              });
              core.setFailed(error.message);
            }
