name: OMEGA Memory Netlify CI

on:
  pull_request:
    paths:
      - 'apps/omega-memory-netlify/**'
      - '.github/workflows/omega-memory-netlify-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/omega-memory-netlify/**'
      - '.github/workflows/omega-memory-netlify-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/omega-memory-netlify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/omega-memory-netlify/package-lock.json
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm run check
      - run: npm test
