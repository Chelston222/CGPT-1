<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chelsi's Crown</title>
  <style>
    body{margin:0;padding:0;background:#F7F2E8;color:#163A2B;font-family:Arial,Helvetica,sans-serif;}
    .wrap{width:100%;background:#F7F2E8;padding:24px 0;}
    .card{max-width:620px;margin:0 auto;background:#FFFFFF;border-radius:18px;overflow:hidden;}
    .header{padding:30px 34px 18px;background:#163A2B;color:#FFFFFF;}
    .brand{font-family:Georgia,'Times New Roman',serif;font-size:30px;line-height:1.1;margin:0;}
    .content{padding:34px;}
    h1,h2{font-family:Georgia,'Times New Roman',serif;color:#163A2B;}
    p{font-size:16px;line-height:1.65;margin:0 0 18px;}
    .button{display:inline-block;background:#163A2B;color:#FFFFFF!important;text-decoration:none;padding:14px 22px;border-radius:999px;font-weight:700;}
    .rule{height:1px;background:#D5BC77;margin:28px 0;}
    .footer{padding:24px 34px 32px;font-size:12px;line-height:1.5;color:#6E6E68;}
    @media(max-width:640px){.wrap{padding:0}.card{border-radius:0}.header,.content,.footer{padding-left:22px;padding-right:22px}.brand{font-size:27px}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="header"><p class="brand">Chelsi's Crown</p></div>
      <div class="content">
        <p>Hi {{ first_name|default:'there' }},</p>
        <!-- MESSAGE_BODY -->
        <p><a class="button" href="{{ booking_url|default:'#' }}">View availability</a></p>
        <div class="rule"></div>
        <p style="font-size:14px">Chelsi's Crown</p>
      </div>
      <div class="footer">
        <p>You are receiving this because you asked to hear from Chelsi's Crown or this message is part of a relevant service journey.</p>
        <p>{% unsubscribe %}</p>
      </div>
    </div>
  </div>
</body>
</html>
